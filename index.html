<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hills ERP — Shop Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131A2C;
    --navy:#161F38;
    --navy2:#0C1226;
    --accent:#4A5CFF;
    --accent2:#17D9C4;
    --accent-soft:#EAEDFF;
    --amber:#B9711A;
    --amber-soft:#FBF0DE;
    --green:#159A6B;
    --green-soft:#E1F7EE;
    --red:#E0454B;
    --red-soft:#FCEAEA;
    --paper:#F3F6FC;
    --card:#FFFFFF;
    --line:#E4E9F5;
    --muted:#6B7789;
    --shadow-sm:0 2px 8px rgba(24,35,80,.06);
    --shadow-md:0 8px 28px rgba(24,35,80,.10);
    --shadow-lg:0 18px 48px rgba(24,35,80,.16);
  }
  *{box-sizing:border-box;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes auroraDrift{0%{transform:translate(-6%,-4%) scale(1);}50%{transform:translate(5%,6%) scale(1.12);}100%{transform:translate(-6%,-4%) scale(1);}}
  @keyframes navGlow{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
  body{margin:0;font-family:'Inter','Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Sora','Segoe UI',Arial,sans-serif;}
  #app{display:flex;min-height:100vh;}
  nav{width:216px;background:linear-gradient(175deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;flex-shrink:0;padding:22px 0;position:relative;overflow:hidden;}
  nav::before{content:'';position:absolute;top:-40%;left:-30%;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(74,92,255,.35),transparent 70%);filter:blur(10px);pointer-events:none;animation:navGlow 6s ease-in-out infinite;}
  nav .brand{font-size:19px;font-weight:800;padding:0 20px 22px 20px;letter-spacing:.3px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;position:relative;z-index:1;
    background:linear-gradient(90deg,#fff,#AEBBDD);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  nav .brand span{display:block;font-size:11px;font-weight:400;color:#AEBBDD;margin-top:3px;letter-spacing:.5px;-webkit-text-fill-color:#AEBBDD;}
  .navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:#C9D3EB;font-size:14.5px;padding:12px 20px;cursor:pointer;border-left:3px solid transparent;font-family:inherit;position:relative;z-index:1;transition:background .18s,color .18s,border-color .18s,padding-left .18s;}
  .navbtn:hover{background:rgba(255,255,255,.07);color:#fff;padding-left:24px;}
  .navbtn.active{background:linear-gradient(90deg,rgba(74,92,255,.22),rgba(74,92,255,.02));color:#fff;border-left:3px solid var(--accent);font-weight:600;}
  main{flex:1;padding:26px 34px;max-width:1180px;}
  main #content > *{animation:fadeInUp .32s ease both;}
  h1{font-size:22px;margin:0 0 4px 0;font-weight:700;letter-spacing:-.2px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .stat .n{font-size:26px;font-weight:800;color:var(--navy);font-family:'Sora',sans-serif;background:linear-gradient(120deg,var(--navy),var(--accent) 140%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .clickable{cursor:pointer;transition:box-shadow .18s,border-color .18s,transform .18s;}
  .clickable:hover{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-md);border-color:var(--accent);transform:translateY(-3px);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding:8px 10px;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tr{transition:background .12s;}
  tbody tr:hover{background:#F7F9FF;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .tag.instock{background:var(--green-soft);color:var(--green);}
  .tag.sold{background:var(--red-soft);color:var(--red);}
  .tag.low{background:var(--amber-soft);color:var(--amber);}
  .tag.cancelled{background:#E7E9ED;color:var(--muted);}
  input,select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;transition:border-color .16s,box-shadow .16s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row .field{flex:1;min-width:150px;}
  button.btn{background:linear-gradient(135deg,var(--accent),#6C7CFF);color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(74,92,255,.28);transition:transform .15s,box-shadow .15s,opacity .15s;}
  button.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(74,92,255,.36);opacity:1;}
  button.btn:active{transform:translateY(0);}
  button.btn.outline{background:#fff;color:var(--accent);border:1px solid var(--accent);box-shadow:none;}
  button.btn.outline:hover{background:var(--accent-soft);box-shadow:none;}
  button.btn.wa{background:linear-gradient(135deg,#1E8A57,#25B36F);box-shadow:0 4px 14px rgba(30,138,87,.28);}
  button.btn.danger{background:linear-gradient(135deg,var(--red),#F0666B);box-shadow:0 4px 14px rgba(224,69,75,.28);}
  button.btn.sm{padding:5px 11px;font-size:12px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tabbtn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);font-family:inherit;transition:all .16s;}
  .tabbtn:hover{border-color:var(--accent);color:var(--accent);}
  .tabbtn.active{background:linear-gradient(135deg,var(--accent-soft),#fff);color:var(--accent);border-color:var(--accent);}
  .notice{background:var(--accent-soft);border:1px solid #C7D8FA;color:var(--navy);padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:18px;}
  .cartline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .empty{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center;}
  .searchbar{display:flex;gap:10px;margin-bottom:16px;}
  .searchbar input{flex:1;}
  .total-box{text-align:right;font-size:19px;font-weight:800;color:var(--navy);margin-top:8px;}
  .invoice-preview{background:#fbfcfe;border:1px dashed var(--line);padding:14px;border-radius:10px;font-size:13px;white-space:pre-wrap;margin-top:10px;}
  .stat.wide .n{font-size:21px;}
  .searchresults .card{margin-bottom:12px;}
  .sr-section-title{font-weight:800;color:var(--navy);margin:18px 0 6px 0;font-size:14px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#C9D3EB;border-radius:8px;}
  nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);}
  #invoiceImageCard{position:fixed;left:-9999px;top:0;width:360px;background:#fff;padding:20px;font-family:'Segoe UI',Arial,sans-serif;color:#132033;}
  #invoiceImageCard h2{margin:0 0 2px 0;font-size:18px;}
  #invoiceImageCard .biz-sub{font-size:11px;color:#6B7789;margin-bottom:10px;}
  #invoiceImageCard table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #invoiceImageCard td,#invoiceImageCard th{padding:5px 2px;border-bottom:1px solid #E3E8F0;text-align:left;}
  #invoiceImageCard .tot{font-size:15px;font-weight:800;text-align:right;margin-top:8px;}
  .inv-qr-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .inv-qr-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .inv-qr-img{border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;}
  .inv-qr-label{font-size:9.5px;font-weight:700;letter-spacing:0.3px;}

  /* ---------- Responsive: mobile + desktop, single-screen friendly ---------- */
  .mobile-topbar{display:none;}
  .nav-backdrop{display:none;}
  * { -webkit-tap-highlight-color: transparent; }
  @media (max-width: 900px){
    .mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:80;
      box-shadow:0 4px 16px rgba(12,18,38,.25);
    }
    .mobile-topbar .brand{font-weight:800;font-size:15.5px;}
    .mobile-topbar .brand span{display:block;font-size:10.5px;font-weight:400;color:#AEBBDD;}
    .hamburger{background:none;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:6px 8px;border-radius:6px;}
    .hamburger:active{background:rgba(255,255,255,.12);}
    #app{display:block;min-height:auto;}
    nav{
      position:fixed;top:0;left:0;height:100%;width:250px;max-width:82vw;
      transform:translateX(-100%);transition:transform .22s ease;z-index:100;
      overflow-y:auto;box-shadow:2px 0 18px rgba(0,0,0,.25);
    }
    nav.open{transform:translateX(0);}
    .nav-backdrop.show{
      display:block;position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:90;
    }
    .navbtn{padding:14px 20px;font-size:15px;}
    main{padding:14px 12px 30px 12px;max-width:100%;}
    .grid4{grid-template-columns:repeat(2,1fr);gap:10px;}
    .row .field{min-width:100%;}
    .card{padding:14px 14px;}
    .searchbar{flex-direction:column;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;}
    .tabbtn{white-space:nowrap;}
    .card{overflow-x:auto;}
    .card table{min-width:540px;}
  }
  @media (max-width: 480px){
    .grid4{grid-template-columns:1fr;}
    main{padding:12px 10px 26px 10px;}
    .stat .n{font-size:21px;}
    .stat{padding:13px 14px;}
    table{font-size:12.5px;}
    th,td{padding:7px 6px;}
    .btn,.tabbtn{font-size:13.5px;padding:9px 14px;}
    input,select,textarea{font-size:16px !important;}
  }

  /* ---------- Custom modal (replaces native alert/confirm/prompt) ---------- */
  .ui-modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);backdrop-filter:blur(2px);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
  .ui-modal-overlay.show{display:flex;}
  .ui-modal-box{background:#fff;border-radius:16px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(12,18,38,.35);animation:popIn .18s ease both;}
  .ui-modal-message{font-size:14px;color:var(--ink);margin-bottom:14px;white-space:pre-wrap;line-height:1.45;}
  .ui-modal-input-wrap{margin-bottom:14px;}
  .ui-modal-input-wrap input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:15px;font-family:inherit;}
  .ui-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<div id="uiModalOverlay" class="ui-modal-overlay">
  <div class="ui-modal-box">
    <div class="ui-modal-message" id="uiModalMessage"></div>
    <div class="ui-modal-input-wrap" id="uiModalInputWrap" style="display:none">
      <input type="text" id="uiModalInput">
    </div>
    <div class="ui-modal-actions" id="uiModalActions"></div>
  </div>
</div>
<div id="invoiceImageCard"></div>
<div class="mobile-topbar">
  <button class="hamburger" id="navHamburger" aria-label="Menu">☰</button>
  <div class="brand">Hills ERP<span>Shop Management</span></div>
  <span style="width:34px"></span>
</div>
<div class="nav-backdrop" id="navBackdrop"></div>
<div id="authScreen" style="display:none;min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(160deg,#0C1226 0%,#161F38 55%,#101A33 100%);padding:40px 16px;box-sizing:border-box">
  <div style="position:absolute;top:-10%;left:-10%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(74,92,255,.45),transparent 70%);filter:blur(30px);animation:auroraDrift 14s ease-in-out infinite;pointer-events:none"></div>
  <div style="position:absolute;bottom:-15%;right:-10%;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(23,217,196,.35),transparent 70%);filter:blur(30px);animation:auroraDrift 18s ease-in-out infinite reverse;pointer-events:none"></div>
  <div id="authScreenInner" style="position:relative;z-index:1"></div>
</div>
<div id="app">
  <nav id="mainNav">
    <div class="brand">Hills ERP<span>Shop Management System</span></div>
    <button class="navbtn" data-view="dashboard">Dashboard</button>
    <button class="navbtn" data-view="newsale">New Sale</button>

    <button class="navbtn" data-view="search">🔎 Search (Name/Phone/IMEI)</button>
    <button class="navbtn" data-view="expenses">💵 Expenses</button>
    <button class="navbtn" data-view="reports">Reports (Export)</button>
    <button class="navbtn" data-view="settings">⚙ Settings</button>
    <div id="navStoreFooter" style="padding:10px;font-size:12px;color:#666;border-top:1px solid #eee;margin-top:8px"></div>
  </nav>
  <main id="content"><div class="empty">Loading...</div></main>
</div>

function fmt(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function numToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num<=0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10]:''); }
  function threeDigits(n){ let str=''; if(n>=100){ str += ones[Math.floor(n/100)] + ' Hundred'; n=n%100; if(n) str+=' '; } if(n) str += twoDigits(n); return str; }
  let crore = Math.floor(num/10000000); num%=10000000;
  let lakh = Math.floor(num/100000); num%=100000;
  let thousand = Math.floor(num/1000); num%=1000;
  let hundred = num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return parts.join(' ');
}
function uid(p){ return p+'_'+Date.now()+'_'+Math.floor(Math.random()*10000); }
function today(){ return new Date().toISOString().slice(0,10); }
function inDateRange(d, fromDate, toDate){ return (!fromDate || (d||'') >= fromDate) && (!toDate || (d||'') <= toDate); }
function addMonths(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function emiInstStatus(inst){ if(inst.status==='paid') return 'paid'; if(inst.status==='cancelled') return 'cancelled'; if(inst.status==='partial') return 'partial'; return inst.dueDate < today() ? 'overdue' : 'pending'; }
function emiPlanOutstanding(plan){ return plan.installments.filter(i=>i.status!=='paid'&&i.status!=='cancelled').reduce((s,i)=>s+(i.status==='partial'?Number(i.remainingAfterPartial||0):Number(i.amount)),0); }
function emiPlanOverdueAmount(plan){ return plan.installments.filter(i=>emiInstStatus(i)==='overdue').reduce((s,i)=>s+Number(i.amount),0); }
function emiPlanStatus(plan){
  if(plan.installments.every(i=>i.status==='paid'||i.status==='cancelled')) return 'closed';
  if(plan.installments.some(i=>emiInstStatus(i)==='overdue')) return 'overdue';
  return 'active';
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------- CREDENTIAL HASHING (PIN / store passwords) ----------
// NOTE (honest limitation): this is a static, client-side-only file — anyone can read this
// JS. Hashing here stops plaintext from sitting visibly in localStorage; it is NOT equivalent
// to real server-side auth security. It also degrades gracefully: if the browser doesn't
// expose crypto.subtle (e.g. very old browser, or a non-secure context that blocks it), we
// fall back to the original plaintext comparison so login never breaks.
const canHash = !!(window.crypto && window.crypto.subtle);
async function sha256Hex(str){
  const data = new TextEncoder().encode(String(str));
  const digest = await window.crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Verifies a PIN against DATA.settings, lazily migrating a legacy plaintext PIN to a hash
// the first time it's successfully checked (so existing shops are never locked out).
async function verifyEditPin(input){
  const settings = DATA.settings || (DATA.settings = {});
  if(!canHash){ return input === (settings.editPin || '1234'); }
  if(!settings.editPinHash){
    const legacy = settings.editPin || '1234';
    if(input !== legacy) return false; // wrong PIN entered before any migration has happened
    settings.editPinHash = await sha256Hex(legacy);
    delete settings.editPin;
    saveData();
    return true;
  }
  return (await sha256Hex(input)) === settings.editPinHash;
}
async function setEditPin(newPin){
  const settings = DATA.settings || (DATA.settings = {});
  if(canHash){ settings.editPinHash = await sha256Hex(newPin); delete settings.editPin; }
  else { settings.editPin = newPin; }
}
// Verifies a store's admin password, lazily migrating legacy plaintext the same way.
async function verifyStorePassword(store, input){
  if(!canHash){ return input === (store.adminPassword || 'admin123'); }
  if(!store.adminPasswordHash){
    const legacy = store.adminPassword || 'admin123';
    if(input !== legacy) return false;
    store.adminPasswordHash = await sha256Hex(legacy);
    delete store.adminPassword;
    saveStoresMeta();
    return true;
  }
  return (await sha256Hex(input)) === store.adminPasswordHash;
}
async function setStorePassword(store, newPassword){
  if(canHash){ store.adminPasswordHash = await sha256Hex(newPassword); delete store.adminPassword; }
  else { store.adminPassword = newPassword; }
}

// ---------- CUSTOM MODAL (replaces native alert/confirm/prompt) ----------
// uiAlert: fire-and-forget, matches old uiAlert() usage where the code right after
//          the call never depended on the user having dismissed the native dialog.
// uiConfirm / uiPrompt: return a Promise, so callers must `await` them — the
//          calling function needs to be `async` for this to work.
function showUiModal({message, mode, defaultValue, resolve}){
  const overlay = document.getElementById('uiModalOverlay');
  const msgEl = document.getElementById('uiModalMessage');
  const inputWrap = document.getElementById('uiModalInputWrap');
  const inputEl = document.getElementById('uiModalInput');
  const actionsEl = document.getElementById('uiModalActions');
  if(!overlay || !msgEl || !inputWrap || !inputEl || !actionsEl){
    // Safety fallback: if modal markup is ever missing, don't silently swallow the interaction
    if(mode==='alert'){ window.alert(message); return; }
    if(mode==='confirm'){ resolve(window.confirm(message)); return; }
    resolve(window.prompt(message, defaultValue)); return;
  }
  msgEl.textContent = message;
  actionsEl.innerHTML = '';
  if(mode==='prompt'){ inputWrap.style.display='block'; inputEl.value = defaultValue||''; }
  else { inputWrap.style.display='none'; }

  const onKeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); if(mode==='prompt') close(inputEl.value); else close(mode==='confirm'?true:undefined); }
    else if(e.key==='Escape'){ e.preventDefault(); close(mode==='prompt'?null:(mode==='confirm'?false:undefined)); }
  };
  function close(result){
    overlay.classList.remove('show');
    document.removeEventListener('keydown', onKeydown);
    if(resolve) resolve(result);
  }
  document.addEventListener('keydown', onKeydown);

  if(mode==='alert'){
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';
    okBtn.onclick=()=>close();
    actionsEl.appendChild(okBtn);
  } else if(mode==='confirm'){
    const cancelBtn=document.createElement('button'); cancelBtn.className='btn outline sm'; cancelBtn.textContent='Cancel';
    cancelBtn.onclick=()=>close(false);
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';
    okBtn.onclick=()=>close(true);
    actionsEl.appendChild(cancelBtn); actionsEl.appendChild(okBtn);
  } else {
    const cancelBtn=document.createElement('button'); cancelBtn.className='btn outline sm'; cancelBtn.textContent='Cancel';
    cancelBtn.onclick=()=>close(null);
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';

function uniqueBrands(){ return Array.from(new Set(DATA.mobiles.map(m=>m.brand).filter(Boolean))).sort(); }

// Snap a freshly-typed brand/model to an already-existing one (case/spacing-insensitive) so that
// "Samsung" and "samsung" (or extra spaces) never end up as two different brands/models in stock.
// If nothing matching exists yet, the typed value is kept as-is (and becomes the new canonical spelling).
function normalizeBrand(typed){
  const t = (typed||'').trim();
  if(!t) return t;
  const match = uniqueBrands().find(b=>b.toLowerCase()===t.toLowerCase());
  return match || t;
}
function normalizeModel(typed){
  const t = (typed||'').trim();
  if(!t) return t;
  const match = uniqueModels().find(m=>m.toLowerCase()===t.toLowerCase());
  return match || t;
}

function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    let s = (c===null||c===undefined)?'':String(c);
    if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',')).join('\r\n');
}
function downloadCSV(filename, rows){
  const csv = toCSV(rows);
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Groups current mobile stock by brand — used on the Stock screen (quick glance) and in Reports (exportable).
function brandWiseMobileSummary(){
  const groups = {};
  DATA.mobiles.filter(m=>m.status==='instock').forEach(m=>{
    const b = (m.brand||'').trim() || 'Unknown';
    if(!groups[b]) groups[b] = {qty:0, value:0};
    groups[b].qty += 1;
    groups[b].value += Number(m.purchasePrice||0);
  });
  const soldByBrand = {};
  DATA.mobiles.filter(m=>m.status==='sold').forEach(m=>{
    const b = (m.brand||'').trim() || 'Unknown';
    soldByBrand[b] = (soldByBrand[b]||0) + 1;
  });
  const brands = Array.from(new Set([...Object.keys(groups), ...Object.keys(soldByBrand)])).sort();
  return brands.map(b=>({
    brand: b,
    inStockQty: groups[b] ? groups[b].qty : 0,
    stockValue: groups[b] ? groups[b].value : 0,
    soldQty: soldByBrand[b] || 0
  }));

// ---------- LEDGER HELPERS (single source of truth — used everywhere so numbers never mismatch) ----------
function customerBilled(c){ return DATA.invoices.filter(i=>i.customerId===c.id).reduce((s,i)=>s+i.total,0); }
// A "Finance" payment is only real cash-in-hand at billing time when it's Third-Party
// (the financer pays the shop upfront). Self-Finance is the shop's own money lent to the
// customer — it becomes real cash only as EMI installments are actually collected. So:
//  - at-sale payments: count everything EXCEPT self-finance amounts (those aren't paid yet)
//  - EMI collections: count only self-finance installments (third-party installments are the
//    financer's business, already booked as paid above — counting them again would double-count)
function customerReceived(c){
  const inv = DATA.invoices.filter(i=>i.customerId===c.id);
  const atSale = inv.reduce((s,i)=>s+(i.payments? i.payments.reduce((s2,p)=>{
    if(p.mode==='Finance' && p.financeType==='self') return s2; // not real cash yet
    return s2+Number(p.amount||0);
  }, 0) : 0),0);
  const installments = (DATA.customerPayments||[]).filter(p=>p.customerId===c.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const selfFinanceEmiCollected = (DATA.emiCollections||[]).reduce((s,e)=>{
    if(e.customerId!==c.id) return s;
    const plan = DATA.emiPlans.find(p=>p.id===e.planId);
    if(!plan || (plan.financeType||'thirdparty')!=='self') return s;
    return s+Number(e.amount||0);
  },0);
  return atSale+installments+selfFinanceEmiCollected;
}
function customerBalance(c){ return customerBilled(c) - customerReceived(c); }
function normPhone(p){ return (p||'').toString().replace(/\D/g,''); }
// Mobile number is the customer's primary ID — must be numbers only, no letters.
// Strips anything that isn't a digit and requires at least 10 digits left; returns null if invalid.
function validCustomerPhone(raw){
  const digits = (raw||'').toString().replace(/\D/g,'');
  if(digits.length < 10) return null;
  return digits;
}
// Wire a phone <input> so letters/symbols simply can't be typed into it (live strip as you type).
function wireNumericPhoneInput(inputEl){
  if(!inputEl) return;
  inputEl.addEventListener('input', ()=>{
    const cleaned = inputEl.value.replace(/\D/g,'');
    if(cleaned !== inputEl.value) inputEl.value = cleaned;
  });
}
function findCustomerByPhone(phone){ const n=normPhone(phone); return n? DATA.customers.find(c=>normPhone(c.phone)===n) : null; }
// Duplicate-supplier guard: same phone number is treated as a strong match (a phone
// number is effectively a unique real-world identity). If no phone is given on either
// side, fall back to an exact (case-insensitive) name match as a softer signal.
function findSupplierDuplicate(name, phone){
  const n = normPhone(phone);
  if(n){ const byPhone = DATA.suppliers.find(s=>normPhone(s.phone)===n); if(byPhone) return byPhone; return null; }
  const nm = (name||'').trim().toLowerCase();
  if(nm) return DATA.suppliers.find(s=>(s.name||'').trim().toLowerCase()===nm && !normPhone(s.phone)) || null;
  return null;
}
// A person can be BOTH our customer and our supplier at the same time (e.g. someone we buy
// phones from who also buys phones from us). Since the phone number is each side's primary
// identity, matching on it lets us surface a combined "same aadmi" view without merging the
// underlying customer/supplier records (which stay separate on purpose — invoices link to
// customerId, purchases link to supplierId, and that must never change).
function linkedCustomerFor(supplier){
  const n = normPhone(supplier && supplier.phone);
  return n ? (DATA.customers.find(c=>normPhone(c.phone)===n) || null) : null;
}
function linkedSupplierFor(customer){
  const n = normPhone(customer && customer.phone);
  return n ? (DATA.suppliers.find(s=>normPhone(s.phone)===n) || null) : null;
}

function supplierPurchased(s){ return DATA.purchases.filter(p=>p.supplierId===s.id).reduce((sum,p)=>sum+p.totalAmount,0); }
function supplierPaid(s){ return DATA.payments.filter(p=>p.supplierId===s.id).reduce((sum,p)=>sum+p.amount,0); }
function supplierBalance(s){ return supplierPurchased(s) - supplierPaid(s); }

// ---- Profit calculation (accounts for returned items) ----
function invoiceProfit(inv){
  return inv.items.reduce((sum,it)=>{
    const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
    const soldQty = Number(it.qty||1) - returnedQty;
    if(soldQty<=0) return sum;
    let cost = 0;
    if(it.type==='mobile'){
      const m = DATA.mobiles.find(x=>x.imei===it.ref);
      cost = m ? Number(m.purchasePrice||0) : 0;
    } else {
      const a = DATA.accessories.find(x=>x.id===it.ref);
      cost = a ? Number(a.purchasePrice||0) : 0;
    }
    return sum + (Number(it.price||0) - cost) * soldQty;
  }, 0);
}
function invoiceNetTotal(inv){
  // total after subtracting refunded amounts for returned items
  const returnedValue = inv.items.reduce((sum,it)=>{
    const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
    return sum + returnedQty*Number(it.price||0);
  },0);
  return Math.max(0, inv.total - returnedValue);
}

}
function renderSalesTrendSVG(trend){
  const max = Math.max(1, ...trend.map(t=>t.total));
  const w = 700, h = 180, padBottom = 30, padTop = 16, barGap = 14;
  const barW = (w - barGap*(trend.length+1)) / trend.length;
  const bars = trend.map((t,i)=>{
    const barH = Math.round((t.total/max) * (h-padBottom-padTop));
    const x = barGap + i*(barW+barGap);
    const y = h - padBottom - barH;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" style="fill:var(--accent);fill-opacity:${i===trend.length-1?1:0.55}"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" style="fill:var(--navy);font-weight:700">${t.total?fmt(t.total):''}</text>
      <text x="${x+barW/2}" y="${h-10}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${t.label}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:700px;display:block;margin-top:6px">${bars}</svg>`;
}

// ---- Return / refund handling ----
function processReturn(invoiceId, itemIndex, qty){
  const inv = DATA.invoices.find(i=>i.id===invoiceId);
  if(!inv) return false;
  const it = inv.items[itemIndex];
  if(!it) return false;
  if(it.type==='mobile'){
    if(it.returned){ uiAlert('This mobile has already been marked returned.'); return false; }
    const m = DATA.mobiles.find(x=>x.imei===it.ref);
    if(m){ m.status='instock'; delete m.customerId; delete m.soldDate; delete m.soldPrice; delete m.invoiceId; }
    it.returned = true;
    qty = 1;
  } else {
    const already = Number(it.returnedQty||0);
    const maxQty = Number(it.qty||1) - already;
    qty = Math.min(Number(qty)||0, maxQty);
    if(qty<=0){ uiAlert('Nothing left to return on this item.'); return false; }
    const a = DATA.accessories.find(x=>x.id===it.ref);
    if(a){ a.qty = Math.max(0, Number(a.qty||0) + qty); }
    it.returnedQty = already + qty;
  }
  const refundAmount = qty * Number(it.price||0);
  inv.total = invoiceNetTotal(inv);
  DATA.returns.push({id:uid('ret'), invoiceId, date:today(), itemName:it.name, itemType:it.type, ref:it.ref, qty, refundAmount, customerId:inv.customerId});

  // If this invoice had a Finance (EMI) payment, cancel any unpaid installments on the linked EMI plan
  if(it.type==='mobile' && Array.isArray(inv.payments) && inv.payments.some(p=>p.mode==='Finance')){
    if(!DATA.emiPlans) DATA.emiPlans=[];
    const plan = DATA.emiPlans.find(p=>p.invoiceId===invoiceId);
    if(plan){
      plan.installments.forEach(inst=>{
        if(inst.status!=='paid'){
          inst.status='cancelled';
        }
      });
      plan.cancelledReason = 'Mobile returned (invoice '+invoiceId+')';
    }
  }

  // If this invoice had an Exchange payment, flag the mobile(s) created from that exchange for verification
  if(it.type==='mobile' && Array.isArray(inv.payments) && inv.payments.some(p=>p.mode==='Exchange')){
    DATA.mobiles.filter(x=>x.fromInvoiceId===invoiceId).forEach(x=>{ x.linkedSaleReversed = true; });
  }
  return true;
}

function wireReturnButtons(container, afterFn){
  container.querySelectorAll('[data-returnitem]').forEach(btn=>btn.onclick=async ()=>{
    const [invoiceId, idxStr] = btn.dataset.returnitem.split('|');
    const idx = Number(idxStr);
    const inv = DATA.invoices.find(i=>i.id===invoiceId);
    if(!inv) return;
    const it = inv.items[idx];
    let qty = 1;
    if(it.type!=='mobile'){
      const already = Number(it.returnedQty||0);
      const maxQty = Number(it.qty||1) - already;
      const input = await uiPrompt(`Return how many "${it.name}"? (max ${maxQty})`, String(maxQty));
      if(input===null) return;
      qty = Number(input);
      if(!qty || qty<=0 || qty>maxQty){ uiAlert('Please enter a valid quantity.'); return; }
    } else {
      if(!(await uiConfirm(`Mark "${it.name}" (IMEI ${it.ref}) as returned? It will go back into current stock.`))) return;
    }
    if(!(await askEditPin('process this return'))) return;
    if(processReturn(invoiceId, idx, qty)){
      logAudit('return', 'invoice', invoiceId, invNoLabel(inv)+': "'+it.name+'" x'+qty+' returned', null, null);
      await saveData();
      uiAlert('Return recorded and stock updated.');
      if(afterFn) afterFn(); else render();
    }
  });
}

// Logs who changed what, when, and the before/after snapshot — mainly for
// sensitive mutations (purchase edit/delete) so staff changes are traceable.
function logAudit(action, entityType, entityId, summary, before, after){
  if(!DATA.auditLog) DATA.auditLog=[];
  DATA.auditLog.unshift({
    id: uid('aud'),
    ts: new Date().toISOString(),
    staff: lastAuditStaff || 'Unknown',
    action, entityType, entityId, summary,
    before: before!==undefined ? JSON.parse(JSON.stringify(before)) : null,
    after: after!==undefined ? JSON.parse(JSON.stringify(after)) : null
  });
  // Cap log size so it doesn't grow storage unbounded
  if(DATA.auditLog.length>500) DATA.auditLog.length = 500;
}

// ---------- PURCHASE EDIT / DELETE (keeps stock & supplier ledger in sync) ----------
async function startEditPurchase(purchaseId){
  if(!(await askEditPin('edit this purchase'))) return;
  const p = DATA.purchases.find(x=>x.id===purchaseId);
  if(!p){ uiAlert('Purchase not found'); return; }
  editingPurchaseId = purchaseId;
  editDate = p.date;
  editSupplierInvoiceNo = p.supplierInvoiceNo||'';
  editAddTab = 'mobile';
  editMobileHasImei = true;
  editCart = p.items.map(it=>{
    let locked=false;
    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(m && m.status==='sold') locked=true;
    }
    return {...it, locked};
  });
  render();
}

function cancelEditPurchase(){ editingPurchaseId=null; editCart=[]; render(); }

function applyPurchaseEdit(purchaseId, newCart, date, supplierInvoiceNo){
  const p = DATA.purchases.find(x=>x.id===purchaseId);
  if(!p){ uiAlert('Purchase not found'); return false; }
  if(!newCart.length){ uiAlert('A purchase must have at least one item. Use Delete instead if you want to remove it entirely.'); return false; }
  const auditBefore = {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount};

  const lockedItems = newCart.filter(it=>it.locked);
  const editableItems = newCart.filter(it=>!it.locked);

  // IMEIs from this purchase that are still in stock (not sold) and can be freed up for reuse
  const releasableImeis = new Set(
    p.items.filter(it=>it.kind==='mobile-imei').map(it=>it.imei).filter(imei=>{
      const m = DATA.mobiles.find(x=>x.imei===imei && x.purchaseId===purchaseId);
      return m && m.status!=='sold';
    })
  );
  // Validate: no IMEI clashes with stock elsewhere
  for(const it of editableItems){
    if(it.kind==='mobile-imei'){
      const clash = DATA.mobiles.find(m=>m.imei===it.imei && !(m.purchaseId===purchaseId && releasableImeis.has(it.imei)));
      if(clash){ uiAlert('IMEI '+it.imei+' already exists in stock elsewhere. Please correct it before saving.'); return false; }
    }
  }
  // Validate: no duplicate IMEI within the new cart itself
  const seenImeis = new Set();
  for(const it of editableItems){
    if(it.kind==='mobile-imei'){
      if(seenImeis.has(it.imei)){ uiAlert('Duplicate IMEI '+it.imei+' within this purchase. Please fix.'); return false; }
      seenImeis.add(it.imei);
    }
  }
  // Validate: reversing old accessory/no-IMEI quantities won't push stock below zero (i.e. some already sold)
  const accessoryOldQty = {};
  p.items.forEach(it=>{
    if(it.kind!=='mobile-imei'){
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const key = it.name.toLowerCase()+'|'+cat;
      accessoryOldQty[key] = (accessoryOldQty[key]||0) + it.qty;
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    const currentQty = existing? Number(existing.qty):0;
    if(currentQty < accessoryOldQty[key]){
      uiAlert('Cannot save: some units of an accessory/no-IMEI item in this purchase have already been sold, so this quantity cannot be safely edited.');
      return false;
    }
  }

  // All checks passed — perform the reversal + reapply
  p.items.forEach(it=>{
    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(m && m.status!=='sold'){
        const idx = DATA.mobiles.indexOf(m);
        if(idx>-1) DATA.mobiles.splice(idx,1);
      }
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    if(existing) existing.qty = Number(existing.qty) - accessoryOldQty[key];
  }

  lockedItems.forEach(it=>{
    const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
    if(m){ m.purchasePrice=it.purchasePrice; if(it.brand) m.brand=it.brand; if(it.model!==undefined) m.model=it.model; if(it.hsnCode) m.hsnCode=it.hsnCode; if(it.gstRate!=null) m.gstRate=it.gstRate; }
  });

  editableItems.forEach(it=>{
    if(it.kind==='mobile-imei'){
      DATA.mobiles.push({imei:it.imei, brand:it.brand, model:it.model, purchasePrice:it.purchasePrice, salePrice:it.salePrice, purchaseDate:date, status:'instock', supplierId:p.supplierId, purchaseId:p.id, hsnCode:it.hsnCode||'', gstRate:it.gstRate});
    } else {
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const existing = DATA.accessories.find(a=>a.name.toLowerCase()===it.name.toLowerCase() && (a.category||'')===cat);
      if(existing){ existing.qty = Number(existing.qty)+it.qty; if(it.salePrice) existing.salePrice=it.salePrice; if(it.hsnCode) existing.hsnCode=it.hsnCode; if(it.gstRate!=null) existing.gstRate=it.gstRate; }
      else DATA.accessories.push({id:uid('acc'), name:it.name, category:cat, qty:it.qty, purchasePrice:it.purchasePrice, salePrice:it.salePrice||0, hsnCode:it.hsnCode||'', gstRate:it.gstRate});
    }
  });

  const newTotal = newCart.reduce((s,i)=>s+i.purchasePrice*i.qty,0);
  p.date = date;
  p.supplierInvoiceNo = supplierInvoiceNo;
  p.items = newCart.map(({locked, ...rest})=>rest);
  p.totalAmount = newTotal;
  p.editedAt = new Date().toISOString();
  logAudit('edit', 'purchase', p.id,
    purNoLabel(p)+': amount '+fmt(auditBefore.totalAmount)+' → '+fmt(newTotal)+', items '+auditBefore.items.length+' → '+p.items.length,
    auditBefore,
    {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount});
  return true;
}

function deletePurchaseWithReversal(purchaseId){
  const p = DATA.purchases.find(x=>x.id===purchaseId);
  if(!p) return false;
  for(const it of p.items){
    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(m && m.status==='sold'){ uiAlert('Cannot delete: mobile '+it.imei+' from this purchase has already been sold. Correct the price via Edit instead.'); return false; }
    }
  }
  const accessoryOldQty = {};
  p.items.forEach(it=>{
    if(it.kind!=='mobile-imei'){
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const key = it.name.toLowerCase()+'|'+cat;
      accessoryOldQty[key] = (accessoryOldQty[key]||0) + it.qty;
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    const currentQty = existing? Number(existing.qty):0;
    if(currentQty < accessoryOldQty[key]){ uiAlert('Cannot delete: some units from this purchase have already been sold.'); return false; }
  }
  p.items.forEach(it=>{
    if(it.kind==='mobile-imei'){
      const idx = DATA.mobiles.findIndex(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(idx>-1) DATA.mobiles.splice(idx,1);
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    if(existing) existing.qty = Number(existing.qty) - accessoryOldQty[key];
  }
  const idx = DATA.purchases.indexOf(p);
  if(idx>-1) DATA.purchases.splice(idx,1);
  logAudit('delete', 'purchase', p.id,
    purNoLabel(p)+' deleted (amount '+fmt(p.totalAmount)+', '+p.items.length+' items)',
    {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount},
    null);
  return true;
}

function attachPurchaseRowHandlers(container){
  container.querySelectorAll('[data-editpurchase]').forEach(b=>b.onclick=async ()=>startEditPurchase(b.dataset.editpurchase));
  container.querySelectorAll('[data-deletepurchase]').forEach(b=>b.onclick=async ()=>{
    if(!(await askEditPin('delete this purchase'))) return;
    if(!(await uiConfirm('Delete this entire purchase permanently? This will remove it from stock and cannot be undone.'))) return;
    const ok = deletePurchaseWithReversal(b.dataset.deletepurchase);
    if(ok){ await saveData(); uiAlert('Purchase deleted.'); render(); }
  });
}

const LEGACY_DATA_KEY = 'hills_erp_shopdata';
const STORES_META_KEY = 'hills_erp_stores_meta';
const SESSION_KEY = 'hills_erp_active_session';
const GLOBAL_LOG_KEY = 'hills_erp_global_log';

function loadGlobalLog(){
  try{
    const raw = localStorage.getItem(GLOBAL_LOG_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function appendGlobalLog(entry){
  try{
    const log = loadGlobalLog();
    log.unshift(entry);
    if(log.length>200) log.length = 200;
    localStorage.setItem(GLOBAL_LOG_KEY, JSON.stringify(log));
  }catch(e){}
}

function currentStorageKey(){ return 'hills_erp_shopdata_' + currentStoreId; }

function loadStoresMeta(){
  try{
    const raw = localStorage.getItem(STORES_META_KEY);
    if(raw) STORES = JSON.parse(raw);
  }catch(e){ STORES = []; }
  if(!Array.isArray(STORES)) STORES = [];
  if(STORES.length===0){
    // First-ever run OR pre-multi-store install: create a default "Hills ERP" store
    // and migrate any existing single-store data into it, so nothing is lost.
    const firstId = uid('store');
    STORES = [{ id:firstId, name:'Hills ERP', adminUsername:'admin', adminPassword:'admin123', createdAt: today() }];
    try{
      const legacy = localStorage.getItem(LEGACY_DATA_KEY);
      if(legacy) localStorage.setItem('hills_erp_shopdata_'+firstId, legacy);
    }catch(e){}
    saveStoresMeta();
  }
}
function saveStoresMeta(){
  try{ localStorage.setItem(STORES_META_KEY, JSON.stringify(STORES)); }catch(e){}
}
function getActiveSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; }
}
function setActiveSession(storeId){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({storeId})); }catch(e){}
}
function clearActiveSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

async function loadData(){
  DATA = {customers:[], mobiles:[], accessories:[], invoices:[], suppliers:[], purchases:[], payments:[], customerPayments:[], returns:[], emiPlans:[], emiCollections:[], auditLog:[], expenses:[], settings:{}, purchaseCounter:0, invoiceCounter:0};
  try{
    const raw = localStorage.getItem(currentStorageKey());
    if(raw) DATA = JSON.parse(raw);
    const dataSize = JSON.stringify(DATA).length;
    if(dataSize > 4*1024*1024){
      uiAlert('⚠ Data size limit ke paas hai. Purane records ko archive/backup karke clear karne ka soch lein, taaki app smoothly kaam kare.');
    }
  }catch(e){ /* no data yet, fresh start */ }
  if(!DATA.suppliers) DATA.suppliers=[];
  if(!DATA.purchases) DATA.purchases=[];
  if(!DATA.payments) DATA.payments=[];
  if(!DATA.customerPayments) DATA.customerPayments=[];
  if(!DATA.returns) DATA.returns=[];
  if(!DATA.emiPlans) DATA.emiPlans=[];
  if(!DATA.emiCollections) DATA.emiCollections=[];
  if(!DATA.auditLog) DATA.auditLog=[];
  if(!DATA.expenses) DATA.expenses=[];
  if(!DATA.settings) DATA.settings={};
  if(!DATA.settings.editPin && !DATA.settings.editPinHash) DATA.settings.editPin='1234';
  if(DATA.settings.gstEnabled===undefined) DATA.settings.gstEnabled=false;
  if(!DATA.settings.gstin) DATA.settings.gstin='';
  if(!DATA.settings.shopAddress) DATA.settings.shopAddress='';
  if(!DATA.settings.gstRate) DATA.settings.gstRate=18;
  if(DATA.settings.gstInterstate===undefined) DATA.settings.gstInterstate=false;
  if(!DATA.settings.businessName) DATA.settings.businessName='Hills Mobile';
  if(!DATA.settings.logoDataUrl) DATA.settings.logoDataUrl=DEFAULT_LOGO_DATA_URL;
  if(!DATA.settings.signatureDataUrl) DATA.settings.signatureDataUrl=DEFAULT_SIGNATURE_DATA_URL;
  if(!DATA.settings.invoiceTerms) DATA.settings.invoiceTerms=DEFAULT_INVOICE_TERMS;
  if(!DATA.settings.invoicePhone) DATA.settings.invoicePhone='';
  if(DATA.settings.instagramUrl===undefined) DATA.settings.instagramUrl='';
  if(DATA.settings.youtubeUrl===undefined) DATA.settings.youtubeUrl='';
  if(DATA.settings.whatsappNumber===undefined) DATA.settings.whatsappNumber='';
  if(DATA.settings.upiId===undefined) DATA.settings.upiId='';
  if(DATA.settings.showBillWatermark===undefined) DATA.settings.showBillWatermark=true;
  if(DATA.settings.showBillBgCard===undefined) DATA.settings.showBillBgCard=true;
  if(!DATA.purchaseCounter){
    // Backfill purchase numbers for data saved before numbering existed
    const sorted=[...DATA.purchases].sort((a,b)=>a.id.localeCompare(b.id));
    sorted.forEach((p,i)=>{ if(!p.no) p.no=i+1; });
    DATA.purchaseCounter = sorted.length;
  }
  if(!DATA.invoiceCounter){
    // Backfill invoice numbers for data saved before numbering existed
    const sortedInv=[...DATA.invoices].sort((a,b)=>a.id.localeCompare(b.id));
    sortedInv.forEach((iv,i)=>{ if(!iv.no) iv.no=i+1; });
    DATA.invoiceCounter = sortedInv.length;
  }
  render();
}
// Simple locks so a fast second save can't start a new sync run for a table while the
// previous run for that same table is still in progress. Without this, rapid saves
// could race with each other and create duplicate cloud rows.
const _syncLocks = { customers:false, suppliers:false, mobiles:false, purchases:false };
async function saveData(){
  try{
    localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));
    syncCustomersToCloud(); // fire-and-forget; local save above already succeeded either way
    syncMobilesToCloud(); // fire-and-forget; same pattern as customers
    syncSuppliersToCloud(); // fire-and-forget; same pattern as customers
    syncPurchasesToCloud(); // fire-and-forget; supplier_id resolved via cloud supplier lookup
    return true;
  }catch(e){
    uiAlert('Problem saving data in this browser. Storage might be full or blocked (private/incognito mode). Please take a backup regularly using the Backup button in Settings.');
    return false;
  }
}

// ---------- CLOUD SYNC (Stage 2 — starting with customers only) ----------
// Every local store needs a matching row in the cloud "stores" table before any of its
// data can be synced. We create that once and remember the cloud id on the local store
// record (STORES array), so we don't create duplicate cloud stores on every save.
async function ensureCloudStoreId(store){
  if(!supabaseClient || !store) return null;
  if(store.cloudStoreId) return store.cloudStoreId;
  try{
    const { data: userData } = await supabaseClient.auth.getUser();
    const ownerId = userData && userData.user && userData.user.id;
    if(!ownerId) return null; // not logged into Supabase (offline / local-only store) — skip sync
    const { data: existing } = await supabaseClient.from('stores').select('id').eq('name', store.name).maybeSingle();
    if(existing && existing.id){ store.cloudStoreId = existing.id; saveStoresMeta(); return existing.id; }
    const { data: created, error } = await supabaseClient.from('stores').insert({name: store.name, owner_id: ownerId}).select().single();
    if(error || !created) return null;
    store.cloudStoreId = created.id; saveStoresMeta();
    return created.id;
  }catch(e){ console.error('Cloud store setup failed:', e); return null; }
}
// Simple "full replace" sync: since a single shop's customer list is small (hundreds, not
// millions), we just clear this store's cloud customers and re-insert the current local
// list on every save. This avoids needing to track which rows changed.
// Stable-id pattern: each local customer remembers its own cloud row id (c.cloudId) the
// first time it is synced. After that, every save UPDATES that same cloud row instead of
// deleting everything and re-inserting fresh rows (the old approach kept generating new
// cloud ids every save, which broke any links from other tables and caused duplicates on
// fast/overlapping saves).
async function syncCustomersToCloud(){
  if(!supabaseClient) return; // no internet / library not loaded — silently skip, local data is unaffected
  if(_syncLocks.customers) return; // a previous sync for this table is still running
  const store = STORES.find(s=>s.id===currentStoreId);
  if(!store) return;
  _syncLocks.customers = true;
  try{
    const cloudStoreId = await ensureCloudStoreId(store);
    if(!cloudStoreId) return;
    let changed = false;
    for(const cust of (DATA.customers||[])){
      const row = { store_id: cloudStoreId, name: cust.name||'', phone: cust.phone||'', address: cust.address||'' };
      if(cust.cloudId){
        const { error } = await supabaseClient.from('customers').update(row).eq('id', cust.cloudId);
        if(error) console.error('Cloud update failed (customer):', error);
      } else {
        const { data, error } = await supabaseClient.from('customers').insert(row).select().single();
        if(error) console.error('Cloud insert failed (customer):', error);
        else if(data){ cust.cloudId = data.id; changed = true; }
      }
    }
    if(changed) localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));
  }catch(e){ console.error('Cloud sync failed (customers):', e); /* local data already saved, so nothing is lost */ }
  finally{ _syncLocks.customers = false; }
}
// Purchases need their supplier linked in the cloud, but local supplier IDs (e.g. "sup_...")
// aren't real UUIDs, so we can't use them directly as the foreign key. Instead, we fetch this
// store's cloud suppliers (name+phone), build a lookup, and match each local purchase's supplier
// by name+phone to find the correct cloud supplier UUID. If no match is found, supplier_id is
// left null (purchase still syncs, just without the supplier link).
async function syncPurchasesToCloud(){
  if(!supabaseClient) return;
  if(_syncLocks.purchases) return;
  const store = STORES.find(s=>s.id===currentStoreId);
  if(!store) return;
  _syncLocks.purchases = true;
  try{
    const cloudStoreId = await ensureCloudStoreId(store);
    if(!cloudStoreId) return;
    let changed = false;
    for(const p of (DATA.purchases||[])){
      // Supplier link now uses the supplier's own remembered cloudId (set by
      // syncSuppliersToCloud) instead of matching by name+phone. Since suppliers sync
      // first in saveData(), sup.cloudId should already be set on the very first save.
      const sup = DATA.suppliers.find(s=>s.id===p.supplierId);
      const cloudSupplierId = (sup && sup.cloudId) ? sup.cloudId : null;
      const row = {
        store_id: cloudStoreId,
        no: p.no!=null ? Number(p.no) : null,
        supplier_id: cloudSupplierId,
        date: p.date||null,
        total_amount: p.totalAmount!=null ? Number(p.totalAmount) : null,
        supplier_invoice_no: p.supplierInvoiceNo||null,
        items: p.items || null
      };
      if(p.cloudId){
        const { error } = await supabaseClient.from('purchases').update(row).eq('id', p.cloudId);
        if(error) console.error('Cloud update failed (purchase):', error);
      } else {
        const { data, error } = await supabaseClient.from('purchases').insert(row).select().single();
        if(error) console.error('Cloud insert failed (purchase):', error);
        else if(data){ p.cloudId = data.id; changed = true; }
      }
    }
    if(changed) localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));
  }catch(e){ console.error('Cloud sync failed (purchases):', e); }
  finally{ _syncLocks.purchases = false; }
}

// Same "full replace" pattern as customers. Note: customer_id, from_customer_id, invoice_id,
// from_invoice_id, supplier_id, purchase_id are intentionally left null for now — this app's
// local IDs (e.g. "cust_172..._4821") are not real UUIDs, and those cloud tables aren't synced
// yet anyway, so any value here would fail the foreign-key constraint. Once customers/invoices/
// purchases/suppliers get their own cloud sync (with a local-id -> cloud-id map, same as
// store.cloudStoreId), we'll fill these in properly.
async function syncMobilesToCloud(){
  if(!supabaseClient) return;
  if(_syncLocks.mobiles) return;
  const store = STORES.find(s=>s.id===currentStoreId);
  if(!store) return;
  _syncLocks.mobiles = true;
  try{
    const cloudStoreId = await ensureCloudStoreId(store);
    if(!cloudStoreId) return;
    let changed = false;
    for(const m of (DATA.mobiles||[])){
      const row = {
        store_id: cloudStoreId,
        brand: m.brand||'',
        model: m.model||'',
        imei: m.imei||'',
        no_real_imei: !!m.noRealImei,
        purchase_price: m.purchasePrice!=null ? Number(m.purchasePrice) : null,
        sale_price: m.salePrice!=null ? Number(m.salePrice) : null,
        status: m.status||'instock',
        sold_date: m.soldDate||null,
        sold_price: m.soldPrice!=null ? Number(m.soldPrice) : null,
        purchase_date: m.purchaseDate||null,
        hsn_code: m.hsnCode||null,
        gst_rate: m.gstRate!=null ? Number(m.gstRate) : null,
        source: m.source||null,
        condition: m.condition||null,
        linked_sale_reversed: !!m.linkedSaleReversed
      };
      if(m.cloudId){
        const { error } = await supabaseClient.from('mobiles').update(row).eq('id', m.cloudId);
        if(error) console.error('Cloud update failed (mobile):', error);
      } else {
        const { data, error } = await supabaseClient.from('mobiles').insert(row).select().single();
        if(error) console.error('Cloud insert failed (mobile):', error);
        else if(data){ m.cloudId = data.id; changed = true; }
      }
    }
    if(changed) localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));
  }catch(e){ console.error('Cloud sync failed (mobiles):', e); }
  finally{ _syncLocks.mobiles = false; }
}
// Pull-on-login: if this device/browser has NO local data yet for this store (e.g. after a
// reset, or logging into the same store from a new device), fetch whatever is already saved
// in the cloud and populate it locally. We deliberately only do this when local data is fully
// empty — if the device already has local customers/mobiles, we leave them alone rather than
// risk overwriting anything, since we don't yet have proper two-way merge logic.
async function pullFromCloudIfEmpty(){
  if(!supabaseClient) return;
  const store = STORES.find(s=>s.id===currentStoreId);
  if(!store) return;
  try{
    const cloudStoreId = await ensureCloudStoreId(store);
    if(!cloudStoreId) return;
    let changed = false;
    if((!DATA.customers || DATA.customers.length===0)){
      const {data: rows} = await supabaseClient.from('customers').select('*').eq('store_id', cloudStoreId);
      if(rows && rows.length){
        DATA.customers = rows.map(r=>({id:uid('cust'), name:r.name||'', phone:r.phone||'', address:r.address||''}));
        changed = true;
      }
    }
    if((!DATA.mobiles || DATA.mobiles.length===0)){
      const {data: rows} = await supabaseClient.from('mobiles').select('*').eq('store_id', cloudStoreId);
      if(rows && rows.length){
        DATA.mobiles = rows.map(r=>({
          imei:r.imei||'', brand:r.brand||'', model:r.model||'', noRealImei:!!r.no_real_imei,
          purchasePrice:r.purchase_price, salePrice:r.sale_price, status:r.status||'instock',
          soldDate:r.sold_date||undefined, soldPrice:r.sold_price||undefined,
          purchaseDate:r.purchase_date||undefined, hsnCode:r.hsn_code||'', gstRate:r.gst_rate,
          source:r.source||undefined, condition:r.condition||undefined, linkedSaleReversed:!!r.linked_sale_reversed
        }));
        changed = true;
      }
    }
    let supplierCloudToLocal = {}; // built below when suppliers are pulled; used by purchases pull
    if((!DATA.suppliers || DATA.suppliers.length===0)){
      const {data: rows} = await supabaseClient.from('suppliers').select('*').eq('store_id', cloudStoreId);
      if(rows && rows.length){
        DATA.suppliers = rows.map(r=>{
          const localId = uid('sup');
          supplierCloudToLocal[r.id] = localId;
          return {id:localId, name:r.name||'', phone:r.phone||'', address:r.address||''};
        });
        changed = true;
      }
    }
    if((!DATA.purchases || DATA.purchases.length===0)){
      const {data: rows} = await supabaseClient.from('purchases').select('*').eq('store_id', cloudStoreId);
      if(rows && rows.length){
        DATA.purchases = rows.map(r=>({
          id: uid('pur'), no: r.no, supplierId: r.supplier_id ? (supplierCloudToLocal[r.supplier_id]||null) : null,
          date: r.date||'', supplierInvoiceNo: r.supplier_invoice_no||'', items: r.items||[],
          totalAmount: r.total_amount!=null ? Number(r.total_amount) : 0
        }));
        changed = true;
      }
    }
    if(changed){
      localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));
      render();
    }
  }catch(e){ console.error('Cloud pull failed:', e); }
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hills-erp-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if(!DATA.settings) DATA.settings={};
  DATA.settings.lastBackupDate = today();
  backupBannerDismissed = false;
  saveData();
  render();
}

function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!(await uiConfirm('This will replace ALL current data in this browser with the backup file. Continue?'))) return;
      DATA = parsed;
      if(!DATA.suppliers) DATA.suppliers=[];
      if(!DATA.purchases) DATA.purchases=[];
      if(!DATA.payments) DATA.payments=[];
      if(!DATA.customerPayments) DATA.customerPayments=[];
      if(!DATA.returns) DATA.returns=[];
      if(!DATA.emiPlans) DATA.emiPlans=[];
      if(!DATA.emiCollections) DATA.emiCollections=[];
      if(!DATA.auditLog) DATA.auditLog=[];
      if(!DATA.expenses) DATA.expenses=[];
      if(!DATA.settings) DATA.settings={};
      if(!DATA.settings.editPin && !DATA.settings.editPinHash) DATA.settings.editPin='1234';
      if(DATA.settings.gstEnabled===undefined) DATA.settings.gstEnabled=false;
      if(!DATA.settings.gstin) DATA.settings.gstin='';
      if(!DATA.settings.shopAddress) DATA.settings.shopAddress='';
      if(!DATA.settings.gstRate) DATA.settings.gstRate=18;
      if(DATA.settings.gstInterstate===undefined) DATA.settings.gstInterstate=false;
      if(!DATA.settings.businessName) DATA.settings.businessName='Hills Mobile';
      if(!DATA.settings.logoDataUrl) DATA.settings.logoDataUrl=DEFAULT_LOGO_DATA_URL;
      if(!DATA.settings.signatureDataUrl) DATA.settings.signatureDataUrl=DEFAULT_SIGNATURE_DATA_URL;
      if(!DATA.settings.invoiceTerms) DATA.settings.invoiceTerms=DEFAULT_INVOICE_TERMS;
      if(!DATA.settings.invoicePhone) DATA.settings.invoicePhone='';
      if(DATA.settings.instagramUrl===undefined) DATA.settings.instagramUrl='';
      if(DATA.settings.youtubeUrl===undefined) DATA.settings.youtubeUrl='';
      if(DATA.settings.whatsappNumber===undefined) DATA.settings.whatsappNumber='';
      if(DATA.settings.upiId===undefined) DATA.settings.upiId='';
      if(DATA.settings.showBillWatermark===undefined) DATA.settings.showBillWatermark=true;
      if(DATA.settings.showBillBgCard===undefined) DATA.settings.showBillBgCard=true;
      if(!DATA.purchaseCounter){
        const sorted=[...DATA.purchases].sort((a,b)=>a.id.localeCompare(b.id));
        sorted.forEach((p,i)=>{ if(!p.no) p.no=i+1; });
        DATA.purchaseCounter = sorted.length;
      }
      if(!DATA.invoiceCounter){
        const sortedInv=[...DATA.invoices].sort((a,b)=>a.id.localeCompare(b.id));
        sortedInv.forEach((iv,i)=>{ if(!iv.no) iv.no=i+1; });
        DATA.invoiceCounter = sortedInv.length;
      }
      await saveData();
      render();
      uiAlert('Backup restored successfully.');
    }catch(err){ uiAlert('This does not look like a valid backup file.'); }
  };
  reader.readAsText(file);
}

function attachAuthHandlers(){
  document.querySelectorAll('[data-selectstore]').forEach(b=>b.onclick=()=>{ storeLoginSelectedId=b.dataset.selectstore; renderAuthScreen(); });
  const backBtn=document.getElementById('authBackBtn');
  if(backBtn) backBtn.onclick=()=>{ storeLoginSelectedId=null; renderAuthScreen(); };
  const usernameInput=document.getElementById('authUsername');
  const passwordInput=document.getElementById('authPassword');
  const toggleBtn=document.getElementById('authTogglePwBtn');
  if(toggleBtn && passwordInput) toggleBtn.onclick=()=>{
    const showing = passwordInput.type==='text';
    passwordInput.type = showing ? 'password' : 'text';
    toggleBtn.textContent = showing ? '👁' : '🙈';
  };
  const loginBtn=document.getElementById('authLoginBtn');
  let loginInProgress=false; // guards against double-click firing the check twice
  const emailInput=document.getElementById('authEmail');
  const doLogin=async ()=>{
    if(loginInProgress) return;
    loginInProgress=true;
    if(loginBtn) loginBtn.disabled=true;
    try{
      const s = STORES.find(x=>x.id===storeLoginSelectedId);
      const u=(usernameInput.value||'').trim();
      const em=(emailInput && emailInput.value||'').trim();
      const p=(passwordInput.value||'');
      let ok = false;
      // Primary check: real server-side verification via Supabase Auth (cannot be bypassed
      // from the browser console the way the old local-only check could be).
      if(supabaseClient && em){
        const {data, error} = await supabaseClient.auth.signInWithPassword({email: em, password: p});
        if(!error && data && data.user) ok = true;
      }
      // Fallback: if Supabase isn't reachable (offline) or email not set up yet, fall back
      // to the original local check so the shop is never locked out of its own data.
      if(!ok && s && u===s.adminUsername && (await verifyStorePassword(s, p))){
        ok = true;
      }
      if(s && ok){
        currentStoreId = s.id;
        setActiveSession(s.id);
        storeLoginSelectedId = null;
        currentView = 'dashboard';
        hideAuthScreen();
        await loadData();
        await pullFromCloudIfEmpty();
      } else {
        const err=document.getElementById('authError'); if(err) err.style.display='block';
      }
    } finally {
      loginInProgress=false;
      if(loginBtn) loginBtn.disabled=false;
    }
  };
  if(loginBtn) loginBtn.onclick=doLogin;
  // Enter key in either field submits the form, matching normal login-form expectations
  [usernameInput, emailInput, passwordInput].forEach(inp=>{
    if(inp) inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
  });
  if(usernameInput) usernameInput.focus();
  const showNewBtn=document.getElementById('showNewStoreFormBtn');
  if(showNewBtn) showNewBtn.onclick=()=>{
    const box=document.getElementById('newStoreFormBox');
    if(box){ box.style.display='block'; box.innerHTML=newStoreFormHTML(); wireNewStoreForm(); }
  };
  const wipeBtn=document.getElementById('wipeAllStoresBtn');
  if(wipeBtn) wipeBtn.onclick=async (e)=>{
    e.preventDefault();
    if(!(await uiConfirm('Is browser mein saved SAARE stores, customers, bills, purchases — sab kuch permanently delete ho jayega. Ye sirf testing/reset ke liye hai. Pakka clear karna hai?'))) return;
    if(!(await uiConfirm('Aakhri confirmation: koi backup file nahi le rakhi to sab data hamesha ke liye chala jayega. Continue?'))) return;
    localStorage.clear();
    uiAlert('Sab local data clear ho gaya. Page ab reload ho jayega.');
    setTimeout(()=>location.reload(), 600);
  };
}
function wireNewStoreForm(){
  const btn=document.getElementById('createStoreBtn');
  if(btn) btn.onclick=async ()=>{
    const name=(document.getElementById('newStoreName').value||'').trim();
    const user=(document.getElementById('newStoreUser').value||'').trim();
    const email=(document.getElementById('newStoreEmail').value||'').trim();
    const pass=(document.getElementById('newStorePass').value||'');
    const err=document.getElementById('newStoreError');
    err.style.display='none';
    if(!name || !user || !email || !pass){ err.textContent='Sab fields bharna zaroori hai (email bhi).'; err.style.display='block'; return; }
    if(STORES.find(s=>s.name.toLowerCase()===name.toLowerCase())){ err.textContent='Is naam ka store pehle se hai.'; err.style.display='block'; return; }
    btn.disabled = true;
    try{
      // Create the real cloud account first. If this fails (e.g. no internet, or the
      // email is already registered), we stop here rather than creating a store that
      // looks set up but has no working cloud login behind it.
      if(supabaseClient){
        const {data, error} = await supabaseClient.auth.signUp({email, password: pass});
        if(error){ err.textContent = 'Cloud account nahi ban paya: ' + error.message; err.style.display='block'; btn.disabled=false; return; }
      }
      const newId = uid('store');
      const newStore = {id:newId, name, adminUsername:user, adminEmail:email, createdAt: today()};
      await setStorePassword(newStore, pass); // local fallback hash, in case of offline use
      STORES.push(newStore);
      saveStoresMeta();
      storeLoginSelectedId = newId;
      renderAuthScreen();
      if(supabaseClient) uiAlert('Store ban gaya. Agar email confirmation maanga gaya ho to email check karke confirm kar lein, phir login karein.');
    } finally {
      btn.disabled = false;
    }
  };
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const inStock = DATA.mobiles.filter(m=>m.status==='instock').length;
  const soldTotal = DATA.mobiles.filter(m=>m.status==='sold').length;
  const accQty = DATA.accessories.reduce((s,a)=>s+Number(a.qty||0),0);
  const lowAcc = DATA.accessories.filter(a=>Number(a.qty)<=2);
  const todays = DATA.invoices.filter(i=>i.date===today());
  const todaysTotal = todays.reduce((s,i)=>s+invoiceNetTotal(i),0);
  const monthStr = today().slice(0,7);
  const monthInvoices = DATA.invoices.filter(i=>(i.date||'').slice(0,7)===monthStr);
  const monthTotal = monthInvoices.reduce((s,i)=>s+invoiceNetTotal(i),0);
  const recent = [...DATA.invoices].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,6);
  const totalReceivable = DATA.customers.reduce((sum,c)=>sum+Math.max(0,customerBalance(c)),0);
  const totalPayable = DATA.suppliers.reduce((sum,s)=>sum+Math.max(0,supplierBalance(s)),0);
  // Advance paid to a supplier = we paid more than we've purchased from them so far
  // (an amount the supplier effectively owes us back, in cash or in future goods).
  const totalAdvanceToSuppliers = DATA.suppliers.reduce((sum,s)=>sum+Math.max(0,-supplierBalance(s)),0);
  // Advance received from a customer = they paid more than they've been billed so far
  // (an amount we effectively owe them back, in cash or in future goods).
  const totalAdvanceFromCustomers = DATA.customers.reduce((sum,c)=>sum+Math.max(0,-customerBalance(c)),0);
  const mobileStockValue = DATA.mobiles.filter(m=>m.status==='instock').reduce((s,m)=>s+Number(m.purchasePrice||0),0);
  const accStockValue = DATA.accessories.reduce((s,a)=>s+Number(a.qty||0)*Number(a.purchasePrice||0),0);
  const totalStockValue = mobileStockValue + accStockValue;
  const totalProfit = DATA.invoices.reduce((s,inv)=>s+invoiceProfit(inv),0);
  const monthProfit = monthInvoices.reduce((s,inv)=>s+invoiceProfit(inv),0);
  const totalExpenses = (DATA.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
  const monthExpenses = (DATA.expenses||[]).filter(e=>(e.date||'').slice(0,7)===monthStr).reduce((s,e)=>s+Number(e.amount||0),0);
  const totalNetProfit = totalProfit - totalExpenses;
  const monthNetProfit = monthProfit - monthExpenses;
  const trend = last6MonthsSales();
  const overdueEmiList = [];
  DATA.emiPlans.forEach(p=>p.installments.forEach(i=>{ if(emiInstStatus(i)==='overdue') overdueEmiList.push({p,i}); }));
  const overdueEmiAmount = overdueEmiList.reduce((s,x)=>s+Number(x.i.amount),0);
  const emiOutstandingTotal = DATA.emiPlans.reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const emiSelfOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')==='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);

  const lastBackup = DATA.settings && DATA.settings.lastBackupDate;
  let backupDaysAgo = null;
  if(lastBackup){
    const d1 = new Date(lastBackup), d2 = new Date(today());
    backupDaysAgo = Math.round((d2-d1)/(1000*60*60*24));
  }
  const showBackupBanner = !backupBannerDismissed && (!lastBackup || backupDaysAgo>=7);
  const backupBannerText = !lastBackup ? 'kabhi nahi' : (backupDaysAgo<=0 ? 'aaj' : backupDaysAgo+' din pehle');
  // Severity escalates the longer backup is overdue, so the risk is visually obvious at a glance
  const backupSeverity = (!lastBackup || backupDaysAgo>=15) ? 'high' : 'medium';
  const backupBannerStyle = backupSeverity==='high'
    ? 'background:#FBE9E9;border-left:4px solid #C23A3A;color:#7a1f1f'
    : 'background:#fff3cd;border-left:4px solid #e0a800;color:#5c4400';
  const backupBannerIcon = backupSeverity==='high' ? '🔴' : '⚠';

  return `
    <h1>Dashboard</h1>
    <div class="sub">Hills ERP — Today: ${today()}</div>
    ${showBackupBanner ? `
    <div class="notice" id="backupWarnBanner" style="${backupBannerStyle};display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span>${backupBannerIcon} Aapne pichhli baar backup <b>${backupBannerText}</b> liya${backupSeverity==='high' ? ' — data loss ka risk badh gaya hai' : ''}. Abhi le lo</span>
      <span style="display:flex;gap:8px">
        <button class="btn sm" id="bannerBackupBtn">⬇ Backup Le Lo</button>
        <button class="btn outline sm" id="bannerDismissBtn">✕</button>
      </span>
    </div>` : ''}
    <div class="notice">📍 Data is currently stored locally in THIS BROWSER only (localStorage) — it will NOT sync across devices or browsers, and will be lost if you clear browser data/history. Backup, GST settings, PIN aur Audit Log ab ⚙ Settings page mein mil jaayenge.</div>
    <div class="grid4">
      <div class="stat clickable" data-navstat="stock-mobile" title="Go to Stock → Mobiles"><div class="n">${inStock}</div><div class="l">Mobiles in stock</div></div>
      <div class="stat clickable" data-navstat="stock-mobile" title="Go to Stock → Mobiles"><div class="n">${soldTotal}</div><div class="l">Total mobiles sold</div></div>
      <div class="stat clickable" data-navstat="stock-accessory" title="Go to Stock → Accessories"><div class="n">${accQty}</div><div class="l">Accessories (total qty)</div></div>
      <div class="stat clickable" data-navstat="today-sales" title="Jump to today's sales below"><div class="n">${fmt(todaysTotal)}</div><div class="l">Today's sales (${todays.length} bills)</div></div>
    </div>
    <div class="grid4">
      <div class="stat clickable wide" data-navstat="stock-mobile" title="Go to Stock"><div class="n">${fmt(totalStockValue)}</div><div class="l">Total stock value (at purchase cost)</div></div>
      <div class="stat wide"><div class="n">${fmt(mobileStockValue)}</div><div class="l">— Mobiles stock value</div></div>
      <div class="stat wide"><div class="n">${fmt(accStockValue)}</div><div class="l">— Accessories stock value</div></div>
      <div class="stat wide"><div class="n">${fmt(monthTotal)}</div><div class="l">This month's sales (${monthInvoices.length} bills)</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat wide"><div class="n" style="color:var(--green)">${fmt(totalProfit)}</div><div class="l">Total profit — all time (sale price − purchase price)</div></div>
      <div class="stat wide"><div class="n" style="color:var(--green)">${fmt(monthProfit)}</div><div class="l">This month's profit</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable wide" data-navstat="expenses" title="Go to Expenses"><div class="n" style="color:var(--red)">${fmt(totalExpenses)}</div><div class="l">Total expenses — all time (rent/salary/bijli etc.)</div></div>
      <div class="stat wide" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)"><b>${fmt(totalNetProfit)}</b></div><div class="l"><b>Net Profit</b> (profit − expenses) — all time</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable wide" data-navstat="expenses" title="Go to Expenses"><div class="n" style="color:var(--red)">${fmt(monthExpenses)}</div><div class="l">This month's expenses</div></div>
      <div class="stat wide" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)"><b>${fmt(monthNetProfit)}</b></div><div class="l"><b>Net Profit</b> — this month</div></div>
    </div>
    <div class="card">
      <b>📊 Sales trend — last 6 months</b>
      ${renderSalesTrendSVG(trend)}
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="receivable" title="Go to Customers"><div class="n">${fmt(totalReceivable)}</div><div class="l">Total receivable (customer dues — includes Self-Finance EMI still pending)</div></div>
      <div class="stat clickable" data-navstat="payable" title="Go to Purchase → Suppliers/Ledger"><div class="n">${fmt(totalPayable)}</div><div class="l">Total payable (supplier dues)</div></div>
    </div>
    ${(totalAdvanceToSuppliers>0 || totalAdvanceFromCustomers>0) ? `
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="payable" title="Go to Purchase → Suppliers/Ledger"><div class="n" style="color:var(--green)">${fmt(totalAdvanceToSuppliers)}</div><div class="l">Advance paid to suppliers (they owe us back)</div></div>
      <div class="stat clickable" data-navstat="receivable" title="Go to Customers"><div class="n" style="color:var(--amber)">${fmt(totalAdvanceFromCustomers)}</div><div class="l">Advance received from customers (we owe them back)</div></div>
    </div>` : ''}
    ${DATA.emiPlans.length? `<div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer"><div class="n">${fmt(emiOutstandingTotal)}</div><div class="l">EMI outstanding (all financers)</div></div>
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer"><div class="n" style="color:var(--red)">${fmt(overdueEmiAmount)}</div><div class="l">Overdue EMI (${overdueEmiList.length} installments)</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:1fr">
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)">${fmt(emiSelfOutstanding)}</div><div class="l"><b>🏠 Self-Finance receivable</b> — yahi paisa asal mein hamare business ka hai, isi ko sabse zyada follow-up karna hai</div></div>
    </div>` : ''}
    ${lowAcc.length? `<div class="card clickable" data-navstat="stock-accessory" title="Go to Stock → Accessories"><b>⚠ Low stock accessories (2 or fewer)</b><table style="margin-top:10px"><tr><th>Name</th><th>Remaining qty</th></tr>${lowAcc.map(a=>`<tr><td>${esc(a.name)}</td><td><span class="tag low">${a.qty}</span></td></tr>`).join('')}</table></div>` : ''}
    <div class="card" id="recentSalesBox">
      <b>Recent Sales</b>
      ${recent.length? `<table style="margin-top:10px"><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th></tr>${recent.map(i=>{
        const cust = DATA.customers.find(c=>c.id===i.customerId);
        const itemsHTML = i.items.map((it,idx)=>{
          const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
          const fullyReturned = returnedQty >= Number(it.qty||1);
          if(fullyReturned) return `<span class="tag sold" style="margin-right:4px">Returned</span>`;
          return `<button class="btn outline sm" data-returnitem="${i.id}|${idx}" style="margin-right:4px;padding:2px 8px;font-size:11px" title="${esc(it.name)}">↩</button>`;
        }).join('');
        return `<tr><td>${i.date}</td><td>${esc(cust?cust.name:'—')}</td><td>${i.items.length} items ${itemsHTML}</td><td>${fmt(invoiceNetTotal(i))}</td></tr>`;
      }).join('')}</table>` : `<div class="empty">No sales recorded yet</div>`}
    </div>
  `;
}

function renderNewSale(){
  const cust = DATA.customers.find(c=>c.id===saleCustomerId);
  const subtotal = saleCart.reduce((s,i)=>s+i.price*i.qty,0);
  const discount = Number(saleDiscount)||0;
  const netTotal = Math.max(0, subtotal-discount);
  const paidSoFar = salePayments.reduce((s,p)=>{
    if(p.mode==='Finance' && p.financeType==='self') return s; // shown separately below, not as "paid"
    return s + Number(p.amount||0);
  },0);
  const selfFinanceAmt = salePayments.reduce((s,p)=>(p.mode==='Finance' && p.financeType==='self') ? s+Number(p.amount||0) : s, 0);
  const dueAmount = Math.max(0, netTotal-paidSoFar-selfFinanceAmt);

  return `

          <div class="field"><label>Mobile number * (primary ID)</label><input id="ncPhone" placeholder="10 digits" inputmode="numeric" pattern="[0-9]*" maxlength="13"></div>
          <div class="field"><label>Name *</label><input id="ncName"></div>
