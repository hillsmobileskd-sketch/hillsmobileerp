<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let DATA = {customers:[], mobiles:[], accessories:[], invoices:[], suppliers:[], purchases:[], payments:[], customerPayments:[], returns:[], emiPlans:[], emiCollections:[], auditLog:[], expenses:[], settings:{}, purchaseCounter:0, invoiceCounter:0};
// ---------- FIREBASE ----------
// Hills Mobile ERP — cloud project. Auth handles Owner + Store-Manager logins;
// Firestore holds the shared store list + user-role records so every device
// (owner's phone/laptop, each shop's manager device) sees the same store list.
const firebaseConfig = {
  apiKey: "AIzaSyCk_K4KAieJdfABIhOBz9HEsiVBVougyXI",
  authDomain: "hillsmobileerp.firebaseapp.com",
  projectId: "hillsmobileerp",
  storageBucket: "hillsmobileerp.firebasestorage.app",
  messagingSenderId: "153415150787",
  appId: "1:153415150787:web:7180feacf04987f4910676"
};
const fbApp = firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
// A second, independent Firebase app instance — used ONLY when the Owner creates a new
// Manager account. Firebase's client SDK logs you in as whichever user you just created,
// which would kick the Owner out of their own session. Creating the manager account on
// this separate app instance avoids touching the Owner's real signed-in session.
const fbAdminApp = firebase.initializeApp(firebaseConfig, 'adminHelper');

// ---------- CLOUD DATA SYNC (all business-data collections) ----------
// Strategy: `saveData()` is the single choke point every part of the app already calls
// after any add/edit/delete. So instead of touching every screen's code, we hook cloud
// sync into that one function. For each synced collection we keep an in-memory map of
// "what we last knew Firestore to contain" (id -> JSON string of that record). On every
// save we diff the live DATA array against that map: anything new/changed gets written,
// anything missing gets deleted from the cloud. This keeps network writes small (only
// changed records, not the whole shop's data every time).
// A live listener (onSnapshot) on the same cloud collection pulls in changes made from
// OTHER devices (e.g. Owner's laptop while a Manager's phone is also open) and merges
// them into DATA in real time, without needing a page refresh.
const SYNCED_COLLECTIONS = ['customers','mobiles','accessories','invoices','suppliers','purchases','payments','customerPayments','returns','emiPlans','emiCollections','expenses','auditLog'];
// Most collections use `id` as their unique key, but DATA.mobiles has no `id` field —
// each phone is identified by its IMEI (see how the rest of the app looks mobiles up,
// e.g. DATA.mobiles.find(x=>x.imei===...)). purchaseId/fromInvoiceId is appended so two
// separate stock entries that happen to share an IMEI (e.g. a phone resold after being
// taken back) don't collide into a single cloud record.
function recordKey(name, rec){
  if(name==='mobiles') return String(rec.imei||'noimei')+'__'+String(rec.purchaseId||rec.fromInvoiceId||'norefer');
  return rec.id;
}
let _cloudSnapshotMap = {};      // e.g. _cloudSnapshotMap.customers = Map(id -> JSON string) of last known cloud state
let _cloudUnsubscribes = [];     // active onSnapshot() unsubscribe functions, so we can detach on logout/store-switch
let _cloudSyncBusy = {};         // per-collection lock so a fast second save can't overlap an in-flight sync run
let _applyingRemoteChange = false; // true while merging an incoming cloud change into DATA, so we don't loop it back up

function resetCloudSyncState(){
  _cloudSnapshotMap = {};
  SYNCED_COLLECTIONS.forEach(name=>{ _cloudSnapshotMap[name] = new Map(); _cloudSyncBusy[name] = false; });
  _settingsSyncedJSON = null;
  detachAllCloudListeners();
}
function detachAllCloudListeners(){
  _cloudUnsubscribes.forEach(unsub=>{ try{ unsub(); }catch(e){} });
  _cloudUnsubscribes = [];
}

// Pushes local changes for one collection (e.g. 'customers') up to Firestore, based on
// what changed since the last time we synced. Safe to call often — if nothing changed,
// it does no network writes at all.
async function syncCollectionToCloud(name){
  if(!currentStoreId) return;
  if(_cloudSyncBusy[name]) return; // a previous run for this same collection is still in flight
  _cloudSyncBusy[name] = true;
  try{
    const liveArr = DATA[name] || [];
    const prevMap = _cloudSnapshotMap[name] || new Map();
    const liveIds = new Set();
    const colRef = fbDb.collection('stores').doc(currentStoreId).collection(name);
    // Firestore caps a single batch at 500 writes. A brand-new store's very first sync
    // can easily have more records than that (years of invoices, etc.), so writes are
    // queued here and flushed in chunks of 400 rather than one giant batch.
    let pending = [];
    const flush = async ()=>{
      if(pending.length===0) return;
      const batch = fbDb.batch();
      pending.forEach(op=>{ if(op.type==='set') batch.set(op.ref, op.data); else batch.delete(op.ref); });
      await batch.commit();
      pending = [];
    };
    for(const rec of liveArr){
      if(!rec) continue;
      const key = recordKey(name, rec);
      if(!key) continue;
      liveIds.add(key);
      const json = JSON.stringify(rec);
      if(prevMap.get(key) !== json){
        pending.push({type:'set', ref:colRef.doc(key), data:rec});
        if(pending.length>=400) await flush();
      }
    }
    // Anything that was in the cloud/local snapshot before, but is gone from the live
    // array now, was deleted locally — remove it from the cloud too.
    for(const oldId of prevMap.keys()){
      if(!liveIds.has(oldId)){
        pending.push({type:'delete', ref:colRef.doc(oldId)});
        if(pending.length>=400) await flush();
      }
    }
    await flush();
    // Update our "last known cloud state" snapshot to match what we just pushed.
    const newMap = new Map();
    liveArr.forEach(rec=>{ if(rec){ const key=recordKey(name,rec); if(key) newMap.set(key, JSON.stringify(rec)); } });
    _cloudSnapshotMap[name] = newMap;
  }catch(e){
    console.error('Cloud sync (push) failed for '+name+':', e);
    // Deliberately not shown to the user as an alert — local save already succeeded via
    // localStorage, so their work is not lost. It will retry on the next save.
  } finally {
    _cloudSyncBusy[name] = false;
  }
}

// Attaches a real-time listener for one collection so changes made on OTHER devices
// (or by other users of the same store) flow into this session automatically.
function attachCloudListener(name){
  if(!currentStoreId) return;
  const colRef = fbDb.collection('stores').doc(currentStoreId).collection(name);
  const unsub = colRef.onSnapshot(snap=>{
    _applyingRemoteChange = true;
    try{
      let changed = false;
      const map = _cloudSnapshotMap[name] || new Map();
      snap.docChanges().forEach(change=>{
        const rec = change.doc.data();
        const key = change.doc.id;
        const json = JSON.stringify(rec);
        const arr = DATA[name] || (DATA[name]=[]);
        if(change.type==='removed'){
          const idx = arr.findIndex(x=>recordKey(name,x)===key);
          if(idx>-1){ arr.splice(idx,1); changed = true; }
          map.delete(key);
        } else {
          // 'added' or 'modified'
          if(map.get(key) !== json){
            const idx = arr.findIndex(x=>recordKey(name,x)===key);
            if(idx>-1) arr[idx] = rec; else arr.push(rec);
            changed = true;
          }
          map.set(key, json);
        }
      });
      _cloudSnapshotMap[name] = map;
      if(changed){
        try{ localStorage.setItem(currentStorageKey(), JSON.stringify(DATA)); }catch(e){}
        render();
      }
    } finally {
      _applyingRemoteChange = false;
    }
  }, err=>{
    console.error('Cloud sync (listen) failed for '+name+':', err);
  });
  _cloudUnsubscribes.push(unsub);
}
function attachCloudSync(){
  SYNCED_COLLECTIONS.forEach(name=>{
    attachCloudListener(name);
    // Also push once right away — this is what uploads a store's existing local-only
    // data into the cloud the very first time this feature runs for that store.
    syncCollectionToCloud(name);
  });
  attachSettingsListener();
  syncSettingsToCloud();
}

// ---- Settings + counters sync ----
// DATA.settings, purchaseCounter and invoiceCounter aren't a list of records like the
// collections above — they're a single small object, so they get their own doc
// (stores/{storeId}/meta/settings) instead of one-doc-per-record.
let _settingsSyncedJSON = null; // last known cloud state, so we only write when it actually changed

function settingsBundle(){
  return { settings: DATA.settings||{}, purchaseCounter: DATA.purchaseCounter||0, invoiceCounter: DATA.invoiceCounter||0 };
}
async function syncSettingsToCloud(){
  if(!currentStoreId) return;
  try{
    const bundle = settingsBundle();
    const json = JSON.stringify(bundle);
    if(json === _settingsSyncedJSON) return; // nothing changed, skip the write
    await fbDb.collection('stores').doc(currentStoreId).collection('meta').doc('settings').set(bundle);
    _settingsSyncedJSON = json;
  }catch(e){
    console.error('Cloud sync (settings push) failed:', e);
  }
}
function attachSettingsListener(){
  if(!currentStoreId) return;
  const ref = fbDb.collection('stores').doc(currentStoreId).collection('meta').doc('settings');
  const unsub = ref.onSnapshot(snap=>{
    if(!snap.exists) return;
    const remote = snap.data();
    const json = JSON.stringify(remote);
    if(json === _settingsSyncedJSON) return; // this is just our own write echoing back
    _applyingRemoteChange = true;
    try{
      DATA.settings = remote.settings || DATA.settings;
      // Counters: an invoice/purchase number already handed out on THIS device should
      // never be reused, so when merging in a remote counter we only ever move it
      // forward, never backward.
      DATA.purchaseCounter = Math.max(DATA.purchaseCounter||0, remote.purchaseCounter||0);
      DATA.invoiceCounter = Math.max(DATA.invoiceCounter||0, remote.invoiceCounter||0);
      _settingsSyncedJSON = json;
      try{ localStorage.setItem(currentStorageKey(), JSON.stringify(DATA)); }catch(e){}
      render();
    } finally {
      _applyingRemoteChange = false;
    }
  }, err=>{ console.error('Cloud sync (settings listen) failed:', err); });
  _cloudUnsubscribes.push(unsub);
}

// ---- Race-condition-safe invoice/purchase numbering ----
// DATA.invoiceCounter / DATA.purchaseCounter used to be incremented purely locally,
// so if the Owner and a Manager created a bill on two different devices at almost the
// exact same moment, both could be handed the same number. This uses a Firestore
// transaction against a dedicated counters doc — Firestore guarantees only one
// transaction "wins" at a time for the same document, so concurrent requests from any
// number of devices always come out with distinct, strictly-increasing numbers.
// If there is no internet connection, the transaction cannot complete (Firestore has no
// way to guarantee uniqueness purely from local cache), so this returns null and the
// caller falls back to the old local-counter behavior — keeping the shop's billing
// screen usable even fully offline, at the (rare, offline-only) cost of losing the
// cross-device uniqueness guarantee for that specific bill.
async function getNextCounterAtomic(field){
  if(!currentStoreId) return null;
  try{
    const ref = fbDb.collection('stores').doc(currentStoreId).collection('meta').doc('counters');
    const next = await fbDb.runTransaction(async (tx)=>{
      const doc = await tx.get(ref);
      const current = (doc.exists && doc.data()[field]) || 0;
      const n = current + 1;
      tx.set(ref, {[field]: n}, {merge:true});
      return n;
    });
    return next;
  }catch(e){
    console.error('Atomic counter unavailable for '+field+' (likely offline) — using local fallback numbering:', e);
    return null;
  }
}

function fmt(n){ return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
function numToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num<=0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10]:''); }
  function threeDigits(n){ let str=''; if(n>=100){ str += ones[Math.floor(n/100)] + ' Hundred'; n=n%100; if(n) str+=' '; } if(n) str += twoDigits(n); return str; }
  let crore = Math.floor(num/10000000); num%=10000000;
  let lakh = Math.floor(num/100000); num%=100000;
  let thousand = Math.floor(num/1000); num%=1000;
  let hundred = num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return parts.join(' ');
}
function uid(p){ return p+'_'+Date.now()+'_'+Math.floor(Math.random()*10000); }
function today(){ return new Date().toISOString().slice(0,10); }
function inDateRange(d, fromDate, toDate){ return (!fromDate || (d||'') >= fromDate) && (!toDate || (d||'') <= toDate); }
function addMonths(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function emiInstStatus(inst){ if(inst.status==='paid') return 'paid'; if(inst.status==='cancelled') return 'cancelled'; if(inst.status==='partial') return 'partial'; return inst.dueDate < today() ? 'overdue' : 'pending'; }
function emiPlanOutstanding(plan){ return plan.installments.filter(i=>i.status!=='paid'&&i.status!=='cancelled').reduce((s,i)=>s+(i.status==='partial'?Number(i.remainingAfterPartial||0):Number(i.amount)),0); }
function emiPlanOverdueAmount(plan){ return plan.installments.filter(i=>emiInstStatus(i)==='overdue').reduce((s,i)=>s+Number(i.amount),0); }
function emiPlanStatus(plan){
  if(plan.installments.every(i=>i.status==='paid'||i.status==='cancelled')) return 'closed';
  if(plan.installments.some(i=>emiInstStatus(i)==='overdue')) return 'overdue';
  return 'active';
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------- CREDENTIAL HASHING (PIN / store passwords) ----------
// NOTE (honest limitation): this is a static, client-side-only file — anyone can read this
// JS. Hashing here stops plaintext from sitting visibly in localStorage; it is NOT equivalent
// to real server-side auth security. It also degrades gracefully: if the browser doesn't
// expose crypto.subtle (e.g. very old browser, or a non-secure context that blocks it), we
// fall back to the original plaintext comparison so login never breaks.
const canHash = !!(window.crypto && window.crypto.subtle);
async function sha256Hex(str){
  const data = new TextEncoder().encode(String(str));
  const digest = await window.crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Verifies a PIN against DATA.settings, lazily migrating a legacy plaintext PIN to a hash
// the first time it's successfully checked (so existing shops are never locked out).
async function verifyEditPin(input){
  const settings = DATA.settings || (DATA.settings = {});
  if(!canHash){ return input === (settings.editPin || '1234'); }
  if(!settings.editPinHash){
    const legacy = settings.editPin || '1234';
    if(input !== legacy) return false; // wrong PIN entered before any migration has happened
    settings.editPinHash = await sha256Hex(legacy);
    delete settings.editPin;
    saveData();
    return true;
  }
  return (await sha256Hex(input)) === settings.editPinHash;
}
async function setEditPin(newPin){
  const settings = DATA.settings || (DATA.settings = {});
  if(canHash){ settings.editPinHash = await sha256Hex(newPin); delete settings.editPin; }
  else { settings.editPin = newPin; }
}
// Verifies a store's admin password, lazily migrating legacy plaintext the same way.
async function verifyStorePassword(store, input){
  if(!canHash){ return input === (store.adminPassword || 'admin123'); }
  if(!store.adminPasswordHash){
    const legacy = store.adminPassword || 'admin123';
    if(input !== legacy) return false;
    store.adminPasswordHash = await sha256Hex(legacy);
    delete store.adminPassword;
    saveStoresMeta();
    return true;
  }
  return (await sha256Hex(input)) === store.adminPasswordHash;
}
async function setStorePassword(store, newPassword){
  if(canHash){ store.adminPasswordHash = await sha256Hex(newPassword); delete store.adminPassword; }
  else { store.adminPassword = newPassword; }
}

// ---------- CUSTOM MODAL (replaces native alert/confirm/prompt) ----------
// uiAlert: fire-and-forget, matches old uiAlert() usage where the code right after
//          the call never depended on the user having dismissed the native dialog.
// uiConfirm / uiPrompt: return a Promise, so callers must `await` them — the
//          calling function needs to be `async` for this to work.
function showUiModal({message, mode, defaultValue, resolve}){
  const overlay = document.getElementById('uiModalOverlay');
  const msgEl = document.getElementById('uiModalMessage');
  const inputWrap = document.getElementById('uiModalInputWrap');
  const inputEl = document.getElementById('uiModalInput');
  const actionsEl = document.getElementById('uiModalActions');
  if(!overlay || !msgEl || !inputWrap || !inputEl || !actionsEl){
    // Safety fallback: if modal markup is ever missing, don't silently swallow the interaction
    if(mode==='alert'){ window.alert(message); return; }
    if(mode==='confirm'){ resolve(window.confirm(message)); return; }
    resolve(window.prompt(message, defaultValue)); return;
  }
  msgEl.textContent = message;
  actionsEl.innerHTML = '';
  if(mode==='prompt'){ inputWrap.style.display='block'; inputEl.value = defaultValue||''; }
  else { inputWrap.style.display='none'; }

  const onKeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); if(mode==='prompt') close(inputEl.value); else close(mode==='confirm'?true:undefined); }
    else if(e.key==='Escape'){ e.preventDefault(); close(mode==='prompt'?null:(mode==='confirm'?false:undefined)); }
  };
  function close(result){
    overlay.classList.remove('show');
    document.removeEventListener('keydown', onKeydown);
    if(resolve) resolve(result);
  }
  document.addEventListener('keydown', onKeydown);

  if(mode==='alert'){
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';
    okBtn.onclick=()=>close();
    actionsEl.appendChild(okBtn);
  } else if(mode==='confirm'){
    const cancelBtn=document.createElement('button'); cancelBtn.className='btn outline sm'; cancelBtn.textContent='Cancel';
    cancelBtn.onclick=()=>close(false);
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';
    okBtn.onclick=()=>close(true);
    actionsEl.appendChild(cancelBtn); actionsEl.appendChild(okBtn);
  } else {
    const cancelBtn=document.createElement('button'); cancelBtn.className='btn outline sm'; cancelBtn.textContent='Cancel';
    cancelBtn.onclick=()=>close(null);
    const okBtn=document.createElement('button'); okBtn.className='btn sm'; okBtn.textContent='OK';
    okBtn.onclick=()=>close(inputEl.value);
    actionsEl.appendChild(cancelBtn); actionsEl.appendChild(okBtn);
  }
  overlay.classList.add('show');
  if(mode==='prompt') setTimeout(()=>inputEl.focus(), 0);
  else setTimeout(()=>{ const b=actionsEl.querySelector('button:last-child'); if(b) b.focus(); }, 0);
}
function uiAlert(message){ showUiModal({message, mode:'alert'}); }
function uiConfirm(message){ return new Promise(resolve=>showUiModal({message, mode:'confirm', resolve})); }
function uiPrompt(message, defaultValue){ return new Promise(resolve=>showUiModal({message, mode:'prompt', defaultValue, resolve})); }

// ---------- AUTO-SUGGEST (learn from previously entered values, no repeated typing) ----------
function uniqueBrands(){ return Array.from(new Set(DATA.mobiles.map(m=>m.brand).filter(Boolean))).sort(); }
function uniqueModels(){ return Array.from(new Set(DATA.mobiles.map(m=>m.model).filter(Boolean))).sort(); }
// Snap a freshly-typed brand/model to an already-existing one (case/spacing-insensitive) so that
// "Samsung" and "samsung" (or extra spaces) never end up as two different brands/models in stock.
// If nothing matching exists yet, the typed value is kept as-is (and becomes the new canonical spelling).
function normalizeBrand(typed){
  const t = (typed||'').trim();
  if(!t) return t;
  const match = uniqueBrands().find(b=>b.toLowerCase()===t.toLowerCase());
  return match || t;
}
function normalizeModel(typed){
  const t = (typed||'').trim();
  if(!t) return t;
  const match = uniqueModels().find(m=>m.toLowerCase()===t.toLowerCase());
  return match || t;
}
function uniqueAccNames(){ return Array.from(new Set(DATA.accessories.map(a=>a.name).filter(Boolean))).sort(); }
function uniqueAccCategories(){ return Array.from(new Set(DATA.accessories.map(a=>a.category).filter(Boolean))).sort(); }

// ---------- EXPORT: CSV (opens directly in Excel) ----------
function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    let s = (c===null||c===undefined)?'':String(c);
    if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',')).join('\r\n');
}
function downloadCSV(filename, rows){
  const csv = toCSV(rows);
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ---------- BRAND-WISE / CATEGORY-WISE STOCK SUMMARIES ----------
// Groups current mobile stock by brand — used on the Stock screen (quick glance) and in Reports (exportable).
function brandWiseMobileSummary(){
  const groups = {};
  DATA.mobiles.filter(m=>m.status==='instock').forEach(m=>{
    const b = (m.brand||'').trim() || 'Unknown';
    if(!groups[b]) groups[b] = {qty:0, value:0};
    groups[b].qty += 1;
    groups[b].value += Number(m.purchasePrice||0);
  });
  const soldByBrand = {};
  DATA.mobiles.filter(m=>m.status==='sold').forEach(m=>{
    const b = (m.brand||'').trim() || 'Unknown';
    soldByBrand[b] = (soldByBrand[b]||0) + 1;
  });
  const brands = Array.from(new Set([...Object.keys(groups), ...Object.keys(soldByBrand)])).sort();
  return brands.map(b=>({
    brand: b,
    inStockQty: groups[b] ? groups[b].qty : 0,
    stockValue: groups[b] ? groups[b].value : 0,
    soldQty: soldByBrand[b] || 0
  }));
}
function reportMobileBrandStock(){
  const summary = brandWiseMobileSummary();
  const headers = ['Brand','In Stock Qty','Stock Value (Purchase price)','Sold Qty (All time)'];
  const rows = summary.map(s=>[s.brand, s.inStockQty, s.stockValue, s.soldQty]);
  return {headers, rows};
}
// Groups current accessory stock by category (accessories don't have a "brand" field —
// category is the equivalent grouping, e.g. Cover / Charger / Speaker).
function categoryWiseAccessorySummary(){
  const groups = {};
  DATA.accessories.filter(a=>!a.discontinued).forEach(a=>{
    const cat = (a.category||'').trim() || 'Uncategorized';
    if(!groups[cat]) groups[cat] = {itemTypes:0, qty:0, value:0};
    groups[cat].itemTypes += 1;
    groups[cat].qty += Number(a.qty||0);
    groups[cat].value += Number(a.qty||0) * Number(a.purchasePrice||0);
  });
  const cats = Object.keys(groups).sort();
  return cats.map(c=>({category:c, itemTypes:groups[c].itemTypes, qty:groups[c].qty, value:groups[c].value}));
}
function reportAccCategoryStock(){
  const summary = categoryWiseAccessorySummary();
  const headers = ['Category','Item Types','Total Qty','Stock Value (Purchase price)'];
  const rows = summary.map(s=>[s.category, s.itemTypes, s.qty, s.value]);
  return {headers, rows};
}

// ---------- LEDGER HELPERS (single source of truth — used everywhere so numbers never mismatch) ----------
function customerBilled(c){ return DATA.invoices.filter(i=>i.customerId===c.id).reduce((s,i)=>s+i.total,0); }
// A "Finance" payment is only real cash-in-hand at billing time when it's Third-Party
// (the financer pays the shop upfront). Self-Finance is the shop's own money lent to the
// customer — it becomes real cash only as EMI installments are actually collected. So:
//  - at-sale payments: count everything EXCEPT self-finance amounts (those aren't paid yet)
//  - EMI collections: count only self-finance installments (third-party installments are the
//    financer's business, already booked as paid above — counting them again would double-count)
function customerReceived(c){
  const inv = DATA.invoices.filter(i=>i.customerId===c.id);
  const atSale = inv.reduce((s,i)=>s+(i.payments? i.payments.reduce((s2,p)=>{
    if(p.mode==='Finance' && p.financeType==='self') return s2; // not real cash yet
    return s2+Number(p.amount||0);
  }, 0) : 0),0);
  const installments = (DATA.customerPayments||[]).filter(p=>p.customerId===c.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const selfFinanceEmiCollected = (DATA.emiCollections||[]).reduce((s,e)=>{
    if(e.customerId!==c.id) return s;
    const plan = DATA.emiPlans.find(p=>p.id===e.planId);
    if(!plan || (plan.financeType||'thirdparty')!=='self') return s;
    return s+Number(e.amount||0);
  },0);
  return atSale+installments+selfFinanceEmiCollected;
}
function customerBalance(c){ return customerBilled(c) - customerReceived(c); }
function normPhone(p){ return (p||'').toString().replace(/\D/g,''); }
// Mobile number is the customer's primary ID — must be numbers only, no letters.
// Strips anything that isn't a digit and requires at least 10 digits left; returns null if invalid.
function validCustomerPhone(raw){
  const digits = (raw||'').toString().replace(/\D/g,'');
  if(digits.length < 10) return null;
  return digits;
}
// Wire a phone <input> so letters/symbols simply can't be typed into it (live strip as you type).
function wireNumericPhoneInput(inputEl){
  if(!inputEl) return;
  inputEl.addEventListener('input', ()=>{
    const cleaned = inputEl.value.replace(/\D/g,'');
    if(cleaned !== inputEl.value) inputEl.value = cleaned;
  });
}
function findCustomerByPhone(phone){ const n=normPhone(phone); return n? DATA.customers.find(c=>normPhone(c.phone)===n) : null; }
// Duplicate-supplier guard: same phone number is treated as a strong match (a phone
// number is effectively a unique real-world identity). If no phone is given on either
// side, fall back to an exact (case-insensitive) name match as a softer signal.
function findSupplierDuplicate(name, phone){
  const n = normPhone(phone);
  if(n){ const byPhone = DATA.suppliers.find(s=>normPhone(s.phone)===n); if(byPhone) return byPhone; return null; }
  const nm = (name||'').trim().toLowerCase();
  if(nm) return DATA.suppliers.find(s=>(s.name||'').trim().toLowerCase()===nm && !normPhone(s.phone)) || null;
  return null;
}
// A person can be BOTH our customer and our supplier at the same time (e.g. someone we buy
// phones from who also buys phones from us). Since the phone number is each side's primary
// identity, matching on it lets us surface a combined "same aadmi" view without merging the
// underlying customer/supplier records (which stay separate on purpose — invoices link to
// customerId, purchases link to supplierId, and that must never change).
function linkedCustomerFor(supplier){
  const n = normPhone(supplier && supplier.phone);
  return n ? (DATA.customers.find(c=>normPhone(c.phone)===n) || null) : null;
}
function linkedSupplierFor(customer){
  const n = normPhone(customer && customer.phone);
  return n ? (DATA.suppliers.find(s=>normPhone(s.phone)===n) || null) : null;
}

function supplierPurchased(s){ return DATA.purchases.filter(p=>p.supplierId===s.id).reduce((sum,p)=>sum+p.totalAmount,0); }
function supplierPaid(s){ return DATA.payments.filter(p=>p.supplierId===s.id).reduce((sum,p)=>sum+p.amount,0); }
function supplierBalance(s){ return supplierPurchased(s) - supplierPaid(s); }

// ---- Profit calculation (accounts for returned items) ----
function invoiceProfit(inv){
  return inv.items.reduce((sum,it)=>{
    const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
    const soldQty = Number(it.qty||1) - returnedQty;
    if(soldQty<=0) return sum;
    let cost = 0;
    if(it.type==='mobile'){
      const m = DATA.mobiles.find(x=>x.imei===it.ref);
      cost = m ? Number(m.purchasePrice||0) : 0;
    } else {
      const a = DATA.accessories.find(x=>x.id===it.ref);
      cost = a ? Number(a.purchasePrice||0) : 0;
    }
    return sum + (Number(it.price||0) - cost) * soldQty;
  }, 0);
}
function invoiceNetTotal(inv){
  // total after subtracting refunded amounts for returned items
  const returnedValue = inv.items.reduce((sum,it)=>{
    const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
    return sum + returnedQty*Number(it.price||0);
  },0);
  return Math.max(0, inv.total - returnedValue);
}
// Actual cash received against this invoice so far (excludes Self-Finance amounts,
// which aren't real cash until the EMI installments are collected — same rule used
// at the time of sale). Used to recompute `due` any time the invoice total changes
// (e.g. after a return), so `due` never goes stale.
function invoiceEffectivePaid(inv){
  return (inv.payments||[]).reduce((s,p)=>{
    if(p.mode==='Finance' && p.financeType==='self') return s; // not real cash yet
    return s + Number(p.amount||0);
  },0);
}
function recomputeInvoiceDue(inv){
  inv.due = Math.max(0, Number(inv.total||0) - invoiceEffectivePaid(inv));
  return inv.due;
}

// ---- Dashboard sales trend (last 6 months) ----
function last6MonthsSales(){
  const now = new Date();
  const result = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('en-IN',{month:'short'});
    const total = DATA.invoices.filter(inv=>(inv.date||'').slice(0,7)===key).reduce((s,inv)=>s+invoiceNetTotal(inv),0);
    result.push({key,label,total});
  }
  return result;
}
function renderSalesTrendSVG(trend){
  const max = Math.max(1, ...trend.map(t=>t.total));
  const w = 700, h = 180, padBottom = 30, padTop = 16, barGap = 14;
  const barW = (w - barGap*(trend.length+1)) / trend.length;
  const bars = trend.map((t,i)=>{
    const barH = Math.round((t.total/max) * (h-padBottom-padTop));
    const x = barGap + i*(barW+barGap);
    const y = h - padBottom - barH;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" style="fill:var(--accent);fill-opacity:${i===trend.length-1?1:0.55}"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" style="fill:var(--navy);font-weight:700">${t.total?fmt(t.total):''}</text>
      <text x="${x+barW/2}" y="${h-10}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${t.label}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:700px;display:block;margin-top:6px">${bars}</svg>`;
}

// ---- Return / refund handling ----
function processReturn(invoiceId, itemIndex, qty){
  const inv = DATA.invoices.find(i=>i.id===invoiceId);
  if(!inv) return false;
  const it = inv.items[itemIndex];
  if(!it) return false;
  if(it.type==='mobile'){
    if(it.returned){ uiAlert('This mobile has already been marked returned.'); return false; }
    const m = DATA.mobiles.find(x=>x.imei===it.ref);
    if(m){ m.status='instock'; delete m.customerId; delete m.soldDate; delete m.soldPrice; delete m.invoiceId; }
    it.returned = true;
    qty = 1;
  } else {
    const already = Number(it.returnedQty||0);
    const maxQty = Number(it.qty||1) - already;
    qty = Math.min(Number(qty)||0, maxQty);
    if(qty<=0){ uiAlert('Nothing left to return on this item.'); return false; }
    const a = DATA.accessories.find(x=>x.id===it.ref);
    if(a){ a.qty = Math.max(0, Number(a.qty||0) + qty); }
    it.returnedQty = already + qty;
  }
  const refundAmount = qty * Number(it.price||0);
  inv.total = invoiceNetTotal(inv);
  recomputeInvoiceDue(inv); // BUGFIX: due used to stay frozen at its original sale-time
  // value even after a return shrank the invoice total, so paid-in-full bills could
  // keep showing a "balance due" on reprints/resends after items were returned.
  DATA.returns.push({id:uid('ret'), invoiceId, date:today(), itemName:it.name, itemType:it.type, ref:it.ref, qty, refundAmount, customerId:inv.customerId});

  // If this invoice had a Finance (EMI) payment, cancel any unpaid installments on the linked EMI plan
  if(it.type==='mobile' && Array.isArray(inv.payments) && inv.payments.some(p=>p.mode==='Finance')){
    if(!DATA.emiPlans) DATA.emiPlans=[];
    const plan = DATA.emiPlans.find(p=>p.invoiceId===invoiceId);
    if(plan){
      plan.installments.forEach(inst=>{
        if(inst.status!=='paid'){
          inst.status='cancelled';
        }
      });
      plan.cancelledReason = 'Mobile returned (invoice '+invoiceId+')';
    }
  }

  // If this invoice had an Exchange payment, flag the mobile(s) created from that exchange for verification
  if(it.type==='mobile' && Array.isArray(inv.payments) && inv.payments.some(p=>p.mode==='Exchange')){
    DATA.mobiles.filter(x=>x.fromInvoiceId===invoiceId).forEach(x=>{ x.linkedSaleReversed = true; });
  }
  return true;
}

function wireReturnButtons(container, afterFn){
  container.querySelectorAll('[data-returnitem]').forEach(btn=>btn.onclick=async ()=>{
    const [invoiceId, idxStr] = btn.dataset.returnitem.split('|');
    const idx = Number(idxStr);
    const inv = DATA.invoices.find(i=>i.id===invoiceId);
    if(!inv) return;
    const it = inv.items[idx];
    let qty = 1;
    if(it.type!=='mobile'){
      const already = Number(it.returnedQty||0);
      const maxQty = Number(it.qty||1) - already;
      const input = await uiPrompt(`Return how many "${it.name}"? (max ${maxQty})`, String(maxQty));
      if(input===null) return;
      qty = Number(input);
      if(!qty || qty<=0 || qty>maxQty){ uiAlert('Please enter a valid quantity.'); return; }
    } else {
      if(!(await uiConfirm(`Mark "${it.name}" (IMEI ${it.ref}) as returned? It will go back into current stock.`))) return;
    }
    if(!(await askEditPin('process this return'))) return;
    if(processReturn(invoiceId, idx, qty)){
      logAudit('return', 'invoice', invoiceId, invNoLabel(inv)+': "'+it.name+'" x'+qty+' returned', null, null);
      await saveData();
      uiAlert('Return recorded and stock updated.');
      if(afterFn) afterFn(); else render();
    }
  });
}

// ---------- AUDIT TRAIL ----------
// Logs who changed what, when, and the before/after snapshot — mainly for
// sensitive mutations (purchase edit/delete) so staff changes are traceable.
function logAudit(action, entityType, entityId, summary, before, after){
  if(!DATA.auditLog) DATA.auditLog=[];
  DATA.auditLog.unshift({
    id: uid('aud'),
    ts: new Date().toISOString(),
    staff: lastAuditStaff || 'Unknown',
    action, entityType, entityId, summary,
    before: before!==undefined ? JSON.parse(JSON.stringify(before)) : null,
    after: after!==undefined ? JSON.parse(JSON.stringify(after)) : null
  });
  // Cap log size so it doesn't grow storage unbounded
  if(DATA.auditLog.length>500) DATA.auditLog.length = 500;
}

async function startEditPurchase(purchaseId){

  editAddTab = 'mobile';

    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);

    }
    return {...it, locked};
  });

}

function cancelEditPurchase(){ editingPurchaseId=null; editCart=[]; render(); }

function applyPurchaseEdit(purchaseId, newCart, date, supplierInvoiceNo){
  const p = DATA.purchases.find(x=>x.id===purchaseId);
  if(!p){ uiAlert('Purchase not found'); return false; }
  if(!newCart.length){ uiAlert('A purchase must have at least one item. Use Delete instead if you want to remove it entirely.'); return false; }
  const auditBefore = {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount};

  const lockedItems = newCart.filter(it=>it.locked);
  const editableItems = newCart.filter(it=>!it.locked);

  // IMEIs from this purchase that are still in stock (not sold) and can be freed up for reuse
  const releasableImeis = new Set(
    p.items.filter(it=>it.kind==='mobile-imei').map(it=>it.imei).filter(imei=>{
      const m = DATA.mobiles.find(x=>x.imei===imei && x.purchaseId===purchaseId);
      return m && m.status!=='sold';
    })
  );
  // Validate: no IMEI clashes with stock elsewhere
  for(const it of editableItems){
    if(it.kind==='mobile-imei'){
      const clash = DATA.mobiles.find(m=>m.imei===it.imei && !(m.purchaseId===purchaseId && releasableImeis.has(it.imei)));
      if(clash){ uiAlert('IMEI '+it.imei+' already exists in stock elsewhere. Please correct it before saving.'); return false; }
    }
  }
  // Validate: no duplicate IMEI within the new cart itself
  const seenImeis = new Set();
  for(const it of editableItems){
    if(it.kind==='mobile-imei'){
      if(seenImeis.has(it.imei)){ uiAlert('Duplicate IMEI '+it.imei+' within this purchase. Please fix.'); return false; }
      seenImeis.add(it.imei);
    }
  }
  // Validate: reversing old accessory/no-IMEI quantities won't push stock below zero (i.e. some already sold)
  const accessoryOldQty = {};
  p.items.forEach(it=>{
    if(it.kind!=='mobile-imei'){
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const key = it.name.toLowerCase()+'|'+cat;
      accessoryOldQty[key] = (accessoryOldQty[key]||0) + it.qty;
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    const currentQty = existing? Number(existing.qty):0;
    if(currentQty < accessoryOldQty[key]){
      uiAlert('Cannot save: some units of an accessory/no-IMEI item in this purchase have already been sold, so this quantity cannot be safely edited.');
      return false;
    }
  }

  // All checks passed — perform the reversal + reapply
  p.items.forEach(it=>{
    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(m && m.status!=='sold'){
        const idx = DATA.mobiles.indexOf(m);
        if(idx>-1) DATA.mobiles.splice(idx,1);
      }
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    if(existing) existing.qty = Number(existing.qty) - accessoryOldQty[key];
  }

  lockedItems.forEach(it=>{
    const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
    if(m){ m.purchasePrice=it.purchasePrice; if(it.brand) m.brand=it.brand; if(it.model!==undefined) m.model=it.model; if(it.hsnCode) m.hsnCode=it.hsnCode; if(it.gstRate!=null) m.gstRate=it.gstRate; }
  });

  editableItems.forEach(it=>{
    if(it.kind==='mobile-imei'){
      DATA.mobiles.push({imei:it.imei, brand:it.brand, model:it.model, purchasePrice:it.purchasePrice, salePrice:it.salePrice, purchaseDate:date, status:'instock', supplierId:p.supplierId, purchaseId:p.id, hsnCode:it.hsnCode||'', gstRate:it.gstRate});
    } else {
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const existing = DATA.accessories.find(a=>a.name.toLowerCase()===it.name.toLowerCase() && (a.category||'')===cat);
      if(existing){ existing.qty = Number(existing.qty)+it.qty; if(it.salePrice) existing.salePrice=it.salePrice; if(it.hsnCode) existing.hsnCode=it.hsnCode; if(it.gstRate!=null) existing.gstRate=it.gstRate; }
      else DATA.accessories.push({id:uid('acc'), name:it.name, category:cat, qty:it.qty, purchasePrice:it.purchasePrice, salePrice:it.salePrice||0, hsnCode:it.hsnCode||'', gstRate:it.gstRate});
    }
  });

  const newTotal = newCart.reduce((s,i)=>s+i.purchasePrice*i.qty,0);
  p.date = date;
  p.supplierInvoiceNo = supplierInvoiceNo;
  p.items = newCart.map(({locked, ...rest})=>rest);
  p.totalAmount = newTotal;
  p.editedAt = new Date().toISOString();
  logAudit('edit', 'purchase', p.id,
    purNoLabel(p)+': amount '+fmt(auditBefore.totalAmount)+' → '+fmt(newTotal)+', items '+auditBefore.items.length+' → '+p.items.length,
    auditBefore,
    {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount});
  return true;
}

function deletePurchaseWithReversal(purchaseId){
  const p = DATA.purchases.find(x=>x.id===purchaseId);
  if(!p) return false;
  for(const it of p.items){
    if(it.kind==='mobile-imei'){
      const m = DATA.mobiles.find(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(m && m.status==='sold'){ uiAlert('Cannot delete: mobile '+it.imei+' from this purchase has already been sold. Correct the price via Edit instead.'); return false; }
    }
  }
  const accessoryOldQty = {};
  p.items.forEach(it=>{
    if(it.kind!=='mobile-imei'){
      const cat = it.kind==='mobile-noimei' ? 'Mobile (No IMEI)' : (it.category||'');
      const key = it.name.toLowerCase()+'|'+cat;
      accessoryOldQty[key] = (accessoryOldQty[key]||0) + it.qty;
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    const currentQty = existing? Number(existing.qty):0;
    if(currentQty < accessoryOldQty[key]){ uiAlert('Cannot delete: some units from this purchase have already been sold.'); return false; }
  }
  p.items.forEach(it=>{
    if(it.kind==='mobile-imei'){
      const idx = DATA.mobiles.findIndex(x=>x.imei===it.imei && x.purchaseId===purchaseId);
      if(idx>-1) DATA.mobiles.splice(idx,1);
    }
  });
  for(const key in accessoryOldQty){
    const [name,cat] = key.split('|');
    const existing = DATA.accessories.find(a=>a.name.toLowerCase()===name && (a.category||'')===cat);
    if(existing) existing.qty = Number(existing.qty) - accessoryOldQty[key];
  }
  const idx = DATA.purchases.indexOf(p);
  if(idx>-1) DATA.purchases.splice(idx,1);
  logAudit('delete', 'purchase', p.id,
    purNoLabel(p)+' deleted (amount '+fmt(p.totalAmount)+', '+p.items.length+' items)',
    {date:p.date, supplierInvoiceNo:p.supplierInvoiceNo, items:p.items, totalAmount:p.totalAmount},
    null);
  return true;
}

function attachPurchaseRowHandlers(container){
  container.querySelectorAll('[data-editpurchase]').forEach(b=>b.onclick=async ()=>startEditPurchase(b.dataset.editpurchase));
  container.querySelectorAll('[data-deletepurchase]').forEach(b=>b.onclick=async ()=>{
    if(!(await askEditPin('delete this purchase'))) return;
    if(!(await uiConfirm('Delete this entire purchase permanently? This will remove it from stock and cannot be undone.'))) return;
    const ok = deletePurchaseWithReversal(b.dataset.deletepurchase);
    if(ok){ await saveData(); uiAlert('Purchase deleted.'); render(); }
  });
}

  resetCloudSyncState();

// Simple locks so a fast second save can't start a new sync run for a table while the

  try{
    localStorage.setItem(currentStorageKey(), JSON.stringify(DATA));

    // and invoice/purchase numbering now sync to Firestore too — see SYNCED_COLLECTIONS
    // and syncSettingsToCloud() above.
    if(!_applyingRemoteChange){
      SYNCED_COLLECTIONS.forEach(name=>{ syncCollectionToCloud(name); });
      syncSettingsToCloud();
    }
    return true;
  }catch(e){
    uiAlert('Problem saving data in this browser. Storage might be full or blocked (private/incognito mode). Please take a backup regularly using the Backup button in Settings.');
    return false;
  }
}

      if(!DATA.purchaseCounter){
        const sorted=[...DATA.purchases].sort((a,b)=>a.id.localeCompare(b.id));
        sorted.forEach((p,i)=>{ if(!p.no) p.no=i+1; });
        DATA.purchaseCounter = sorted.length;
      }
      if(!DATA.invoiceCounter){
        const sortedInv=[...DATA.invoices].sort((a,b)=>a.id.localeCompare(b.id));
        sortedInv.forEach((iv,i)=>{ if(!iv.no) iv.no=i+1; });
        DATA.invoiceCounter = sortedInv.length;
      }
      await saveData();
      render();
      uiAlert('Backup restored successfully.');
    }catch(err){ uiAlert('This does not look like a valid backup file.'); }
  };
  reader.readAsText(file);
}

async function afterLoginRouting(){
  const authError = document.getElementById('authError');
  try{
    const userDoc = await fbDb.collection('users').doc(currentUser.uid).get();
    if(!userDoc.exists){
      if(authError){ authError.textContent='Ye account set up nahi hai. Owner (Rahul) se contact karein.'; authError.style.display='block'; }
      await fbAuth.signOut();
      return;
    }
    const u = userDoc.data();
    currentUserRole = u.role;
    currentUserName = u.name || '';
    if(u.role==='owner'){
      await loadStoresFromCloud();
      authScreenMode = 'store-picker';
      renderAuthScreen();
    } else if(u.role==='manager'){
      const storeDoc = await fbDb.collection('stores').doc(u.storeId).get();
      if(!storeDoc.exists){
        if(authError){ authError.textContent='Aapke store ka record nahi mila. Owner se contact karein.'; authError.style.display='block'; }
        await fbAuth.signOut();
        return;
      }
      STORES = [{id: storeDoc.id, ...storeDoc.data()}];
      currentStoreId = storeDoc.id;
      currentView = 'dashboard';
      hideAuthScreen();
      await loadData();
    } else {
      if(authError){ authError.textContent='Account role pehchana nahi gaya. Owner se contact karein.'; authError.style.display='block'; }
      await fbAuth.signOut();
    }
  }catch(e){
    console.error('Login routing failed:', e);
    if(authError){ authError.textContent='Kuch galat ho gaya. Internet check karein aur dobara try karein.'; authError.style.display='block'; }
  }
}
function attachAuthHandlers(){
  // ---- Login form ----
  const passwordInput=document.getElementById('authPassword');
  const toggleBtn=document.getElementById('authTogglePwBtn');
  if(toggleBtn && passwordInput) toggleBtn.onclick=()=>{
    const showing = passwordInput.type==='text';
    passwordInput.type = showing ? 'password' : 'text';
    toggleBtn.textContent = showing ? '👁' : '🙈';
  };
  const loginBtn=document.getElementById('authLoginBtn');
  let loginInProgress=false;
  const emailInput=document.getElementById('authEmail');
  const doLogin=async ()=>{
    if(loginInProgress) return;
    loginInProgress=true;
    if(loginBtn) loginBtn.disabled=true;
    const err=document.getElementById('authError'); if(err) err.style.display='none';
    try{
      const em=(emailInput && emailInput.value||'').trim();
      const p=(passwordInput && passwordInput.value||'');
      if(!em || !p){ if(err){ err.textContent='Email aur password dono bharein.'; err.style.display='block'; } return; }
      const cred = await fbAuth.signInWithEmailAndPassword(em, p);
      currentUser = cred.user;
      await afterLoginRouting();
    }catch(e){
      const err2=document.getElementById('authError');
      if(err2){ err2.textContent='Galat email ya password.'; err2.style.display='block'; }
    } finally {
      loginInProgress=false;
      if(loginBtn) loginBtn.disabled=false;
    }
  };
  if(loginBtn) loginBtn.onclick=doLogin;
  [emailInput, passwordInput].forEach(inp=>{
    if(inp) inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
  });
  if(emailInput) emailInput.focus();
  const ownerSetupLink=document.getElementById('ownerSetupLinkBtn');
  if(ownerSetupLink) ownerSetupLink.onclick=(e)=>{ e.preventDefault(); authScreenMode='owner-setup'; renderAuthScreen(); };
  const ownerSetupBackBtn=document.getElementById('ownerSetupBackBtn');
  if(ownerSetupBackBtn) ownerSetupBackBtn.onclick=()=>{ authScreenMode='login'; renderAuthScreen(); };
  const ownerSetupBtn=document.getElementById('ownerSetupBtn');
  if(ownerSetupBtn) ownerSetupBtn.onclick=async ()=>{
    const name=(document.getElementById('ownerName').value||'').trim();
    const email=(document.getElementById('ownerEmail').value||'').trim();
    const pass=(document.getElementById('ownerPass').value||'');
    const err=document.getElementById('ownerSetupError'); err.style.display='none';
    if(!name || !email || !pass){ err.textContent='Sab fields bharna zaroori hai.'; err.style.display='block'; return; }
    ownerSetupBtn.disabled = true;
    try{
      const metaRef = fbDb.collection('meta').doc('ownerExists');
      const metaDoc = await metaRef.get();
      if(metaDoc.exists){
        err.textContent='Owner account pehle se ban chuka hai. Login karein.'; err.style.display='block';
        ownerSetupBtn.disabled=false; return;
      }
      const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
      await fbDb.collection('users').doc(cred.user.uid).set({role:'owner', name, email, createdAt: today()});
      await metaRef.set({ownerUid: cred.user.uid, createdAt: today()});
      currentUser = cred.user;
      await afterLoginRouting();
    }catch(e){
      err.textContent = 'Account nahi ban paya: ' + (e && e.message ? e.message : 'unknown error');
      err.style.display='block';
    } finally {
      ownerSetupBtn.disabled = false;
    }
  };
  // ---- Owner store-picker screen ----
  document.querySelectorAll('[data-selectstore]').forEach(b=>b.onclick=async ()=>{
    currentStoreId = b.dataset.selectstore;
    currentView = 'dashboard';
    hideAuthScreen();
    await loadData();
  });
  const showNewBtn=document.getElementById('showNewStoreFormBtn');
  if(showNewBtn) showNewBtn.onclick=()=>{
    const box=document.getElementById('newStoreFormBox');
    if(box){ box.style.display='block'; box.innerHTML=newStoreFormHTML(); wireNewStoreForm(); }
  };
  const ownerLogoutLink=document.getElementById('ownerLogoutLinkBtn');
  if(ownerLogoutLink) ownerLogoutLink.onclick=async (e)=>{ e.preventDefault(); await fbAuth.signOut(); logoutStore(); };
}
function wireNewStoreForm(){
  const btn=document.getElementById('createStoreBtn');
  let submitting=false; // guards against a fast double-click firing this handler twice
  if(btn) btn.onclick=async ()=>{
    if(submitting) return;
    submitting=true;
    btn.disabled = true; // disabled immediately, before any checks — closes the double-click gap
    const name=(document.getElementById('newStoreName').value||'').trim();
    const mgrName=(document.getElementById('newMgrName').value||'').trim();
    const mgrEmail=(document.getElementById('newMgrEmail').value||'').trim();
    const mgrPass=(document.getElementById('newMgrPass').value||'');
    const err=document.getElementById('newStoreError');
    err.style.display='none';
    if(!name || !mgrName || !mgrEmail || !mgrPass){ err.textContent='Sab fields bharna zaroori hai.'; err.style.display='block'; submitting=false; btn.disabled=false; return; }
    if(mgrPass.length < 6){ err.textContent='Manager password kam se kam 6 characters ka hona chahiye.'; err.style.display='block'; submitting=false; btn.disabled=false; return; }
    if(STORES.find(s=>(s.name||'').toLowerCase()===name.toLowerCase())){ err.textContent='Is naam ka store pehle se hai.'; err.style.display='block'; submitting=false; btn.disabled=false; return; }
    try{
      // 1) Create the store record.
      const storeRef = await fbDb.collection('stores').add({name, createdAt: today(), ownerUid: currentUser.uid});
      // 2) Create the manager's login on the SEPARATE admin app instance, so the Owner's
      //    own session (on the main app instance) is never signed out in the process.
      const mgrCred = await fbAdminApp.auth().createUserWithEmailAndPassword(mgrEmail, mgrPass);
      await fbDb.collection('users').doc(mgrCred.user.uid).set({role:'manager', storeId: storeRef.id, name: mgrName, email: mgrEmail, createdAt: today()});
      await fbAdminApp.auth().signOut();
      STORES.push({id: storeRef.id, name, createdAt: today()});
      const box=document.getElementById('newStoreFormBox'); if(box) box.style.display='none';
      renderAuthScreen();
      uiAlert('Store "'+name+'" aur manager account ban gaya.\nManager login: '+mgrEmail);
    }catch(e){
      err.textContent = 'Nahi ban paya: ' + (e && e.message ? e.message : 'unknown error');
      err.style.display='block';
    } finally {
      submitting=false;
      btn.disabled = false;
    }
  };
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const inStock = DATA.mobiles.filter(m=>m.status==='instock').length;
  const soldTotal = DATA.mobiles.filter(m=>m.status==='sold').length;
  const accQty = DATA.accessories.reduce((s,a)=>s+Number(a.qty||0),0);
  const lowAcc = DATA.accessories.filter(a=>Number(a.qty)<=2);
  const todays = DATA.invoices.filter(i=>i.date===today());
  const todaysTotal = todays.reduce((s,i)=>s+invoiceNetTotal(i),0);
  const monthStr = today().slice(0,7);
  const monthInvoices = DATA.invoices.filter(i=>(i.date||'').slice(0,7)===monthStr);
  const monthTotal = monthInvoices.reduce((s,i)=>s+invoiceNetTotal(i),0);
  const recent = [...DATA.invoices].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,6);
  const totalReceivable = DATA.customers.reduce((sum,c)=>sum+Math.max(0,customerBalance(c)),0);
  const totalPayable = DATA.suppliers.reduce((sum,s)=>sum+Math.max(0,supplierBalance(s)),0);
  // Advance paid to a supplier = we paid more than we've purchased from them so far
  // (an amount the supplier effectively owes us back, in cash or in future goods).
  const totalAdvanceToSuppliers = DATA.suppliers.reduce((sum,s)=>sum+Math.max(0,-supplierBalance(s)),0);
  // Advance received from a customer = they paid more than they've been billed so far
  // (an amount we effectively owe them back, in cash or in future goods).
  const totalAdvanceFromCustomers = DATA.customers.reduce((sum,c)=>sum+Math.max(0,-customerBalance(c)),0);
  const mobileStockValue = DATA.mobiles.filter(m=>m.status==='instock').reduce((s,m)=>s+Number(m.purchasePrice||0),0);
  const accStockValue = DATA.accessories.reduce((s,a)=>s+Number(a.qty||0)*Number(a.purchasePrice||0),0);
  const totalStockValue = mobileStockValue + accStockValue;
  const totalProfit = DATA.invoices.reduce((s,inv)=>s+invoiceProfit(inv),0);
  const monthProfit = monthInvoices.reduce((s,inv)=>s+invoiceProfit(inv),0);
  const totalExpenses = (DATA.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
  const monthExpenses = (DATA.expenses||[]).filter(e=>(e.date||'').slice(0,7)===monthStr).reduce((s,e)=>s+Number(e.amount||0),0);
  const totalNetProfit = totalProfit - totalExpenses;
  const monthNetProfit = monthProfit - monthExpenses;
  const trend = last6MonthsSales();
  const overdueEmiList = [];
  DATA.emiPlans.forEach(p=>p.installments.forEach(i=>{ if(emiInstStatus(i)==='overdue') overdueEmiList.push({p,i}); }));
  const overdueEmiAmount = overdueEmiList.reduce((s,x)=>s+Number(x.i.amount),0);
  const emiOutstandingTotal = DATA.emiPlans.reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const emiSelfOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')==='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);

  const lastBackup = DATA.settings && DATA.settings.lastBackupDate;
  let backupDaysAgo = null;
  if(lastBackup){
    const d1 = new Date(lastBackup), d2 = new Date(today());
    backupDaysAgo = Math.round((d2-d1)/(1000*60*60*24));
  }
  const showBackupBanner = !backupBannerDismissed && (!lastBackup || backupDaysAgo>=7);
  const backupBannerText = !lastBackup ? 'kabhi nahi' : (backupDaysAgo<=0 ? 'aaj' : backupDaysAgo+' din pehle');
  // Severity escalates the longer backup is overdue, so the risk is visually obvious at a glance
  const backupSeverity = (!lastBackup || backupDaysAgo>=15) ? 'high' : 'medium';
  const backupBannerStyle = backupSeverity==='high'
    ? 'background:#FBE9E9;border-left:4px solid #C23A3A;color:#7a1f1f'
    : 'background:#fff3cd;border-left:4px solid #e0a800;color:#5c4400';
  const backupBannerIcon = backupSeverity==='high' ? '🔴' : '⚠';

  return `
    <h1>Dashboard</h1>
    <div class="sub">iHILLS — Today: ${today()}</div>
    ${showBackupBanner ? `
    <div class="notice" id="backupWarnBanner" style="${backupBannerStyle};display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span>${backupBannerIcon} Aapne pichhli baar backup <b>${backupBannerText}</b> liya${backupSeverity==='high' ? ' — data loss ka risk badh gaya hai' : ''}. Abhi le lo</span>
      <span style="display:flex;gap:8px">
        <button class="btn sm" id="bannerBackupBtn">⬇ Backup Le Lo</button>
        <button class="btn outline sm" id="bannerDismissBtn">✕</button>
      </span>
    </div>` : ''}
    <div class="notice">📍 Data is currently stored locally in THIS BROWSER only (localStorage) — it will NOT sync across devices or browsers, and will be lost if you clear browser data/history. Backup, GST settings, PIN aur Audit Log ab ⚙ Settings page mein mil jaayenge.</div>
    <div class="grid4">
      <div class="stat clickable" data-navstat="stock-mobile" title="Go to Stock → Mobiles"><div class="n">${inStock}</div><div class="l">Mobiles in stock</div></div>
      <div class="stat clickable" data-navstat="stock-mobile" title="Go to Stock → Mobiles"><div class="n">${soldTotal}</div><div class="l">Total mobiles sold</div></div>
      <div class="stat clickable" data-navstat="stock-accessory" title="Go to Stock → Accessories"><div class="n">${accQty}</div><div class="l">Accessories (total qty)</div></div>
      <div class="stat clickable" data-navstat="today-sales" title="Jump to today's sales below"><div class="n">${fmt(todaysTotal)}</div><div class="l">Today's sales (${todays.length} bills)</div></div>
    </div>
    <div class="grid4">
      <div class="stat clickable wide" data-navstat="stock-mobile" title="Go to Stock"><div class="n">${fmt(totalStockValue)}</div><div class="l">Total stock value (at purchase cost)</div></div>
      <div class="stat wide"><div class="n">${fmt(mobileStockValue)}</div><div class="l">— Mobiles stock value</div></div>
      <div class="stat wide"><div class="n">${fmt(accStockValue)}</div><div class="l">— Accessories stock value</div></div>
      <div class="stat wide"><div class="n">${fmt(monthTotal)}</div><div class="l">This month's sales (${monthInvoices.length} bills)</div></div>
    </div>
    ${currentUserRole==='owner' ? `
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat wide"><div class="n" style="color:var(--green)">${fmt(totalProfit)}</div><div class="l">Total profit — all time (sale price − purchase price)</div></div>
      <div class="stat wide"><div class="n" style="color:var(--green)">${fmt(monthProfit)}</div><div class="l">This month's profit</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable wide" data-navstat="expenses" title="Go to Expenses"><div class="n" style="color:var(--red)">${fmt(totalExpenses)}</div><div class="l">Total expenses — all time (rent/salary/bijli etc.)</div></div>
      <div class="stat wide" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)"><b>${fmt(totalNetProfit)}</b></div><div class="l"><b>Net Profit</b> (profit − expenses) — all time</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable wide" data-navstat="expenses" title="Go to Expenses"><div class="n" style="color:var(--red)">${fmt(monthExpenses)}</div><div class="l">This month's expenses</div></div>
      <div class="stat wide" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)"><b>${fmt(monthNetProfit)}</b></div><div class="l"><b>Net Profit</b> — this month</div></div>
    </div>
    ` : ''}
    <div class="card">
      <b>📊 Sales trend — last 6 months</b>
      ${renderSalesTrendSVG(trend)}
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="receivable" title="Go to Customers"><div class="n">${fmt(totalReceivable)}</div><div class="l">Total receivable (customer dues — includes Self-Finance EMI still pending)</div></div>
      <div class="stat clickable" data-navstat="payable" title="Go to Purchase → Suppliers/Ledger"><div class="n">${fmt(totalPayable)}</div><div class="l">Total payable (supplier dues)</div></div>
    </div>
    ${(totalAdvanceToSuppliers>0 || totalAdvanceFromCustomers>0) ? `
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="payable" title="Go to Purchase → Suppliers/Ledger"><div class="n" style="color:var(--green)">${fmt(totalAdvanceToSuppliers)}</div><div class="l">Advance paid to suppliers (they owe us back)</div></div>
      <div class="stat clickable" data-navstat="receivable" title="Go to Customers"><div class="n" style="color:var(--amber)">${fmt(totalAdvanceFromCustomers)}</div><div class="l">Advance received from customers (we owe them back)</div></div>
    </div>` : ''}
    ${DATA.emiPlans.length? `<div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer"><div class="n">${fmt(emiOutstandingTotal)}</div><div class="l">EMI outstanding (all financers)</div></div>
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer"><div class="n" style="color:var(--red)">${fmt(overdueEmiAmount)}</div><div class="l">Overdue EMI (${overdueEmiList.length} installments)</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:1fr">
      <div class="stat clickable" data-navstat="emi" title="Go to EMI / Financer" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)">${fmt(emiSelfOutstanding)}</div><div class="l"><b>🏠 Self-Finance receivable</b> — yahi paisa asal mein hamare business ka hai, isi ko sabse zyada follow-up karna hai</div></div>
    </div>` : ''}
    ${lowAcc.length? `<div class="card clickable" data-navstat="stock-accessory" title="Go to Stock → Accessories"><b>⚠ Low stock accessories (2 or fewer)</b><table style="margin-top:10px"><tr><th>Name</th><th>Remaining qty</th></tr>${lowAcc.map(a=>`<tr><td>${esc(a.name)}</td><td><span class="tag low">${a.qty}</span></td></tr>`).join('')}</table></div>` : ''}
    <div class="card" id="recentSalesBox">
      <b>Recent Sales</b>
      ${recent.length? `<table style="margin-top:10px"><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th></tr>${recent.map(i=>{
        const cust = DATA.customers.find(c=>c.id===i.customerId);
        const itemsHTML = i.items.map((it,idx)=>{
          const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
          const fullyReturned = returnedQty >= Number(it.qty||1);
          if(fullyReturned) return `<span class="tag sold" style="margin-right:4px">Returned</span>`;
          return `<button class="btn outline sm" data-returnitem="${i.id}|${idx}" style="margin-right:4px;padding:2px 8px;font-size:11px" title="${esc(it.name)}">↩</button>`;
        }).join('');
        return `<tr><td>${i.date}</td><td>${esc(cust?cust.name:'—')}</td><td>${i.items.length} items ${itemsHTML}</td><td>${fmt(invoiceNetTotal(i))}</td></tr>`;
      }).join('')}</table>` : `<div class="empty">No sales recorded yet</div>`}
    </div>
  `;
}

function renderNewSale(){
  const cust = DATA.customers.find(c=>c.id===saleCustomerId);
  const subtotal = saleCart.reduce((s,i)=>s+i.price*i.qty,0);
  const discount = Number(saleDiscount)||0;

    return s + Number(p.amount||0);
  },0);
  const selfFinanceAmt = salePayments.reduce((s,p)=>(p.mode==='Finance' && p.financeType==='self') ? s+Number(p.amount||0) : s, 0);

  const q = mobileStockSearch.trim().toLowerCase();

  if(mobileSourceFilter==='purchased') items = items.filter(m=>m.source!=='exchange');
  if(mobileSourceFilter==='exchange') items = items.filter(m=>m.source==='exchange');
  if(q){
    items = items.filter(m=>{
      const cust = m.customerId ? DATA.customers.find(c=>c.id===m.customerId) : null;
      return m.imei.toLowerCase().includes(q) || m.brand.toLowerCase().includes(q) || (m.model||'').toLowerCase().includes(q)
        || (cust && (cust.name.toLowerCase().includes(q) || (cust.phone||'').includes(q)));
    });
  }
  if(mobileStockView==='sold'){
    if(mobileStockFrom) items = items.filter(m=>(m.soldDate||'') >= mobileStockFrom);
    if(mobileStockTo) items = items.filter(m=>(m.soldDate||'') <= mobileStockTo);
    items.sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));
  } else {
    items.sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate));
  }
  const instockCount = DATA.mobiles.filter(m=>m.status==='instock').length;
  const soldCount = DATA.mobiles.filter(m=>m.status==='sold').length;
  const instockValue = DATA.mobiles.filter(m=>m.status==='instock').reduce((s,m)=>s+Number(m.purchasePrice||0),0);
  return `
    ${suggestDatalistsHTML()}

      <b>Add new mobile to stock</b>
      <div class="sub">Type a brand/model once — next time it will auto-suggest as you type.</div>

        <div class="field"><label>IMEI number *</label><input id="mImei"></div>
        <div class="field"><label>Brand/Company *</label><input id="mBrand" list="brandList" placeholder="e.g. Samsung"></div>

        <div class="field"><label>HSN/SAC Code</label><input id="mHsn" placeholder="e.g. 8517" value="8517"></div>
        <div class="field"><label>GST %</label><input id="mGst" type="number" step="0.1" value="${DATA.settings.gstRate||18}"></div>
      </div>
      <button class="btn" id="addMobileBtn">Add to stock</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="tabs" style="margin-bottom:0">
          <button class="tabbtn ${mobileStockView==='instock'?'active':''}" data-mobilestockview="instock">📦 Current stock (${instockCount})</button>
          <button class="tabbtn ${mobileStockView==='sold'?'active':''}" data-mobilestockview="sold">✅ Sold history (${soldCount})</button>
          <button class="tabbtn ${mobileStockView==='brandSummary'?'active':''}" data-mobilestockview="brandSummary">📊 Brand-wise Stock Summary</button>
        </div>
        ${mobileStockView==='instock'? `<div style="font-size:13px;color:var(--muted)">Current stock value: <b style="color:var(--navy)">${fmt(instockValue)}</b></div>` : ''}
      </div>
      ${mobileStockView==='brandSummary' ? renderBrandModelDrilldown() : `

        <button class="tabbtn ${mobileSourceFilter==='all'?'active':''}" data-mobilesourcefilter="all">All</button>
        <button class="tabbtn ${mobileSourceFilter==='purchased'?'active':''}" data-mobilesourcefilter="purchased">🧾 Purchased</button>

      <div class="row" style="margin-top:12px;margin-bottom:0">

        ${mobileStockView==='sold'? `
        <div class="field" style="max-width:160px"><label>Sold from</label><input id="mobileStockFrom" type="date" value="${esc(mobileStockFrom)}"></div>
        <div class="field" style="max-width:160px"><label>Sold to</label><input id="mobileStockTo" type="date" value="${esc(mobileStockTo)}"></div>

      ${items.map(m=>{

      }).join('')}
      </table>` : `<div class="empty">${q||mobileStockFrom||mobileStockTo? 'No matches found':(mobileStockView==='sold'?'No mobiles sold yet':'No mobiles in stock')}</div>`}
      `}
    </div>
  `;
}

function renderAccessoryFolders(items){
  const groups = {};
  items.forEach(a=>{
    const cat = a.category && a.category.trim() ? a.category.trim() : 'Uncategorized';
    if(!groups[cat]) groups[cat]=[];
    groups[cat].push(a);
  });
  const catNames = Object.keys(groups).sort();
  return catNames.map(cat=>{
    const catItems = groups[cat];
    const totalQty = catItems.reduce((s,a)=>s+Number(a.qty||0),0);
    return `
      <details style="margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:2px 12px" open>
        <summary style="cursor:pointer;padding:8px 0;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center">
          <span>📁 ${esc(cat)} — ${catItems.length} item(s), ${totalQty} qty total</span>
          <span><button class="btn outline sm" data-exportfolder="${esc(cat)}|csv" onclick="event.preventDefault()">Excel (whole folder)</button> <button class="btn outline sm" data-exportfolder="${esc(cat)}|pdf" style="margin-left:4px" onclick="event.preventDefault()">PDF (whole folder)</button></span>
        </summary>
        <table style="margin:6px 0 10px 0"><tr><th>Name</th><th>Quantity</th><th>Sale price</th><th>HSN / GST%</th><th></th></tr>
        ${catItems.map(a=>`<tr${a.discontinued?' style="opacity:.6"':''}><td>${esc(a.name)}${a.discontinued?' <span class="tag cancelled">Discontinued</span>':''}</td><td>${Number(a.qty)<=2?'<span class="tag low">'+a.qty+'</span>':a.qty}</td><td>${fmt(a.salePrice)}</td><td>${esc(a.hsnCode||'—')} / ${a.gstRate!=null?a.gstRate+'%':'—'} <button class="btn outline sm" data-setgstacc="${a.id}" style="margin-left:4px;padding:2px 8px;font-size:11px">✎</button></td><td><button class="btn outline sm" data-restockid="${a.id}">+ Add stock</button> <button class="btn outline sm" data-export="accessory|${a.id}|csv" style="margin-left:4px">Excel</button> <button class="btn outline sm" data-export="accessory|${a.id}|pdf" style="margin-left:4px">PDF</button> <button class="btn danger sm" data-delacc="${a.id}" style="margin-left:4px">🗑</button></td></tr>`).join('')}
        </table>
      </details>
    `;
  }).join('');
}

// ---------- EMI / FINANCER TRACKING ----------
function renderEmi(){
  const q = emiSearch.trim().toLowerCase();
  let plans = [...DATA.emiPlans];
  plans.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(q){
    plans = plans.filter(p=>{
      const cust = DATA.customers.find(c=>c.id===p.customerId);
      return (p.financerName||'').toLowerCase().includes(q) || (cust && (cust.name.toLowerCase().includes(q) || (cust.phone||'').includes(q)));
    });
  }
  const withStatus = plans.map(p=>({p, status:emiPlanStatus(p)}));
  const filtered = withStatus.filter(x=>{
    if(emiTypeFilter!=='all' && (x.p.financeType||'thirdparty')!==emiTypeFilter) return false;
    if(emiFilter==='all') return true;
    if(emiFilter==='active') return x.status!=='closed'; // active tab = everything still open, including overdue
    return x.status===emiFilter;
  });

  const allOverdueInst = [];
  DATA.emiPlans.forEach(p=>p.installments.forEach(i=>{ if(emiInstStatus(i)==='overdue') allOverdueInst.push({p,i}); }));
  const totalOutstanding = DATA.emiPlans.reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const totalOverdueAmt = allOverdueInst.reduce((s,x)=>s+Number(x.i.amount),0);
  const activeCount = withStatus.filter(x=>x.status==='active').length;
  const overdueCount = withStatus.filter(x=>x.status==='overdue').length;
  const selfOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')==='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const thirdOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')!=='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);

  return `
    <h1>EMI / Financer Tracking</h1>
    <div class="sub">Har "Finance" payment se banaya gaya EMI schedule yahan track hota hai</div>
    <div class="notice">📱 Reminder poori tarah automatic nahi hai — jab bhi aap yeh page kholenge, due/overdue EMI yahan highlight ho jayengi, aur ek click se WhatsApp reminder message ready ho jayega. Bina app khole apne aap kuch nahi jayega.</div>
    <div class="grid4">
      <div class="stat"><div class="n">${fmt(totalOutstanding)}</div><div class="l">Total outstanding (all plans)</div></div>
      <div class="stat"><div class="n" style="color:var(--red)">${fmt(totalOverdueAmt)}</div><div class="l">Overdue amount (${allOverdueInst.length} installments)</div></div>
      <div class="stat"><div class="n">${activeCount}</div><div class="l">Active plans</div></div>
      <div class="stat"><div class="n" style="color:var(--red)">${overdueCount}</div><div class="l">Plans with overdue EMI</div></div>
    </div>
    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat" style="border:2px solid var(--navy)"><div class="n" style="color:var(--navy)">${fmt(selfOutstanding)}</div><div class="l"><b>🏠 Self-Finance outstanding</b> — yeh hamari asli vasooli/jimmedaari hai</div></div>
      <div class="stat"><div class="n">${fmt(thirdOutstanding)}</div><div class="l">🏦 Third-Party Financer outstanding — sirf reference, jimmedaari financer ki hai</div></div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tabbtn ${emiFilter==='active'?'active':''}" data-emifilter="active">Active</button>
        <button class="tabbtn ${emiFilter==='overdue'?'active':''}" data-emifilter="overdue">Overdue</button>
        <button class="tabbtn ${emiFilter==='closed'?'active':''}" data-emifilter="closed">Closed</button>
        <button class="tabbtn ${emiFilter==='all'?'active':''}" data-emifilter="all">All</button>
      </div>
      <div class="tabs" style="margin-top:8px">
        <button class="tabbtn ${emiTypeFilter==='all'?'active':''}" data-emitypefilter="all">All Types</button>
        <button class="tabbtn ${emiTypeFilter==='self'?'active':''}" data-emitypefilter="self">🏠 Self-Finance</button>
        <button class="tabbtn ${emiTypeFilter==='thirdparty'?'active':''}" data-emitypefilter="thirdparty">🏦 Third-Party</button>
      </div>
      <div class="row" style="margin-top:10px;margin-bottom:0">
        <div class="field"><input id="emiSearchInput" placeholder="Search by customer name, phone or financer..." value="${esc(emiSearch)}"></div>
      </div>
    </div>
    ${filtered.length? filtered.map(({p,status})=>{
      const cust = DATA.customers.find(c=>c.id===p.customerId);
      const outstanding = emiPlanOutstanding(p);
      const isOpen = openEmiPlanId===p.id;
      return `
      <div class="card">
        <div class="clickable" data-toggleemiplan="${p.id}" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div>
            <b>${cust?esc(cust.name)+' · '+esc(cust.phone):'—'}</b> — ${(p.financeType||'thirdparty')==='self'?'🏠 Self-Finance':'🏦 '+esc(p.financerName)}
            <span class="tag ${status==='overdue'?'sold':(status==='closed'?'instock':'low')}" style="margin-left:8px">${status}</span>
          </div>
          <div style="font-size:13.5px;color:var(--muted)">Principal: ${fmt(p.principal)} · Tenure: ${p.tenureMonths} months · Outstanding: <b style="color:var(--navy)">${fmt(outstanding)}</b></div>

        ${p.extraOverpaid? `<div class="notice" style="margin-top:8px">⚠ Last installment mein ${fmt(p.extraOverpaid)} extra receive hua tha (over the amount due) — customer ko wapas karna hai ya agli kisi payment mein adjust karna hai, ye amount kisi bhi automatic ledger mein nahi ghata.</div>` : ''}
        ${isOpen? `
        <table style="margin-top:12px"><tr><th>#</th><th>Due date</th><th>Amount</th><th>Status</th><th></th></tr>
          ${p.installments.map(inst=>{
            const st = emiInstStatus(inst);
            const tagClass = st==='paid'?'instock':(st==='overdue'?'sold':(st==='cancelled'?'cancelled':'low'));
            const amountCell = st==='partial'? `${fmt(inst.amount)}<div style="font-size:11px;color:var(--muted)">Paid ${fmt(inst.paidAmount||0)} · Remaining ${fmt(inst.remainingAfterPartial||0)}</div>` : fmt(inst.amount);
            return `<tr>
              <td>${inst.no}</td><td>${inst.dueDate}</td><td>${amountCell}</td>
              <td><span class="tag ${tagClass}">${st}</span></td>
              <td>${st==='pending'||st==='overdue'||st==='partial'? `<button class="btn outline sm" data-recordpayment="${p.id}|${inst.id}">Record Payment</button> <button class="btn sm wa" style="margin-left:4px" data-emiremind="${p.id}|${inst.id}">WhatsApp Remind</button>` : (st==='paid'&&inst.paidDate?'Paid on '+inst.paidDate:(st==='cancelled'?'Cancelled (returned)':''))}</td>
            </tr>`;
          }).join('')}
        </table>` : ''}
      </div>`;
    }).join('') : `<div class="empty">No EMI plans in this filter</div>`}
  `;
}
