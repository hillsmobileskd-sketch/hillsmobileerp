function renderAccessoryFolders(items){
  const groups = {};
  items.forEach(a=>{
    const cat = a.category && a.category.trim() ? a.category.trim() : 'Uncategorized';
    if(!groups[cat]) groups[cat]=[];
    groups[cat].push(a);
  });
  const catNames = Object.keys(groups).sort();
  return catNames.map(cat=>{
    const catItems = groups[cat];
    const totalQty = catItems.reduce((s,a)=>s+Number(a.qty||0),0);
    return `
      <details style="margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:2px 12px" open>

          <span><button class="btn outline sm" data-exportfolder="${esc(cat)}|csv" onclick="event.preventDefault()">Excel (whole folder)</button> <button class="btn outline sm" data-exportfolder="${esc(cat)}|pdf" style="margin-left:4px" onclick="event.preventDefault()">PDF (whole folder)</button></span>

// ---------- EMI / FINANCER TRACKING ----------
function renderEmi(){
  const q = emiSearch.trim().toLowerCase();
  let plans = [...DATA.emiPlans];
  plans.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(q){
    plans = plans.filter(p=>{
      const cust = DATA.customers.find(c=>c.id===p.customerId);
      return (p.financerName||'').toLowerCase().includes(q) || (cust && (cust.name.toLowerCase().includes(q) || (cust.phone||'').includes(q)));
    });
  }
  const withStatus = plans.map(p=>({p, status:emiPlanStatus(p)}));
  const filtered = withStatus.filter(x=>{
    if(emiTypeFilter!=='all' && (x.p.financeType||'thirdparty')!==emiTypeFilter) return false;
    if(emiFilter==='all') return true;
    if(emiFilter==='active') return x.status!=='closed'; // active tab = everything still open, including overdue
    return x.status===emiFilter;
  });

  const allOverdueInst = [];
  DATA.emiPlans.forEach(p=>p.installments.forEach(i=>{ if(emiInstStatus(i)==='overdue') allOverdueInst.push({p,i}); }));
  const totalOutstanding = DATA.emiPlans.reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const totalOverdueAmt = allOverdueInst.reduce((s,x)=>s+Number(x.i.amount),0);
  const activeCount = withStatus.filter(x=>x.status==='active').length;
  const overdueCount = withStatus.filter(x=>x.status==='overdue').length;
  const selfOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')==='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);
  const thirdOutstanding = DATA.emiPlans.filter(p=>(p.financeType||'thirdparty')!=='self').reduce((s,p)=>s+emiPlanOutstanding(p),0);

  return `
    <h1>EMI / Financer Tracking</h1>
    <div class="sub">Har "Finance" payment se banaya gaya EMI schedule yahan track hota hai</div>
    <div class="notice">📱 Reminder poori tarah automatic nahi hai — jab bhi aap yeh page kholenge, due/overdue EMI yahan highlight ho jayengi, aur ek click se WhatsApp reminder message ready ho jayega. Bina app khole apne aap kuch nahi jayega.</div>

function supplierLedgerHTML(s){
  const pur = DATA.purchases.filter(p=>p.supplierId===s.id).sort((a,b)=>b.id.localeCompare(a.id));
  const pay = DATA.payments.filter(p=>p.supplierId===s.id).sort((a,b)=>b.id.localeCompare(a.id));
  const totalPurchased = supplierPurchased(s);
  const totalPaid = supplierPaid(s);
  const balance = supplierBalance(s);
  const linkedCust = linkedCustomerFor(s);
  const linkedBlock = linkedCust ? (()=>{
    const custBal = customerBalance(linkedCust);
    const net = custBal - balance; // +ve: shop still needs to collect this much net; -ve: shop owes this much net
    return `
      <div class="notice" style="margin-top:10px">
        🔗 <b>${esc(s.phone||'')}</b> number se ${esc(linkedCust.name)} humaare <b>customer</b> bhi hain — dono khaate combine karke:
        <div class="grid4" style="margin-top:10px;grid-template-columns:repeat(3,1fr)">
          <div class="stat"><div class="n">${fmt(custBal)}</div><div class="l">Customer side — inse lena hai</div></div>
          <div class="stat"><div class="n">${fmt(balance)}</div><div class="l">Supplier side — inko dena hai</div></div>
          <div class="stat"><div class="n" style="color:${net>0?'var(--green)':(net<0?'var(--red)':'var(--navy)')}">${fmt(Math.abs(net))}</div><div class="l">Net — ${net>0?'inse lena hai (combined)':(net<0?'inko dena hai (combined)':'dono barabar')}</div></div>
        </div>
        <button class="btn outline sm" data-gotocustledger="${linkedCust.id}" style="margin-top:8px">Customer ledger dekhein</button>
      </div>`;
  })() : '';
  return `
    <div class="card">
      <b>${esc(s.name)}'s ledger</b>
      <div class="grid4" style="margin-top:12px">
        <div class="stat"><div class="n">${fmt(totalPurchased)}</div><div class="l">Total purchased</div></div>
        <div class="stat"><div class="n">${fmt(totalPaid)}</div><div class="l">Total paid</div></div>
        <div class="stat"><div class="n">${fmt(balance)}</div><div class="l">Balance due</div></div>
      </div>
      ${linkedBlock}
      <div class="row" style="margin-top:6px">
        <div class="field"><label>Add payment amount</label><input id="ledgerPayAmount" type="number" placeholder="0"></div>
        <div class="field"><label>Payment mode</label>
          <select id="ledgerPayMode">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Cheque">Cheque</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field"><label>Note</label><input id="ledgerPayNote" placeholder="optional"></div>
        <div class="field" style="display:flex;align-items:flex-end"><button class="btn" id="addLedgerPayBtn">Record payment</button></div>
      </div>
      <b style="display:block;margin-top:16px">Purchase history</b>
      ${pur.length? `<table style="margin-top:8px"><tr><th>No.</th><th>Date</th><th>Items</th><th>Amount</th><th></th></tr>
      ${pur.map(p=>`<tr><td>${purNoLabel(p)}${p.editedAt?' <span class="tag low" title="Edited">Edited</span>':''}</td><td>${p.date}</td><td>${p.items.map(it=>esc(it.name)+(it.imei?' (IMEI: '+esc(it.imei)+')':' × '+it.qty)).join(', ')}</td><td>${fmt(p.totalAmount)}</td><td><button class="btn outline sm" data-editpurchase="${p.id}">Edit</button> <button class="btn danger sm" data-deletepurchase="${p.id}" style="margin-left:6px">Delete</button></td></tr>`).join('')}
      </table>` : '<div class="empty">No purchases recorded</div>'}
      <b style="display:block;margin-top:16px">Payment history</b>
      ${pay.length? `<table style="margin-top:8px"><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Note</th></tr>
      ${pay.map(p=>`<tr><td>${p.date}</td><td>${fmt(p.amount)}</td><td>${esc(p.mode)}</td><td>${esc(p.note||'—')}</td></tr>`).join('')}
      </table>` : '<div class="empty">No payments recorded</div>'}
    </div>
  `;
}

function showSupplierLedger(s){
  const box = document.getElementById('supLedgerBox');
  if(!box) return;
  box.innerHTML = supplierLedgerHTML(s);
  attachPurchaseRowHandlers(box);
  const payBtn = box.querySelector('#addLedgerPayBtn');
  if(payBtn) payBtn.onclick=async ()=>{
    const amount = Number(document.getElementById('ledgerPayAmount').value);
    const mode = document.getElementById('ledgerPayMode').value;
    const note = document.getElementById('ledgerPayNote').value.trim();
    if(!amount||amount<=0){ uiAlert('Enter a valid payment amount'); return; }
    DATA.payments.push({id:uid('pay'), supplierId:s.id, date:today(), amount, mode, note});
    await saveData();
    showSupplierLedger(s);
  };
}

// A customer can only be permanently deleted if they have zero trace anywhere in the
// books — any bill, EMI plan, or extra payment record must survive, so deletion is
// blocked whenever real history exists (same safety principle as purchases/accessories).
function customerHasHistory(custId){
  return DATA.invoices.some(i=>i.customerId===custId)
    || DATA.emiPlans.some(p=>p.customerId===custId)
    || (DATA.customerPayments||[]).some(p=>p.customerId===custId)
    || DATA.mobiles.some(m=>m.fromCustomerId===custId); // exchanged-in phones traced back to this customer
}

function customerLedgerHTML(c){
  const inv = DATA.invoices.filter(i=>i.customerId===c.id).sort((a,b)=>b.id.localeCompare(a.id));

  const totalBilled = customerBilled(c);
  const totalReceived = customerReceived(c);
  const balance = customerBalance(c);
  const linkedSup = linkedSupplierFor(c);
  const linkedBlock = linkedSup ? (()=>{
    const supBal = supplierBalance(linkedSup);
    const net = balance - supBal; // +ve: shop still needs to collect this much net; -ve: shop owes this much net
    return `
      <div class="notice" style="margin-top:10px">
        🔗 <b>${esc(c.phone||'')}</b> number se ${esc(linkedSup.name)} humaare <b>supplier</b> bhi hain — dono khaate combine karke:

          <div class="stat"><div class="n">${fmt(supBal)}</div><div class="l">Supplier side — inko dena hai</div></div>

        </div>

  return `

      <b>${esc(c.name)}'s ledger</b>

        <div class="stat"><div class="n">${fmt(totalBilled)}</div><div class="l">Total billed</div></div>

      ${inv.map(i=>{
        const paidAtSale = i.payments? i.payments.reduce((s2,p)=>s2+Number(p.amount||0),0) : 0;
        return `<tr><td>${i.date}</td><td>${i.items.map(it=>esc(it.name)).join(', ')}</td><td>${fmt(i.total)}</td><td>${fmt(paidAtSale)}</td><td>${(i.due||0)>0?'<span class="tag low">'+fmt(i.due)+'</span>':fmt(0)}</td><td><button class="btn outline sm" data-resendinvoice="${i.id}">${resendInvoiceOpenId===i.id?'Close':'View / Resend'}</button></td></tr>

function showCustomerLedger(c){
  const box = document.getElementById('custHistoryBox');
  if(!box) return;
  box.innerHTML = customerLedgerHTML(c);
  const payBtn = box.querySelector('#addCustLedgerPayBtn');
  if(payBtn) payBtn.onclick=async ()=>{
    const amount = Number(document.getElementById('custLedgerPayAmount').value);
    const mode = document.getElementById('custLedgerPayMode').value;
    const note = document.getElementById('custLedgerPayNote').value.trim();
    if(!amount||amount<=0){ uiAlert('Enter a valid payment amount'); return; }
    if(!DATA.customerPayments) DATA.customerPayments=[];
    DATA.customerPayments.push({id:uid('cpay'), customerId:c.id, date:today(), amount, mode, note});
    await saveData();
    showCustomerLedger(c);
  };

  // ---- View / Resend a past bill ----
  box.querySelectorAll('[data-resendinvoice]').forEach(b=>b.onclick=()=>{
    resendInvoiceOpenId = (resendInvoiceOpenId===b.dataset.resendinvoice) ? null : b.dataset.resendinvoice;
    showCustomerLedger(c);
  });

  const resendWaImageBtn = box.querySelector('[data-resendwaimage]');
  if(resendWaImageBtn) resendWaImageBtn.onclick=async ()=>{
    const inv = DATA.invoices.find(i=>i.id===resendWaImageBtn.dataset.resendwaimage);
    if(!inv) return;
    resendWaImageBtn.disabled = true; const origText = resendWaImageBtn.textContent; resendWaImageBtn.textContent = 'Preparing image...';
    try{
      // Pass this historical invoice directly — never touches the shared lastInvoiceData
      // that the New Sale screen's own "send image" button relies on.
      const resendData = {cust:c, date:inv.date, no:inv.no, items:inv.items, subtotal:inv.subtotal, discount:inv.discount, total:inv.total, payments:inv.payments||[], due:inv.due||0, interstate:inv.interstate};
      const blob = await generateInvoiceImageFile(resendData);
      if(!blob) return;
      const file = new File([blob], 'bill-'+inv.date+'.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Hills ERP Bill', text:'Your bill from Hills ERP ('+inv.date+')'});
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'bill-'+inv.date+'.png';
        link.click();
        let phone = (c.phone||'').replace(/\D/g,'');
        if(phone.length===10) phone = '91'+phone;
        uiAlert('Bill image downloaded. Opening WhatsApp — please attach the downloaded image manually (this browser cannot auto-attach files to WhatsApp).');
        window.open('https://wa.me/'+phone, '_blank');
      }
    } catch(err){
      if(err && err.name !== 'AbortError') uiAlert('Could not share image: '+err.message+'. Try "Send as text" instead.');
    } finally {
      resendWaImageBtn.disabled = false; resendWaImageBtn.textContent = origText;
    }
  };

  const resendWaTextBtn = box.querySelector('[data-resendwatext]');
  if(resendWaTextBtn) resendWaTextBtn.onclick=()=>{
    const inv = DATA.invoices.find(i=>i.id===resendWaTextBtn.dataset.resendwatext);
    if(!inv) return;
    let phone = (c.phone||'').replace(/\D/g,'');
    if(phone.length===10) phone = '91'+phone;
    const text = buildResendInvoiceText(inv, c, true);
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text), '_blank');
  };

  const resendPrintBtn = box.querySelector('[data-resendprint]');
  if(resendPrintBtn) resendPrintBtn.onclick=()=>{
    const inv = DATA.invoices.find(i=>i.id===resendPrintBtn.dataset.resendprint);
    if(!inv) return;
    printInvoiceBill({cust:c, date:inv.date, no:inv.no, items:inv.items, subtotal:inv.subtotal, discount:inv.discount, total:inv.total, payments:inv.payments||[], due:inv.due||0, interstate:inv.interstate});
  };

  const resendWaPdfBtn = box.querySelector('[data-resendwapdf]');
  if(resendWaPdfBtn) resendWaPdfBtn.onclick=()=>{
    const inv = DATA.invoices.find(i=>i.id===resendWaPdfBtn.dataset.resendwapdf);
    if(!inv) return;
    sendBillPdfWhatsApp({cust:c, date:inv.date, no:inv.no, items:inv.items, subtotal:inv.subtotal, discount:inv.discount, total:inv.total, payments:inv.payments||[], due:inv.due||0, interstate:inv.interstate}, c.phone);
  };
}

// ---- Universal search across mobiles / invoices / purchases ----
function performGlobalSearch(q, from, to){
  q = (q||'').trim().toLowerCase();
  const inDateRange = (d)=> (!from || (d||'') >= from) && (!to || (d||'') <= to);

  const mobiles = DATA.mobiles.filter(m=>{
    const cust = m.customerId ? DATA.customers.find(c=>c.id===m.customerId) : null;
    const textMatch = !q || m.imei.toLowerCase().includes(q) || m.brand.toLowerCase().includes(q) || (m.model||'').toLowerCase().includes(q)
      || (cust && (cust.name.toLowerCase().includes(q) || (cust.phone||'').includes(q)));
    const relevantDate = m.status==='sold' ? m.soldDate : m.purchaseDate;
    return textMatch && (!from && !to ? true : inDateRange(relevantDate));
  });

  const invoices = DATA.invoices.filter(i=>{
    const cust = DATA.customers.find(c=>c.id===i.customerId);
    const textMatch = !q || (cust && (cust.name.toLowerCase().includes(q) || (cust.phone||'').includes(q)))
      || i.items.some(it=>(it.name||'').toLowerCase().includes(q));
    return textMatch && inDateRange(i.date);
  });

  const purchases = DATA.purchases.filter(p=>{
    const sup = DATA.suppliers.find(s=>s.id===p.supplierId);
    const textMatch = !q || (sup && (sup.name.toLowerCase().includes(q) || (sup.phone||'').includes(q)))
      || p.items.some(it=>(it.name||'').toLowerCase().includes(q))
      || p.items.some(it=>(it.imei||'').toLowerCase().includes(q));
    return textMatch && inDateRange(p.date);
  });

  return {mobiles, invoices, purchases};
}

function renderGlobalSearchResults(q, from, to){
  const {mobiles, invoices, purchases} = performGlobalSearch(q, from, to);
  if(!mobiles.length && !invoices.length && !purchases.length){
    return `<div class="empty">No matches found. Try a different name, phone number, IMEI or model, or widen the date range.</div>`;
  }
  let html = '';
  if(mobiles.length){
    html += `<div class="sr-section-title">📱 Mobile stock matches (${mobiles.length})</div>` + mobiles.map(imeiHistoryHTML).join('');
  }
  if(invoices.length){
    html += `<div class="sr-section-title">💰 Sales / invoice matches (${invoices.length})</div>`;
    html += `<div class="card"><table><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th></tr>
      ${invoices.map(i=>{
        const cust = DATA.customers.find(c=>c.id===i.customerId);
        const itemsHTML = i.items.map((it,idx)=>{
          const returnedQty = it.type==='mobile' ? (it.returned?1:0) : Number(it.returnedQty||0);
          const fullyReturned = returnedQty >= Number(it.qty||1);
          const label = esc(it.name)+' '+(it.type==='mobile'?imeiParenLabel(it.ref):'x'+it.qty);
          if(fullyReturned) return `<div>${label} <span class="tag sold">Returned</span></div>`;
          return `<div>${label} <button class="btn outline sm" data-returnitem="${i.id}|${idx}" style="margin-left:4px;padding:2px 8px;font-size:11px">↩ Return</button></div>`;
        }).join('');
        return `<tr><td>${i.date}</td><td>${cust?esc(cust.name)+' · '+esc(cust.phone):'—'}</td><td>${itemsHTML}</td><td>${fmt(invoiceNetTotal(i))}</td></tr>`;
      }).join('')}
    </table></div>`;
  }
  if(purchases.length){
    html += `<div class="sr-section-title">🧾 Purchase matches (${purchases.length})</div>`;
    html += `<div class="card"><table><tr><th>Purchase No.</th><th>Date</th><th>Supplier</th><th>Items</th><th>Amount</th></tr>
      ${purchases.map(p=>{
        const sup = DATA.suppliers.find(s=>s.id===p.supplierId);
        return `<tr><td>${purNoLabel(p)}</td><td>${p.date}</td><td>${sup?esc(sup.name):'—'}</td><td>${p.items.map(it=>esc(it.name)+' x'+it.qty).join(', ')}</td><td>${fmt(p.totalAmount)}</td></tr>`;
      }).join('')}
    </table></div>`;
  }
  return html;
}

// ---- Report data builders ----
function reportMobileStock(fromDate, toDate){
  const headers = ['IMEI','Brand','Model','Purchase Price','Sale Price','HSN Code','GST %','Purchase Date','Supplier','Status'];
  const rows = DATA.mobiles.filter(m=>inDateRange(m.purchaseDate, fromDate, toDate)).map(m=>{
    const sup = m.supplierId ? DATA.suppliers.find(s=>s.id===m.supplierId) : null;
    return [m.noRealImei?'(no IMEI recorded)':m.imei, m.brand, m.model||'', m.purchasePrice, m.salePrice, m.hsnCode||'—', m.gstRate!=null?m.gstRate:'—', m.purchaseDate, sup?sup.name:'—', m.status];
  });
  return {headers, rows};
}
function reportAccStock(){
  // Accessory quantities are pooled across purchases (no single date per unit in stock),
  // so this report always shows current totals rather than a date range.
  const headers = ['Name','Category','Quantity','Purchase Price','Sale Price','HSN Code','GST %'];
  const rows = DATA.accessories.map(a=>[a.name, a.category||'—', a.qty, a.purchasePrice||0, a.salePrice, a.hsnCode||'—', a.gstRate!=null?a.gstRate:'—']);
  return {headers, rows};
}
function reportPurchases(fromDate, toDate){
  const headers = ['Purchase No.','Date','Supplier','Supplier Inv#','Items','Amount'];
  const rows = DATA.purchases.filter(p=>inDateRange(p.date, fromDate, toDate)).map(p=>{
    const sup = DATA.suppliers.find(s=>s.id===p.supplierId);
    return [purNoLabel(p), p.date, sup?sup.name:'—', p.supplierInvoiceNo||'—', p.items.map(it=>it.name+' x'+it.qty).join('; '), p.totalAmount];
  });
  return {headers, rows};
}
function reportSales(fromDate, toDate){
  const headers = ['Date','Customer','Phone','Items','Total','Due'];
  const rows = DATA.invoices.filter(i=>inDateRange(i.date, fromDate, toDate)).map(i=>{
    const cust = DATA.customers.find(c=>c.id===i.customerId);
    return [i.date, cust?cust.name:'—', cust?cust.phone:'—', i.items.map(it=>it.name).join('; '), invoiceNetTotal(i), i.due||0];
  });
  return {headers, rows};
}
function reportProfit(fromDate, toDate){
  const headers = ['Date','Customer','Bill Total','Profit'];
  const rows = DATA.invoices.filter(i=>inDateRange(i.date, fromDate, toDate)).map(i=>{
    const cust = DATA.customers.find(c=>c.id===i.customerId);
    return [i.date, cust?cust.name:'—', invoiceNetTotal(i), invoiceProfit(i)];
  });
  if(rows.length){
    const totalProfit = rows.reduce((s,r)=>s+r[3],0);
    rows.push(['', '', 'TOTAL PROFIT', totalProfit]);
  }
  return {headers, rows};
}
function reportReturns(fromDate, toDate){
  const headers = ['Date','Customer','Item','Type','Qty','Refund Amount'];
  const rows = (DATA.returns||[]).filter(r=>inDateRange(r.date, fromDate, toDate)).map(r=>{
    const cust = DATA.customers.find(c=>c.id===r.customerId);
    return [r.date, cust?cust.name:'—', r.itemName, r.itemType, r.qty, r.refundAmount];
  });
  return {headers, rows};
}
function reportCustLedger(fromDate, toDate){
  const filtered = (fromDate || toDate);
  const headers = filtered
    ? ['Customer','Phone','Billed (in period)','Received (in period)','Current Balance Due (all-time)']
    : ['Customer','Phone','Total Billed','Total Received','Balance Due'];
  const rows = DATA.customers.map(c=>{
    if(!filtered) return [c.name, c.phone, customerBilled(c), customerReceived(c), customerBalance(c)];
    const billedInPeriod = DATA.invoices.filter(i=>i.customerId===c.id && inDateRange(i.date, fromDate, toDate)).reduce((s,i)=>s+i.total,0);
    const receivedInPeriod = DATA.invoices.filter(i=>i.customerId===c.id && inDateRange(i.date, fromDate, toDate)).reduce((s,i)=>s+(i.payments||[]).reduce((s2,p)=>s2+Number(p.amount||0),0), 0)
      + (DATA.customerPayments||[]).filter(p=>p.customerId===c.id && inDateRange(p.date, fromDate, toDate)).reduce((s,p)=>s+Number(p.amount||0),0);
    return [c.name, c.phone, billedInPeriod, receivedInPeriod, customerBalance(c)];
  }).filter(r=>!filtered || r[2]!==0 || r[3]!==0); // when a date filter is on, hide customers with zero activity in that period
  return {headers, rows};
}
function reportEmi(fromDate, toDate){
  const headers = ['Customer','Phone','Type','Financer','Installment #','Due Date','Amount','Status'];
  const rows = [];
  DATA.emiPlans.forEach(p=>{
    const cust = DATA.customers.find(c=>c.id===p.customerId);
    const typeLabel = (p.financeType||'thirdparty')==='self' ? 'Self-Finance' : 'Third-Party';
    p.installments.filter(inst=>inDateRange(inst.dueDate, fromDate, toDate)).forEach(inst=>{
      rows.push([cust?cust.name:'—', cust?cust.phone:'—', typeLabel, p.financerName, inst.no, inst.dueDate, inst.amount, emiInstStatus(inst)]);
    });
  });
  return {headers, rows};
}
function reportSupLedger(fromDate, toDate){
  const filtered = (fromDate || toDate);
  const headers = filtered
    ? ['Supplier','Phone','Purchased (in period)','Paid (in period)','Current Balance Payable (all-time)']
    : ['Supplier','Phone','Total Purchased','Total Paid','Balance Payable'];
  const rows = DATA.suppliers.map(s=>{
    if(!filtered) return [s.name, s.phone||'—', supplierPurchased(s), supplierPaid(s), supplierBalance(s)];
    const purchasedInPeriod = DATA.purchases.filter(p=>p.supplierId===s.id && inDateRange(p.date, fromDate, toDate)).reduce((sum,p)=>sum+p.totalAmount,0);
    const paidInPeriod = DATA.payments.filter(p=>p.supplierId===s.id && inDateRange(p.date, fromDate, toDate)).reduce((sum,p)=>sum+p.amount,0);
    return [s.name, s.phone||'—', purchasedInPeriod, paidInPeriod, supplierBalance(s)];
  }).filter(r=>!filtered || r[2]!==0 || r[3]!==0);
  return {headers, rows};
}
function reportExpenses(fromDate, toDate){
  const headers = ['Date','Category','Amount','Mode','Note'];
  const rows = (DATA.expenses||[]).filter(e=>inDateRange(e.date, fromDate, toDate)).map(e=>[e.date, e.category||'—', e.amount, e.mode||'—', e.note||'—']);
  if(rows.length){
    const total = rows.reduce((s,r)=>s+Number(r[2]||0),0);
    rows.push(['', 'TOTAL EXPENSES', total, '', '']);
  }
  return {headers, rows};
}

function runReport(kind){
  const map = reportConfigMap();
  const isPDF = kind.endsWith('PDF');
  const isCSV = kind.endsWith('CSV');
  const baseKey = kind.replace('PDF','').replace('CSV','');
  const cfg = map[baseKey];
  if(!cfg) return;
  const {headers, rows} = (baseKey==='paymentModes') ? reportPaymentModesDetailed(reportFrom, reportTo) : cfg.data();
  if(!rows.length){ uiAlert('No data available yet for this report'+(cfg.dateFiltered && (reportFrom||reportTo) ? ' in the selected date range' : '')+'.'); return; }
  if(isCSV) downloadCSV(cfg.file+'-'+today()+'.csv', [headers, ...rows]);
  else if(isPDF) printReport(cfg.title, tableHTML(headers, rows));
}

// ---- Payment Mode Summary: bill-wise drilldown ----
// Single shared source of every money in/out transaction, taggeed with its payment mode.
// Both the on-screen View and the Excel/PDF export read from this exact same function,
// so they can never drift out of sync — and both respect the same date range filter.
function allPaymentTransactions(fromDate, toDate){
  const inRange = (d) => (!fromDate || (d||'') >= fromDate) && (!toDate || (d||'') <= toDate);
  const list = [];
  DATA.invoices.forEach(inv=>{
    if(!inRange(inv.date)) return;
    const cust = DATA.customers.find(c=>c.id===inv.customerId);
    (inv.payments||[]).forEach(p=>{
      // Self-Finance "payment" at sale time isn't real cash-in-hand yet (see EMI Collection
      // below, where it actually gets counted once collected) — skip it here so cash-flow
      // reports aren't overstated. Third-Party Finance IS real cash (financer pays upfront).
      if(p.mode==='Finance' && p.financeType==='self') return;
      list.push({date:inv.date, mode:p.mode||'Other', ref:invNoLabel(inv), party:cust?cust.name:'—', desc:'Sale payment'+(p.note?(' — '+p.note):''), amount:Number(p.amount||0), direction:'in'});
    });
  });
  (DATA.customerPayments||[]).forEach(p=>{
    if(!inRange(p.date)) return;
    const cust = DATA.customers.find(c=>c.id===p.customerId);
    list.push({date:p.date, mode:p.mode||'Other', ref:'Installment', party:cust?cust.name:'—', desc:p.note||'Customer installment payment', amount:Number(p.amount||0), direction:'in'});
  });
  (DATA.emiCollections||[]).forEach(e=>{
    if(!inRange(e.date)) return;
    const cust = DATA.customers.find(c=>c.id===e.customerId);
    const plan = DATA.emiPlans.find(pl=>pl.id===e.planId);
    // Third-Party EMI installments are the financer's money, not the shop's — the shop
    // already booked its cash when the financer paid at sale time (above). Counting these
    // again would double-count cash that was never actually in the shop's hand.
    if(plan && (plan.financeType||'thirdparty')!=='self') return;
    list.push({date:e.date, mode:'EMI Collection (Self-Finance)', ref:'EMI', party:cust?cust.name:'—', desc:e.note||'EMI installment collected', amount:Number(e.amount||0), direction:'in'});
  });
  (DATA.payments||[]).forEach(p=>{
    if(!inRange(p.date)) return;
    const sup = DATA.suppliers.find(s=>s.id===p.supplierId);
    list.push({date:p.date, mode:p.mode||'Other', ref:'Supplier Payment', party:sup?sup.name:'—', desc:p.note||'Payment to supplier', amount:Number(p.amount||0), direction:'out'});
  });
  (DATA.expenses||[]).forEach(e=>{
    if(!inRange(e.date)) return;
    list.push({date:e.date, mode:e.mode||'Other', ref:e.category||'Expense', party:'—', desc:e.note||e.category||'Expense', amount:Number(e.amount||0), direction:'out'});
  });
  return list.sort((a,b)=>(a.mode).localeCompare(b.mode) || (a.date||'').localeCompare(b.date||''));
}
function paymentModeTransactions(mode, fromDate, toDate){
  return allPaymentTransactions(fromDate, toDate).filter(t=>t.mode===mode);
}
function reportPaymentModes(fromDate, toDate){
  const modeMap = {};
  const bump = (mode,key,amt) => { if(!modeMap[mode]) modeMap[mode]={in:0,out:0}; modeMap[mode][key]+=Number(amt||0); };
  allPaymentTransactions(fromDate, toDate).forEach(t=>bump(t.mode, t.direction, t.amount));
  const rows = Object.keys(modeMap).sort().map(mode=>{
    const m = modeMap[mode];
    return [mode, m.in, m.out, m.in-m.out];
  });
  let totalIn=0, totalOut=0;
  rows.forEach(r=>{ totalIn+=r[1]; totalOut+=r[2]; });
  rows.push(['TOTAL', totalIn, totalOut, totalIn-totalOut]);
  return {headers:['Payment Mode','Received (In)','Paid (Out)','Net'], rows};
}
// Full transaction-wise breakdown, used for Excel/PDF export — every single bill/entry, not just totals.
function reportPaymentModesDetailed(fromDate, toDate){
  const txns = allPaymentTransactions(fromDate, toDate);
  const rows = txns.map(t=>[t.mode, t.date||'', t.ref, t.party, t.desc, t.direction==='in'?t.amount:'', t.direction==='out'?t.amount:'']);
  return {headers:['Payment Mode','Date','Ref','Party','Description','In','Out'], rows};
}

  const txns = paymentModeTransactions(mode, reportFrom, reportTo);

}

// Computes a rate-wise (slab-wise) tax break-up out of each item's own GST rate,
// out of tax-inclusive line amounts, purely for display on the bill.
// Does NOT change inv.total / due / ledger math anywhere else in the app.
// If an item has no gstRate set (older stock added before this feature), it falls
// back to the shop's default GST rate from Settings.
function invoiceGstSlabs(inv){
  if(!DATA.settings || !DATA.settings.gstEnabled) return null;
  const items = inv.items||[];
  if(!items.length) return null;
  const grossTotal = items.reduce((s,it)=>s+it.price*it.qty,0);
  const discount = Number(inv.discount)||0;
  // Discount is spread proportionally across items so each line's fair share of
  // the discount is removed before computing its tax.
  const discRatio = grossTotal>0 ? Math.max(0,(grossTotal-discount))/grossTotal : 1;
  const defaultRate = Number(DATA.settings.gstRate)||18;
  const slabs = {};
  items.forEach(it=>{
    const rate = (it.gstRate!==undefined && it.gstRate!==null) ? Number(it.gstRate) : defaultRate;
    const lineAmt = it.price*it.qty*discRatio;
    const taxable = lineAmt/(1+rate/100);
    const tax = lineAmt-taxable;
    if(!slabs[rate]) slabs[rate] = {taxable:0, tax:0};
    slabs[rate].taxable += taxable;
    slabs[rate].tax += tax;
  });
  const interstate = (inv.interstate!==undefined && inv.interstate!==null) ? !!inv.interstate : !!DATA.settings.gstInterstate;
  const rows = Object.keys(slabs).map(r=>{
    const rate = Number(r);
    const {taxable, tax} = slabs[r];
    return interstate
      ? {rate, taxable, igst:tax, cgst:0, sgst:0}
      : {rate, taxable, igst:0, cgst:tax/2, sgst:tax/2};
  }).sort((a,b)=>a.rate-b.rate);
  const totalTaxable = rows.reduce((s,r)=>s+r.taxable,0);
  const totalTax = rows.reduce((s,r)=>s+r.cgst+r.sgst+r.igst,0);
  return {rows, totalTaxable, totalTax, interstate};
}

function buildResendInvoiceText(inv, cust, isReprint){
  const gs = invoiceGstSlabs(inv);
  let text = `Hills ERP — Bill${isReprint?' (reprint)':''}\n`;
  if(inv.no) text += `Invoice No: ${invNoLabel(inv)}\n`;
  if(DATA.settings.gstin) text += `GSTIN: ${DATA.settings.gstin}\n`;
  if(DATA.settings.shopAddress) text += `${DATA.settings.shopAddress}\n`;
  text += `Date: ${inv.date}\nCustomer: ${cust.name}\n\n`;
  inv.items.forEach(it=>{
    const hsnPart = (gs && it.hsnCode) ? ` [HSN ${it.hsnCode}]` : '';
    text += `${it.name}${hsnPart} ${it.type==='mobile'?imeiParenLabel(it.ref):'x'+it.qty} — ${fmt(it.price*it.qty)}\n`;
  });
  if(inv.discount) text += `\nDiscount: -${fmt(inv.discount)}`;
  if(gs){
    text += `\n`;
    gs.rows.forEach(r=>{
      text += `\nTaxable @${r.rate}%: ${fmt(r.taxable)}`;
      if(gs.interstate) text += `\nIGST @${r.rate}%: ${fmt(r.igst)}`;
      else text += `\nCGST @${r.rate/2}%: ${fmt(r.cgst)}\nSGST @${r.rate/2}%: ${fmt(r.sgst)}`;
    });
    text += `\nTotal Tax: ${fmt(gs.totalTax)}`;
  }
  text += `\nTotal (incl. GST if applicable): ${fmt(inv.total)}\n`;
  if((inv.payments||[]).length) text += `\nPayment: ` + inv.payments.map(p=>{
    if(p.mode==='Finance') return p.mode+' '+fmt(p.amount)+' ('+(p.financeType==='self'?'Self-Finance':p.financerName)+', '+p.tenureMonths+' EMIs)';
    if(p.mode==='Exchange') return p.mode+' '+fmt(p.amount)+' ('+p.exBrand+' '+(p.exModel||'')+')';
    return p.mode+' '+fmt(p.amount);
  }).join(', ') + `\n`;
  if((inv.due||0)>0) text += `Balance due: ${fmt(inv.due)}\n`;
  text += `\nThank you! — Hills ERP`;
  return text;
}

// Opens the same print/PDF dialog as "Print", then opens a WhatsApp chat with the customer so the
// saved PDF can be attached manually. (Browsers don't allow auto-attaching files to WhatsApp Web.)
function sendBillPdfWhatsApp(inv, phone){
  printInvoiceBill(inv);

  if(ph.length===10) ph = '91'+ph;
  window.open('https://wa.me/'+ph, '_blank');
}

async function generateInvoiceImageFile(dataOverride){
  const data = dataOverride || lastInvoiceData;
  if(!data) return null;
  if(typeof html2canvas === 'undefined'){ uiAlert('Image generator failed to load (no internet access?). Try "Send as text" instead.'); return null; }
  const card = document.getElementById('invoiceImageCard');
  card.innerHTML = buildInvoiceImageHTML(data);
  const canvas = await html2canvas(card, {scale:2, backgroundColor:'#ffffff', useCORS:true, allowTaint:false});
  const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
  return blob;
}

function attachHandlers(){
  const hamburger = document.getElementById('navHamburger');
  if(hamburger && !hamburger.dataset.wired){ hamburger.dataset.wired='1'; hamburger.onclick=openMobileNav; }
  const navBackdrop = document.getElementById('navBackdrop');
  if(navBackdrop && !navBackdrop.dataset.wired){ navBackdrop.dataset.wired='1'; navBackdrop.onclick=closeMobileNav; }
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{ setView(b.dataset.view); closeMobileNav(); });
  wireReturnButtons(document, render);

  // ---- Dashboard stat cards: click to jump straight to that section ----
  document.querySelectorAll('[data-navstat]').forEach(el=>el.onclick=()=>{
    const t = el.dataset.navstat;
    if(t==='stock-mobile'){ stockTab='mobile'; setView('stock'); }
    else if(t==='stock-accessory'){ stockTab='accessory'; setView('stock'); }
    else if(t==='receivable'){ setView('customers'); }
    else if(t==='payable'){ purchaseView='suppliers'; viewingSupplierId=null; setView('purchase'); }
    else if(t==='emi'){ setView('emi'); }
    else if(t==='expenses'){ setView('expenses'); }
    else if(t==='today-sales'){
      const box=document.getElementById('recentSalesBox');
      if(box) box.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });

  // ---- Backup & Restore ----
  const downloadBackupBtn = document.getElementById('downloadBackupBtn');
  if(downloadBackupBtn) downloadBackupBtn.onclick=downloadBackup;
  const bannerBackupBtn = document.getElementById('bannerBackupBtn');
  if(bannerBackupBtn) bannerBackupBtn.onclick=downloadBackup;
  const bannerDismissBtn = document.getElementById('bannerDismissBtn');
  if(bannerDismissBtn) bannerDismissBtn.onclick=()=>{ backupBannerDismissed=true; render(); };
  const restoreBackupBtn = document.getElementById('restoreBackupBtn');
  const restoreFileInput = document.getElementById('restoreFileInput');
  if(restoreBackupBtn) restoreBackupBtn.onclick=()=>restoreFileInput.click();

  // ---- Expenses ----
  const addExpBtn = document.getElementById('addExpBtn');
  if(addExpBtn) addExpBtn.onclick=async ()=>{
    const dateEl = document.getElementById('expDate');
    const catEl = document.getElementById('expCategory');
    const amtEl = document.getElementById('expAmount');
    const modeEl = document.getElementById('expMode');
    const noteEl = document.getElementById('expNote');
    const date = (dateEl.value||today());
    const category = catEl.value.trim();
    const amount = Number(amtEl.value);
    const mode = modeEl.value;
    const note = noteEl.value.trim();
    if(!amount || amount<=0){ uiAlert('Amount daalna zaroori hai (0 se zyada).'); return; }
    if(!DATA.expenses) DATA.expenses=[];
    DATA.expenses.push({id:uid('exp'), date, category:category||'Other', amount, mode, note});
    await saveData();
    render();
  };
  document.querySelectorAll('[data-delexp]').forEach(b=>b.onclick=async ()=>{
    if(!(await uiConfirm('Is expense entry ko delete karna hai?'))) return;
    DATA.expenses = (DATA.expenses||[]).filter(e=>e.id!==b.dataset.delexp);
    await saveData();
    render();
  });
  if(restoreFileInput) restoreFileInput.onchange=(e)=>{ if(e.target.files[0]) restoreBackup(e.target.files[0]); };

  const resetAllDataBtn = document.getElementById('resetAllDataBtn');
  if(resetAllDataBtn) resetAllDataBtn.onclick=async ()=>{
    if(!(await askEditPin('reset all data'))) return;
    const typed = await uiPrompt('Ye SAB data hamesha ke liye delete kar dega (wapas nahi aayega). Confirm karne ke liye yahan "DELETE" likhein (bina quotes ke):');
    if(typed===null || typed.trim().toUpperCase() !== 'DELETE'){ uiAlert('Reset cancel ho gaya — "DELETE" match nahi hua ya aapne cancel dabaya.'); return; }
    const keepPin = DATA.settings && DATA.settings.editPin;
    const keepPinHash = DATA.settings && DATA.settings.editPinHash;
    try{ localStorage.removeItem(currentStorageKey()); }catch(e){}
    DATA = {customers:[], mobiles:[], accessories:[], invoices:[], suppliers:[], purchases:[], payments:[], customerPayments:[], returns:[], emiPlans:[], emiCollections:[], auditLog:[], expenses:[], settings:{editPin: keepPinHash ? undefined : (keepPin||'1234'), editPinHash: keepPinHash, gstEnabled:false, gstin:'', shopAddress:'', gstRate:18, gstInterstate:false}, purchaseCounter:0, invoiceCounter:0};
    await saveData();
    uiAlert('✅ Sab data reset ho gaya. App ab bilkul fresh state me hai.');
    render();
  };

  const changePinBtn = document.getElementById('changePinBtn');
  if(changePinBtn) changePinBtn.onclick=async ()=>{
    const current = await uiPrompt('Enter current PIN:');
    if(current===null) return;
    if(!(await verifyEditPin(current))){ uiAlert('Incorrect current PIN.'); return; }
    const next = await uiPrompt('Enter new PIN (4-6 digits):');
    if(!next || !next.trim()) return;
    await setEditPin(next.trim());
    logAudit('edit', 'edit-pin', 'settings', 'Edit Protection PIN badla gaya', {pinChanged:true}, {pinChanged:true});
    await saveData();
    uiAlert('PIN updated successfully.');
  };

  // ---- Store Login (username/password) change ----
  const changeStoreLoginBtn = document.getElementById('changeStoreLoginBtn');
  if(changeStoreLoginBtn) changeStoreLoginBtn.onclick=async ()=>{
    const store = STORES.find(s=>s.id===currentStoreId);
    if(!store){ uiAlert('Store not found.'); return; }
    const currentPass = await uiPrompt('Current password enter karein:');
    if(currentPass===null) return;
    if(!(await verifyStorePassword(store, currentPass))){ uiAlert('Galat current password. Kuch nahi badla.'); return; }
    const newUsernameRaw = await uiPrompt('Naya username enter karein (khaali chhodo agar same rakhna hai):', store.adminUsername);
    if(newUsernameRaw===null) return;
    const newPassword = await uiPrompt('Naya password enter karein:');
    if(newPassword===null) return;
    if(!newPassword.trim()){ uiAlert('Password khaali nahi ho sakta. Kuch nahi badla.'); return; }
    const confirmPassword = await uiPrompt('Naya password dobara enter karein (confirm):');
    if(confirmPassword===null) return;
    if(confirmPassword !== newPassword){ uiAlert('Dono password match nahi kar rahe. Kuch nahi badla.'); return; }
    const newUsername = newUsernameRaw.trim() ? newUsernameRaw.trim() : store.adminUsername;
    if(STORES.some(s=>s.id!==store.id && s.adminUsername===newUsername)){
      uiAlert('Yeh username kisi dusre store mein pehle se use ho raha hai. Alag username chunein.');
      return;
    }
    const oldUsername = store.adminUsername;
    store.adminUsername = newUsername;
    await setStorePassword(store, newPassword.trim());
    saveStoresMeta();
    logAudit('edit', 'store-login', store.id, 'Store login badla gaya (username: '+oldUsername+' -> '+store.adminUsername+')', {adminUsername:oldUsername}, {adminUsername:store.adminUsername});
    await saveData();
    uiAlert('Login details update ho gaye. Agli baar isi naye username/password se login karein.');
    render();
  };

  // ---- Store rename ----
  const renameStoreBtn = document.getElementById('renameStoreBtn');
  if(renameStoreBtn) renameStoreBtn.onclick=async ()=>{
    const store = STORES.find(s=>s.id===currentStoreId);
    if(!store){ uiAlert('Store not found.'); return; }
    const newNameRaw = await uiPrompt('Store ka naya naam enter karein:', store.name);
    if(newNameRaw===null) return;
    const newName = newNameRaw.trim();
    if(!newName){ uiAlert('Naam khaali nahi ho sakta.'); return; }
    if(STORES.some(s=>s.id!==store.id && s.name.toLowerCase()===newName.toLowerCase())){
      uiAlert('Is naam ka store pehle se hai. Alag naam chunein.');
      return;
    }
    const oldName = store.name;
    store.name = newName;
    saveStoresMeta();
    logAudit('edit', 'store-rename', store.id, 'Store naam badla gaya ('+oldName+' -> '+newName+')', {name:oldName}, {name:newName});
    await saveData();
    uiAlert('Store ka naam update ho gaya.');
    render();
  };

  // ---- Store delete ----
  const deleteStoreBtn = document.getElementById('deleteStoreBtn');
  if(deleteStoreBtn) deleteStoreBtn.onclick=async ()=>{
    const store = STORES.find(s=>s.id===currentStoreId);
    if(!store){ uiAlert('Store not found.'); return; }
    if(STORES.length<=1){
      uiAlert('Yeh akela store hai — ise delete nahi kar sakte. Kam se kam ek store hamesha rehna zaroori hai.');
      return;
    }
    const currentPass = await uiPrompt('Confirm karne ke liye is store ka current password enter karein:');
    if(currentPass===null) return;
    if(!(await verifyStorePassword(store, currentPass))){ uiAlert('Galat password. Store delete nahi hua.'); return; }
    const typedName = await uiPrompt('Yeh action PERMANENT hai — is store ka SAARA DATA (customers, mobiles, invoices, purchases, sab kuch) hamesha ke liye mit jayega.\n\nConfirm karne ke liye store ka poora naam type karein: "'+store.name+'"');
    if(typedName===null) return;
    if(typedName.trim() !== store.name){ uiAlert('Naam match nahi hua. Store delete nahi hua.'); return; }
    const deletedStoreId = store.id;
    const deletedStoreName = store.name;
    appendGlobalLog({
      id: uid('glog'),
      ts: new Date().toISOString(),
      eventType: 'store-deleted',
      storeId: deletedStoreId,
      storeName: deletedStoreName,
      deletedByUsername: store.adminUsername,
      note: 'Store aur uska saara data (customers, mobiles, invoices, purchases) permanently delete kiya gaya'
    });
    try{ localStorage.removeItem('hills_erp_shopdata_'+deletedStoreId); }catch(e){}
    const idx = STORES.findIndex(s=>s.id===deletedStoreId);
    if(idx>-1) STORES.splice(idx,1);
    saveStoresMeta();
    uiAlert('"'+deletedStoreName+'" store aur uska saara data delete ho gaya.');
    logoutStore();
  };

  // ---- GST / Invoice Settings ----
  const logoUploadInput = document.getElementById('logoUploadInput');
  if(logoUploadInput) logoUploadInput.onchange = async ()=>{
    const file = logoUploadInput.files && logoUploadInput.files[0];
    if(!file) return;
    if(file.size > 800*1024){ uiAlert('Logo image bahut badi hai (max 800KB). Chhota size ki image try karein.'); return; }
    const dataUrl = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    DATA.settings.logoDataUrl = dataUrl;
    await saveData(); render();
  };
  const removeLogoBtn = document.getElementById('removeLogoBtn');
  if(removeLogoBtn) removeLogoBtn.onclick = async ()=>{
    DATA.settings.logoDataUrl = '';
    await saveData(); render();
  };
  const signatureUploadInput = document.getElementById('signatureUploadInput');
  if(signatureUploadInput) signatureUploadInput.onchange = async ()=>{
    const file = signatureUploadInput.files && signatureUploadInput.files[0];
    if(!file) return;
    if(file.size > 800*1024){ uiAlert('Signature image bahut badi hai (max 800KB). Chhota size ki image try karein.'); return; }
    const dataUrl = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    DATA.settings.signatureDataUrl = dataUrl;
    await saveData(); render();
  };
  const removeSignatureBtn = document.getElementById('removeSignatureBtn');
  if(removeSignatureBtn) removeSignatureBtn.onclick = async ()=>{
    DATA.settings.signatureDataUrl = '';
    await saveData(); render();
  };
  const saveBrandingBtn = document.getElementById('saveBrandingBtn');
  if(saveBrandingBtn) saveBrandingBtn.onclick = async ()=>{
    DATA.settings.businessName = document.getElementById('businessNameInput').value.trim();
    DATA.settings.invoicePhone = document.getElementById('invoicePhoneInput').value.replace(/\D/g,'');
    DATA.settings.invoiceTerms = document.getElementById('invoiceTermsInput').value.trim() || DEFAULT_INVOICE_TERMS;
    DATA.settings.instagramUrl = document.getElementById('instagramUrlInput').value.trim();
    DATA.settings.youtubeUrl = document.getElementById('youtubeUrlInput').value.trim();

    // Third-party finance IS counted as paid (the financer pays the shop upfront).

      if(p.mode==='Finance' && p.financeType==='self') return s; // excluded — not yet real cash
      return s + Number(p.amount||0);
    },0);
    const due = Math.max(0, netTotal-effectivePaid);
    const invId = uid('inv');
    const date = today();
    saleCart.forEach(it=>{

    });
    DATA.invoiceCounter = (DATA.invoiceCounter||0) + 1;
    DATA.invoices.push({id:invId, no:DATA.invoiceCounter, date, customerId:cust.id, items:saleCart, subtotal, discount, total:netTotal, payments:salePayments, due, interstate:saleInterstate});

    // Finance payments -> create an EMI plan with a per-month installment schedule

      if(p.mode==='Finance'){
        const principal = Number(p.amount)||0;
        const tenure = Math.max(1, Number(p.tenureMonths)||1);
        const startDate = p.firstDueDate || date;
        const perInstall = Math.floor(principal/tenure);
        let remaining = principal;
        const installments = [];
        for(let i=0;i<tenure;i++){
          const amt = (i===tenure-1) ? remaining : perInstall;
          remaining -= amt;
          installments.push({id:uid('inst'), no:i+1, dueDate:addMonths(startDate,i), amount:amt, status:'pending', paidDate:null, paidAmount:0});
        }
        DATA.emiPlans.push({id:uid('emi'), invoiceId:invId, customerId:cust.id, financerName:p.financerName, financeType:p.financeType||'thirdparty', principal, tenureMonths:tenure, startDate, installments, createdAt:date});
      }
      if(p.mode==='Exchange'){
        // IMEI is now mandatory for every exchanged phone (validated above before the
        // payment was even added), so it's always recorded with its real IMEI —
        // exactly the same way a freshly purchased mobile is recorded in stock.
        DATA.mobiles.push({imei:p.exImei, brand:p.exBrand, model:p.exModel||'', purchasePrice:Number(p.amount)||0, salePrice:0, purchaseDate:date, status:'instock', source:'exchange', condition:p.exCondition||'', fromCustomerId:cust.id, fromInvoiceId:invId});
      }
    });

    let saved = await saveData();
    if(!saved) saved = await saveData(); // one retry — storage errors are sometimes transient
    if(!saved){
      uiAlert('⚠️ ZAROORI: Ye sale is browser mein SAVE nahi ho paayi (storage full/blocked ho sakta hai). Turant ⚙ Settings mein jaakar Backup lein aur is sale ka record kahin aur (kaagaz/note) likh lein, warna ye data kho sakta hai.');

  document.querySelectorAll('[data-recordpayment]').forEach(b=>b.onclick=async ()=>{
    const [planId, instId] = b.dataset.recordpayment.split('|');
    const plan = DATA.emiPlans.find(p=>p.id===planId);
    const inst = plan && plan.installments.find(i=>i.id===instId);
    if(!inst) return;
    const alreadyPaid = Number(inst.paidAmount||0);
    const remainingDue = Number(inst.amount) - alreadyPaid;
    const input = await uiPrompt('Enter amount received for EMI #'+inst.no+' (remaining due: '+fmt(remainingDue)+'):', String(remainingDue));
    if(input===null) return;
    const entered = Number(input);
    if(!entered || entered<=0){ uiAlert('Please enter a valid amount.'); return; }
    const newTotal = alreadyPaid + entered;
    if(newTotal < Number(inst.amount)){
      inst.paidAmount = newTotal;
      inst.remainingAfterPartial = Number(inst.amount) - newTotal;
      inst.status = 'partial';
    } else {
      const extra = newTotal - Number(inst.amount);
      inst.paidAmount = Number(inst.amount);
      inst.status = 'paid';
      inst.paidDate = today();
      delete inst.remainingAfterPartial;
      if(extra > 0){
        const next = plan.installments.filter(x=>x.no > inst.no && x.status!=='paid' && x.status!=='cancelled').sort((a,b)=>a.no-b.no)[0];
        if(next){
          next.amount = Math.max(0, Number(next.amount) - extra);
        } else {
          // No later installment to absorb this into (it was the last one). This extra
          // amount does NOT touch the customer's sale-ledger balance (that was already
          // settled at sale time via the Finance payment, same as every other EMI
          // collection) — it's simply tracked on the plan itself so it stays visible
          // instead of silently disappearing, and shows up on the EMI screen as an
          // amount to return/adjust with the customer.
          plan.extraOverpaid = Number(plan.extraOverpaid||0) + extra;
        }
      }
    }
    // Record this collection separately (does NOT touch customer ledger balance —
    // that's already settled at sale time via the Finance payment — but it DOES
    // now show up in Reports → Payment Modes, so actual cash/UPI collected against
    // EMIs is visible for daily cash reconciliation instead of disappearing.
    if(!DATA.emiCollections) DATA.emiCollections=[];
    DATA.emiCollections.push({id:uid('emicol'), planId, instId, customerId:plan.customerId, date:today(), amount:entered, note:'EMI #'+inst.no+' — '+(plan.financerName||'')});
    logAudit('payment', 'emi-installment', inst.id, 'EMI installment #'+inst.no+' ('+(plan.financerName||'financer')+') payment received: '+fmt(entered), {paidAmount:alreadyPaid, status:'before'}, {paidAmount:inst.paidAmount, status:inst.status});
    await saveData(); render();

  document.querySelectorAll('[data-emiremind]').forEach(b=>b.onclick=()=>{
    const [planId, instId] = b.dataset.emiremind.split('|');

    const inst = plan && plan.installments.find(i=>i.id===instId);
    if(!plan || !inst) return;
    const cust = DATA.customers.find(c=>c.id===plan.customerId);

    if(phone.length===10) phone = '91'+phone;

    custListSearch.oninput=(e)=>{ customerListFilter=e.target.value; render(); };
    custListSearch.focus();
    custListSearch.setSelectionRange(custListSearch.value.length, custListSearch.value.length);
  }

  document.querySelectorAll('[data-viewcustledger]').forEach(b=>b.onclick=()=>{
    const cust = DATA.customers.find(c=>c.id===b.dataset.viewcustledger);
    showCustomerLedger(cust);
    document.getElementById('custHistoryBox').scrollIntoView({behavior:'smooth'});
  });

  document.querySelectorAll('[data-editcust]').forEach(b=>b.onclick=()=>{
    editingCustomerId = b.dataset.editcust;
    render();
  });
  if(editingCustomerId) wireNumericPhoneInput(document.getElementById('ecPhone_'+editingCustomerId));
  document.querySelectorAll('[data-canceledit]').forEach(b=>b.onclick=()=>{
    editingCustomerId = null;
    render();
  });
  document.querySelectorAll('[data-savecustedit]').forEach(b=>b.onclick=async ()=>{
    const custId = b.dataset.savecustedit;
    const cust = DATA.customers.find(c=>c.id===custId);
    if(!cust) return;
    if(!(await askEditPin('edit customer "'+cust.name+'" details'))) return;
    const newPhone = validCustomerPhone(document.getElementById('ecPhone_'+custId).value);
    const newName = document.getElementById('ecName_'+custId).value.trim();
    const newAddr = document.getElementById('ecAddr_'+custId).value.trim();
    if(!newPhone || !newName){ uiAlert('Naam aur ek valid mobile number (kam se kam 10 digit, sirf numbers — koi letter nahi) zaroori hai'); return; }
    const dup = findCustomerByPhone(newPhone);
    if(dup && dup.id!==custId){ uiAlert('Ye mobile number pehle se "'+dup.name+'" ke naam par registered hai. Ek number sirf ek hi customer ka ho sakta hai.'); return; }
    const before = {name:cust.name, phone:cust.phone, address:cust.address};
    cust.phone = newPhone; cust.name = newName; cust.address = newAddr;
    logAudit('edit', 'customer', cust.id, 'Customer details updated', before, {name:cust.name, phone:cust.phone, address:cust.address});
    editingCustomerId = null;
    await saveData(); render();
  });

  document.querySelectorAll('[data-delcust]').forEach(b=>b.onclick=async ()=>{
    const cust = DATA.customers.find(c=>c.id===b.dataset.delcust);
    if(!cust) return;
    if(!(await askEditPin('delete customer "'+cust.name+'"'))) return;
    if(customerHasHistory(cust.id)){
      uiAlert('"'+cust.name+'" ('+cust.phone+') ki bills, EMI ya payment history hai — isliye ise delete nahi kiya ja sakta, warna purane bills/reports mein customer ka record toot jayega. Agar sirf naya/galat bana hua duplicate customer hai jiska koi bill nahi hai, tabhi delete hoga.');
      return;
    }
    if(!(await uiConfirm('"'+cust.name+'" ('+cust.phone+') ko hamesha ke liye delete karna hai? Ismein koi bill/history nahi hai. Ye action wapas nahi ho sakta.'))) return;
    const idx = DATA.customers.findIndex(x=>x.id===cust.id);
    const before = {...cust};
    if(idx>-1) DATA.customers.splice(idx,1);
    logAudit('delete', 'customer', cust.id, 'Customer "'+cust.name+'" ('+cust.phone+') permanently deleted (no history)', before, null);
    await saveData(); render();
  });

  // ---- Jump to a linked customer/supplier ledger from the OTHER ledger page (cross-navigation) ----
  document.querySelectorAll('[data-gotocustledger]').forEach(b=>b.onclick=()=>{
    viewingCustomerId = b.dataset.gotocustledger;
    setView('customers');
  });
  document.querySelectorAll('[data-gotosupledger]').forEach(b=>b.onclick=()=>{
    viewingSupplierId = b.dataset.gotosupledger;
    purchaseView='suppliers';
    setView('purchase');
  });

  // ---- Reports ----
  const reportFromInput = document.getElementById('reportFromInput');
  if(reportFromInput) reportFromInput.onchange=(e)=>{ reportFrom = e.target.value; render(); };
  const reportToInput = document.getElementById('reportToInput');
  if(reportToInput) reportToInput.onchange=(e)=>{ reportTo = e.target.value; render(); };
  document.querySelectorAll('[data-reportquick]').forEach(b=>b.onclick=()=>{
    const kind = b.dataset.reportquick;
    if(kind==='thisMonth'){
      reportFrom = today().slice(0,7)+'-01';
      reportTo = today();
    } else if(kind==='lastMonth'){
      const d = new Date();
      d.setDate(1);
      d.setMonth(d.getMonth()-1);
      const y = d.getFullYear(), mo = d.getMonth();
      const pad = n=>String(n).padStart(2,'0');
      reportFrom = `${y}-${pad(mo+1)}-01`;
      const lastDay = new Date(y, mo+1, 0).getDate();
      reportTo = `${y}-${pad(mo+1)}-${pad(lastDay)}`;
    } else if(kind==='thisWeek'){
      const d = new Date();
      const day = d.getDay(); // 0=Sunday
      const diffToMonday = (day===0? 6 : day-1);
      const monday = new Date(d);
      monday.setDate(d.getDate()-diffToMonday);
      reportFrom = monday.toISOString().slice(0,10);
      reportTo = today();
    } else {
      reportFrom = ''; reportTo = '';
    }
    render();
  });
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>runReport(b.dataset.report));
  document.querySelectorAll('[data-viewreport]').forEach(b=>b.onclick=()=>{
    const kind = b.dataset.viewreport;
    reportViewKind = (reportViewKind===kind) ? null : kind;
    paymentModeDrilldown = null;
    render();
    const panel = document.getElementById('reportViewPanel');
    if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.querySelectorAll('[data-closereportview]').forEach(b=>b.onclick=()=>{ reportViewKind=null; paymentModeDrilldown=null; render(); });
  document.querySelectorAll('[data-pmoderow]').forEach(el=>el.onclick=()=>{
    const m = el.dataset.pmoderow;
    paymentModeDrilldown = (paymentModeDrilldown===m) ? null : m;
    render();
  });

  // ---- Single-record export (per customer/supplier/mobile/accessory/purchase) ----
  document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{
    const [kind, id, format] = b.dataset.export.split('|');
    exportSingleRecord(kind, id, format);
  });
  document.querySelectorAll('[data-exportfolder]').forEach(b=>b.onclick=(e)=>{
    e.preventDefault();
    const [cat, format] = b.dataset.exportfolder.split('|');
    exportAccessoryFolder(cat, format);
  });

  // ---- Universal Search ----
  const runGlobalSearch = ()=>{
    const box = document.getElementById('globalSearchResult');
    if(!box) return;
    if(!searchQuery && !searchFrom && !searchTo){ box.innerHTML=''; return; }
    box.innerHTML = renderGlobalSearchResults(searchQuery, searchFrom, searchTo);
    wireReturnButtons(box, runGlobalSearch);
  };
  const globalSearchInput = document.getElementById('globalSearchInput');
  if(globalSearchInput){
    globalSearchInput.oninput=(e)=>{ searchQuery=e.target.value; };
    globalSearchInput.onkeydown=(e)=>{ if(e.key==='Enter') runGlobalSearch(); };
    globalSearchInput.focus();
    globalSearchInput.setSelectionRange(globalSearchInput.value.length, globalSearchInput.value.length);
  }
  const globalSearchFrom = document.getElementById('globalSearchFrom');
  if(globalSearchFrom) globalSearchFrom.onchange=(e)=>{ searchFrom=e.target.value; };
  const globalSearchTo = document.getElementById('globalSearchTo');
  if(globalSearchTo) globalSearchTo.onchange=(e)=>{ searchTo=e.target.value; };
  const globalSearchBtn = document.getElementById('globalSearchBtn');
  if(globalSearchBtn) globalSearchBtn.onclick=runGlobalSearch;
}

initApp();
</script>
</body>
</html>
